// BACKUP (owner only) — نسخة احتياطية كاملة: xlsx + JSON (+ مجلد على الجهاز + المرفقات + نسخة طوارئ من الصفحة)
// ============================================================
const BACKUP_TABLES = [
  ['erp_suppliers','الموردون'], ['erp_purchase_orders','أوامر الشراء'], ['erp_po_line_items','بنود الأوامر'],
  ['erp_payments','الدفعات'], ['erp_payment_comments','تعليقات الدفعات'],
  ['erp_shipments','الشحنات'], ['erp_shipment_items','أصناف الشحنات'], ['erp_shipment_containers','حاويات الشحنات'],
  ['erp_season_plan','خطة الموسم'], ['erp_samples','العينات'],
  ['erp_warehouse_receipts','استلام المستودع'], ['erp_warehouse_receipt_lines','بنود الاستلام'], ['erp_warehouse_receipt_pos','ربط الاستلام بالأوامر'],
  ['erp_attachments','المرفقات'], ['erp_profiles','الحسابات'],
  ['erp_audit_log','سجل التعديلات'], ['erp_audit_archive','أرشيف السجل'],
];
const BACKUP_STALE_DAYS = 7;
let backupBusy = false;

// --- حفظ مقبض المجلد في IndexedDB (المتصفح يتذكره بين الجلسات) ---
function idbOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open('erp-backup-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){ const db = await idbOpen(); return new Promise((res, rej)=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k, v){ const db = await idbOpen(); return new Promise((res, rej)=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(k){ const db = await idbOpen(); return new Promise((res, rej)=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
const canPickFolder = () => typeof window.showDirectoryPicker === 'function';

async function fetchAllRows(table){
  const out = []; const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from + PAGE - 1);
    if (error) throw error;
    out.push(...(data||[]));
    if (!data || data.length < PAGE) break;
  }
  return out;
}
function backupStamp(d=new Date()){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function cellSafe(v){
  if (v == null) return '';
  if (typeof v === 'object') v = JSON.stringify(v);
  if (typeof v === 'string' && v.length > 32000) return v.slice(0, 32000) + '…[مقتطع — النص الكامل في ملف JSON]';
  return v;
}
function buildBackupFiles(data, stamp, meta){
  const wb = XLSX.utils.book_new();
  const idx = BACKUP_TABLES.map(([t,label])=>({ الجدول:t, الوصف:label, عدد_السجلات:(data[t]||[]).length }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(idx), 'فهرس');
  BACKUP_TABLES.forEach(([t])=>{
    const rows = (data[t]||[]).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k, cellSafe(v)])));
    const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['(لا توجد سجلات)']]);
    XLSX.utils.book_append_sheet(wb, ws, t.replace(/^erp_/,'').slice(0,31));
  });
  const xlsxBytes = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const jsonText = JSON.stringify({ meta, tables: data }, null, 1);
  return {
    xlsx: { name:`procurement-backup_${stamp}.xlsx`, blob:new Blob([xlsxBytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}) },
    json: { name:`procurement-backup_${stamp}.json`, blob:new Blob([jsonText], {type:'application/json'}) },
  };
}
function downloadBlob(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
}
async function writeToDir(dirHandle, name, blob){
  const fh = await dirHandle.getFileHandle(name, { create:true });
  const w = await fh.createWritable(); await w.write(blob); await w.close();
}
async function dirHas(dirHandle, name){ try { await dirHandle.getFileHandle(name); return true; } catch(e){ return false; } }
async function ensureFolderPermission(h){
  const opts = { mode:'readwrite' };
  if ((await h.queryPermission(opts)) === 'granted') return true;
  return (await h.requestPermission(opts)) === 'granted';
}
const BACKUP_README = `نسخة احتياطية — منظومة المشتريات (العز للعود)
==============================================
procurement-backup_<التاريخ>.xlsx : كل الجداول، كل جدول في ورقة، وورقة "فهرس" بعدد السجلات.
procurement-backup_<التاريخ>.json : نفس البيانات كاملة (هذا الملف هو المرجع عند الاستعادة؛ إكسل يقتطع الخلايا الأطول من 32 ألف حرف).
attachments\\ : ملفات المرفقات (فواتير/بوالص…) باسم <رقم المرفق>_<الاسم الأصلي>.
app-copy\\index.html : نسخة طوارئ من الصفحة نفسها. تُفتح بالنقر المزدوج وتتصل بنفس قاعدة البيانات (تحتاج إنترنت).
الاستعادة: افتح ملف JSON وأعد إدخال الجداول بالترتيب (الموردون ← الأوامر ← البنود ← الدفعات ← الشحنات…) أو اطلب من مطوّر المنظومة تشغيل سكربت الاستعادة.
`;

async function runBackup(mode, opts, ui){
  if (backupBusy) return; backupBusy = true;
  const say = (m)=>{ if (ui) ui.textContent = m; };
  try {
    let dir = null;
    if (mode === 'folder') {
      dir = await idbGet('dir');
      if (!dir) { toast('اختر المجلد أولًا'); return; }
      if (!(await ensureFolderPermission(dir))) { toast('لم يُمنح إذن الكتابة في المجلد'); return; }
    }
    const data = {}, failed = [], counts = {};
    for (const [t, label] of BACKUP_TABLES) {
      say(`جارٍ قراءة: ${label}…`);
      try { data[t] = await fetchAllRows(t); } catch(e){ data[t] = []; failed.push(`${t}: ${e.message||e}`); }
      counts[t] = data[t].length;
    }
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const stamp = backupStamp();
    const meta = { created_at:new Date().toISOString(), created_by:currentUser && currentUser.email, source:location.origin+location.pathname, counts, failed_tables:failed, note:'نسخة كاملة من جداول erp_* ' };
    say('جارٍ تجهيز الملفات…');
    const files = buildBackupFiles(data, stamp, meta);
    const names = [files.xlsx.name, files.json.name];
    if (mode === 'folder') {
      say('جارٍ الكتابة في المجلد…');
      await writeToDir(dir, files.xlsx.name, files.xlsx.blob);
      await writeToDir(dir, files.json.name, files.json.blob);
      if (!(await dirHas(dir, 'اقرأني.txt'))) await writeToDir(dir, 'اقرأني.txt', new Blob([BACKUP_README], {type:'text/plain;charset=utf-8'}));
      // نسخة طوارئ من الصفحة
      try {
        const html = await (await fetch(location.origin + location.pathname, { cache:'no-store' })).blob();
        const app = await dir.getDirectoryHandle('app-copy', { create:true });
        await writeToDir(app, 'index.html', html); names.push('app-copy/index.html');
      } catch(e){ failed.push('app-copy: '+(e.message||e)); }
      // المرفقات (تُنسخ الجديدة فقط)
      if (opts && opts.attachments) {
        const attDir = await dir.getDirectoryHandle('attachments', { create:true });
        const atts = data.erp_attachments || []; let done = 0, copied = 0;
        for (const a of atts) {
          done++; say(`المرفقات ${done}/${atts.length}…`);
          const fname = `${a.id}_${(a.file_name||'file').replace(/[\\/:*?"<>|]/g,'_')}`;
          if (await dirHas(attDir, fname)) continue;
          try {
            const { data: blob, error } = await sb.storage.from('erp-attachments').download(a.file_path);
            if (error) throw error;
            await writeToDir(attDir, fname, blob); copied++;
          } catch(e){ failed.push(`مرفق ${a.file_name||a.id}: ${e.message||e}`); }
        }
        names.push(`attachments/ (${copied} جديد)`);
      }
    } else {
      downloadBlob(files.xlsx.name, files.xlsx.blob);
      setTimeout(()=>downloadBlob(files.json.name, files.json.blob), 600);
    }
    await sb.from('erp_backup_log').insert({ kind:'manual', destination: mode==='folder'?'folder':'download', total_rows:total, row_counts:counts, failed_tables:failed, file_names:names });
    await refreshAll();
    toast(failed.length ? `تمت النسخة مع ${failed.length} تنبيه — راجع الجدول` : `تمت النسخة الاحتياطية (${total} سجل)`);
    if (failed.length) alert('تنبيهات النسخة:\n' + failed.join('\n'));
  } catch(e) {
    console.error(e); toast('تعذّرت النسخة: ' + (e.message||e));
  } finally { backupBusy = false; renderActiveTab(); }
}

function lastBackup(){ return (cache.backupLog||[])[0] || null; }
function backupIsStale(){
  const b = lastBackup(); if (!b) return true;
  return (Date.now() - new Date(b.created_at).getTime()) > BACKUP_STALE_DAYS*86400000;
}

function renderBackup(root){
  const last = lastBackup();
  const logs = (cache.backupLog||[]).slice(0,15);
  root.innerHTML = `
    <div class="card">
      <strong>النسخ الاحتياطي (للمالك فقط)</strong>

      ${backupIsStale() ? '<span class="badge warn">تجاوزت '+BACKUP_STALE_DAYS+' أيام — خذ نسخة الآن</span>' : '<span class="badge ok">حديثة</span>'}</p>
      <p class="muted">قاعدة 3-2-1: نسخة في قاعدة البيانات (Supabase تحفظ نسخًا يومية) + نسخة على جهازك/OneDrive + نسخة ثالثة خارجية (فلاشة أو حساب آخر). الحفظ في مجلد OneDrive يعني أنه يتزامن تلقائيًا مع السحابة.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn" id="bk-now">⬇️ نسخة كاملة الآن (تنزيل xlsx + json)</button>
      </div>
      <p id="bk-status" class="muted" style="margin-top:8px"></p>
    </div>
    <div class="card" style="margin-top:12px">
      <strong>الحفظ المباشر في مجلد على جهازك (مثل مجلد قسم المشتريات في OneDrive)</strong>
      ${canPickFolder() ? `
        <p class="muted" style="margin-top:6px">يعمل في Chrome/Edge على الكمبيوتر. تختار المجلد مرة واحدة والمتصفح يتذكره؛ بعدها زر واحد يكتب النسخة + المرفقات + نسخة طوارئ من الصفحة داخله. المتصفح قد يطلب تأكيد الإذن بعد إعادة فتحه.</p>
        <p id="bk-folder" class="muted">المجلد المختار: …</p>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn" id="bk-pick">📁 اختيار المجلد</button>
          <button class="btn" id="bk-folder-run" disabled>💾 نسخة كاملة إلى المجلد</button>
          <button class="btn small" id="bk-forget" style="display:none">إلغاء ربط المجلد</button>
        </div>
        <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="bk-att" checked style="width:auto"> نسخ ملفات المرفقات أيضًا (الجديدة فقط في كل مرة)</label>`
      : `<p class="muted" style="margin-top:6px">متصفحك لا يدعم الكتابة المباشرة في مجلد. استخدم زر "نسخة كاملة الآن" ثم انقل الملفين إلى المجلد، أو افتح المنظومة من Chrome/Edge.</p>`}
    </div>
    <div class="card" style="margin-top:12px">
      <strong>سجل النسخ</strong>
      <div style="overflow:auto;margin-top:8px"><table>
        <thead><tr><th>الوقت</th><th>الوجهة</th><th>السجلات</th><th>تنبيهات</th><th>الملفات</th></tr></thead>
        <tbody>${logs.length ? logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('ar-SA')}</td><td>${l.destination==='folder'?'مجلد':'تنزيل'}</td><td>${l.total_rows}</td><td>${(l.failed_tables||[]).length?escHtml((l.failed_tables||[]).join(' | ')):'—'}</td><td style="font-size:11px">${escHtml((l.file_names||[]).join(' · '))}</td></tr>`).join('') : '<tr><td colspan="5" class="muted">لا يوجد</td></tr>'}</tbody>
      </table></div>
    </div>`;
  const ui = root.querySelector('#bk-status');
  root.querySelector('#bk-now').onclick = () => runBackup('download', {}, ui);
  if (!canPickFolder()) return;
  const lbl = root.querySelector('#bk-folder'), runBtn = root.querySelector('#bk-folder-run'), forget = root.querySelector('#bk-forget');
  const showDir = async () => {
    const h = await idbGet('dir').catch(()=>null);
    lbl.textContent = h ? `المجلد المختار: ${h.name}` : 'لم يُختر مجلد بعد';
    runBtn.disabled = !h; forget.style.display = h ? '' : 'none';
  };
  showDir();
  root.querySelector('#bk-pick').onclick = async () => {
    try {
      const h = await window.showDirectoryPicker({ mode:'readwrite', id:'erp-backup' });
      await idbSet('dir', h); await showDir(); toast('تم ربط المجلد');
    } catch(e){ if (e && e.name !== 'AbortError') toast('تعذّر اختيار المجلد: '+(e.message||e)); }
  };
  forget.onclick = async () => { await idbDel('dir'); await showDir(); };
  runBtn.onclick = () => runBackup('folder', { attachments: root.querySelector('#bk-att').checked }, ui);
}

(async function init(){

  const sessionPromise = sb.auth.getSession();
  const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({ data: { session: null }, timedOut: true }), 8000));
  const result = await Promise.race([sessionPromise, timeoutPromise]);
  if (result.timedOut) {
    console.warn('getSession() timed out after 8s (possible stuck navigator.locks); showing login screen');
  }
  currentUser = result.data.session ? result.data.session.user : null;
  await boot();
})();

      const cur=n.nodeValue; if(!AR.test(cur)) return; const t=trText(cur);
      if(t!==cur){ ORIG.set(n,cur); n.nodeValue=t; }
    } else if(n.nodeType===1){
      if(SKIP.has(n.nodeName)||n.closest('[data-no-i18n]')) return;
      for(const a of ATTRS){ const v=n.getAttribute&&n.getAttribute(a); if(v&&AR.test(v)){ const t=trText(v); if(t!==v){ let o=ORIGA.get(n); if(!o){o={};ORIGA.set(n,o);} o[a]=v; n.setAttribute(a,t); } } }
      for(let c=n.firstChild;c;c=c.nextSibling) tNode(c);
    }
  }
  function restoreAll(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; busy=true;
    while((n=w.nextNode())){ if(ORIG.has(n)){ n.nodeValue=ORIG.get(n); ORIG.delete(n); } }
    root.querySelectorAll('*').forEach(el=>{ const o=ORIGA.get(el); if(o){ for(const a in o) el.setAttribute(a,o[a]); ORIGA.delete(el); } });
    busy=false;
  }
  const mo = new MutationObserver(muts=>{
    if(busy||V2.lang!=='en') return; busy=true;
    try{
      for(const m of muts){
        if(m.type==='childList') m.addedNodes.forEach(tNode);
        else if(m.type==='characterData') tNode(m.target);
        else if(m.type==='attributes') tNode(m.target);
      }
    } finally { busy=false; }
  });
  function startObserver(){ mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS}); }

  // native dialogs
  ['alert','confirm','prompt'].forEach(fn=>{ const o=window[fn].bind(window); window[fn]=(m,...r)=>o(V2.lang==='en'?trText(String(m)):m,...r); });

  function applyLang(rerender){
    const h=document.documentElement;
    h.lang=V2.lang; h.dir=V2.lang==='en'?'ltr':'rtl';
    document.title = T('نظام المشتريات — العز للعود','Procurement System — Al Ezz Oud');
    busy=true; try{ if(V2.lang==='en') tNode(document.body); else restoreAll(document.body); } finally{ busy=false; }
    const b=document.getElementById('tb-lang'); if(b) b.textContent = V2.lang==='en'?'عربي':'EN';
    const b3=document.getElementById('tb-3d'); if(b3){ b3.innerHTML='🧊<span class="lbl"> 3D '+(window.__NO3D?T('إيقاف','off'):T('تشغيل','on'))+'</span>'; b3.setAttribute('aria-pressed',String(!window.__NO3D)); }
    applyTheme();
    if(rerender!==false && typeof currentProfile!=='undefined' && currentProfile && typeof renderTabs==='function'){ renderTabs(); renderActiveTab(); }
  }

  // ---------------- formatters (Gregorian + Latin digits; see audit note) ----------------
  window.fmtDate = function(d){
    if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return '—';
    return dt.toLocaleDateString(V2.lang==='en'?'en-GB':'ar-EG-u-nu-latn-ca-gregory',{day:'2-digit',month:'2-digit',year:'numeric'});
  };
  window.fmtNum = function(n){ return n!=null && n!=='' ? Number(n).toLocaleString('en-US',{maximumFractionDigits:2}) : '—'; };

  // ---------------- toolbar ----------------
  function injectTools(){
    const bar=document.querySelector('.topbar'); if(!bar||document.getElementById('tb-tools')) return;
    const d=document.createElement('div'); d.className='tb-tools'; d.id='tb-tools';
    d.innerHTML=`<button class="tb-btn" id="tb-3d" title="3D" aria-pressed="true"></button><button class="tb-btn" id="tb-theme" title="Theme"></button><button class="tb-btn" id="tb-lang" title="Language"></button>`;
    const who=document.getElementById('whoami'); bar.insertBefore(d, who);
    d.querySelector('#tb-lang').onclick=()=>{ V2.lang=V2.lang==='en'?'ar':'en'; LS.set('ezz_lang',V2.lang); applyLang(true); };
    d.querySelector('#tb-theme').onclick=()=>{ V2.theme=isDark()?'light':'dark'; LS.set('ezz_theme',V2.theme); applyTheme(); if(typeof currentProfile!=='undefined' && currentProfile) renderActiveTab(); };
    d.querySelector('#tb-3d').onclick=()=>{ window.__NO3D=!window.__NO3D; LS.set('ezz_no3d',window.__NO3D?'1':'0'); applyLang(true); };
  }

  // ---------------- enhancements run after every render ----------------
  const TAB_GO = [
    [/إجمالي أوامر الشراء|أوامر مفتوحة|أوامر مُغلقة|إجمالي المبلغ|متوسط قيمة الأمر|متوسط عمر|أقدم أمر|متوسط مدة التوريد|نسبة الرفع/, 'orders'],
    [/دفعات متأخرة/, 'payments'], [/شحنات نشطة/, 'shipments'], [/موردون نشطون|تركّز/, 'suppliers'], [/خطة الموسم/, 'season'],
  ];
  const reducedMotion = ()=> window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(el){
    const txt=el.textContent.trim(); const m=txt.match(/^(-?[\d,]*\.?\d+)(.*)$/); if(!m||reducedMotion()) return;
    const num=parseFloat(m[1].replace(/,/g,'')); if(!isFinite(num)||num===0) return;
    const dec=(m[1].split('.')[1]||'').length, suf=m[2], dur=900, t0=performance.now();
    el.setAttribute('aria-label',txt);
    (function step(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=(num*e).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
      if(k<1) requestAnimationFrame(step); else el.textContent=txt; })(t0);
  }
  window.v2EnhanceKpis = function(scope){
    (scope||document).querySelectorAll('.kpi-card:not([data-v2])').forEach((c,i)=>{
      c.dataset.v2='1'; c.style.animationDelay=(i*35)+'ms';
      const ic=c.querySelector('.kpi-icon'); if(ic && !ic.querySelector('span')) ic.innerHTML='<span>'+ic.innerHTML+'</span>';
      const fill=c.querySelector('.kpi-bar-fill'); const w=fill?parseFloat(fill.style.width):NaN;
      if(ic && isFinite(w)) ic.style.setProperty('--p',Math.max(4,Math.min(100,w)));
      if(fill){ const to=fill.style.width; if(!reducedMotion()){ fill.style.width='0%'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ fill.style.width=to; })); } }
      const v=c.querySelector('.kpi-value'); if(v) countUp(v);
      if(!c.dataset.go){ const lab=(c.querySelector('.kpi-label')||{}).textContent||''; const hit=TAB_GO.find(g=>g[0].test(lab)); if(hit) c.dataset.go=hit[1]; }
      if(c.dataset.go){ c.tabIndex=0; c.setAttribute('role','button'); }
    });
  };
  document.addEventListener('click',e=>{
    const c=e.target.closest('.kpi-card[data-go]'); if(!c) return; goTab(c.dataset.go, c.dataset.stage||'');
  });
  document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.kpi-card[data-go]')){ e.preventDefault(); e.target.click(); } });
  window.goTab = function(tab, stage){
    window.LG_FILTER = stage||'';
    if(typeof TAB_DEFS!=='undefined' && !TAB_DEFS.some(t=>t.id===tab && t.roles.includes(currentProfile.role))) return;
    activeTab=tab; renderTabs(); renderActiveTab(); window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});
  };

  window.v2ResponsiveTables = function(scope){
    (scope||document).querySelectorAll('#tab-content table:not(.rt)').forEach(tb=>{
      const heads=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim()); if(!heads.length) return;
      tb.classList.add('rt');
      tb.querySelectorAll('tbody tr').forEach(tr=>{ [...tr.children].forEach((td,i)=>{ if(td.tagName==='TD'){ const h=heads[i]||''; td.setAttribute('data-label', V2.lang==='en'?trText(h):h); if(td.childNodes.length && !(td.children.length===1&&td.firstElementChild.classList.contains('tdv'))){ const w=document.createElement('div'); w.className='tdv'; while(td.firstChild) w.appendChild(td.firstChild); td.appendChild(w); } } }); });
    });
  };

  // ---------------- boot ----------------
  function boot(){
    const meta=document.createElement('meta'); meta.name='theme-color'; document.head.appendChild(meta);
    injectTools(); applyTheme(); startObserver();
    applyLang(false);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  window.v2ApplyLang=applyLang; window.v2ApplyTheme=applyTheme; window.v2IsDark=isDark; window.v2Tr=trText;
})();
</script>
<script>/* ===== v2 3D logistics stage (Three.js, lazy-loaded, with SVG fallback) =====
   Scene = procedural geometry only (no external images/models).
   Real data used: ship positions (progress between shipped_date and eta_date), container counts, stage counts.
   Decorative only: factory conveyor/bottles/smoke, waves. Out-load truck is a ghost (no out-load data in the system). */
window.Stage = (function(){
  const THREE_URL = window.__THREE_URL || 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
  const FOCUS = {
    all:       {x:0,  y:7.5, z:25, lx:0,  ly:1.2, ly2:0},
    factory:   {x:-9, y:5.2, z:13, lx:-9, ly:1.8},
    sea:       {x:-1, y:5.6, z:17, lx:-1, ly:.8},
    port:      {x:5,  y:5.4, z:15, lx:5,  ly:1.4},
    warehouse: {x:11, y:5.6, z:15, lx:11, ly:1.8},
  };
  let T=null, R=null, S=null, cam=null, host=null, canvasWrap=null, raf=0, running=false, failed=false, loading=null;
  let dark=false, focus='all', want={x:0,y:7.5,z:25,lx:0,ly:1.2}, cur={x:0,y:7.5,z:25,lx:0,ly:1.2}, yaw=0, yawT=0;
  let data={counts:{},ships:[],whStack:0,portStack:0}, dirty=true, visible=true, reduced=false, t0=0, clock=0;
  const obj={};  // named scene parts
  const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function box(w,h,d,color,opts){ const m=new T.Mesh(new T.BoxGeometry(w,h,d), mat(color,opts)); return m; }
  function mat(color,o){ return new T.MeshStandardMaterial(Object.assign({color,roughness:.7,metalness:.05},o||{})); }

  function bottleParts(){
    const prof=[[0,0],[.46,0],[.52,.06],[.54,.22],[.54,.98],[.5,1.1],[.24,1.2],[.18,1.34],[0,1.34]].map(p=>new T.Vector2(p[0],p[1]));
    const glassG=new T.LatheGeometry(prof,4); glassG.rotateY(Math.PI/4);
    const liqG=new T.LatheGeometry(prof.map(p=>new T.Vector2(p.x*.82,p.y*.8)),4); liqG.rotateY(Math.PI/4);
    return {glassG, liqG, capG:new T.CylinderGeometry(.2,.22,.3,16)};
  }

  function build(){
    S=new T.Scene();
    S.fog=new T.Fog(0x0b1d3f,38,80);
    const hemi=new T.HemisphereLight(0xcfe4ff,0x203050,1.0); S.add(hemi); obj.hemi=hemi;
    const sun=new T.DirectionalLight(0xffffff,1.6); sun.position.set(-8,16,12); S.add(sun); obj.sun=sun;
    const rim=new T.DirectionalLight(0x7aa7ff,.5); rim.position.set(14,6,-10); S.add(rim);

    // sea
    const seaG=new T.PlaneGeometry(90,40,90,36); seaG.rotateX(-Math.PI/2);
    const sea=new T.Mesh(seaG,new T.MeshStandardMaterial({color:0x1d6fb8,roughness:.35,metalness:.15,flatShading:true,transparent:true,opacity:.96}));
    sea.position.set(-4,-.2,-6); S.add(sea); obj.sea=sea; obj.seaBase=Float32Array.from(seaG.attributes.position.array);
    // ground / quay
    const ground=box(46,1.2,12,0x9aa7b8); ground.position.set(11,-.6,6); S.add(ground); obj.ground=ground;
    const quay=box(8,1.0,6,0x7d8a9c); quay.position.set(4.6,-.45,2.4); S.add(quay); obj.quay=quay;
    const road=box(24,.06,2.2,0x3a4458); road.position.set(10,.04,5.4); S.add(road);
    const dash=box(22,.02,.12,0xf2f2f2); dash.position.set(10,.09,5.4); S.add(dash);

    // ---- factory (x ~ -9) ----
    const f=new T.Group(); f.position.set(-10,0,1.5); S.add(f); obj.factory=f;
    const fb=box(7,3,4.2,0xc7cfdb); fb.position.y=1.5; f.add(fb); obj.fbody=fb;
    for(let i=0;i<3;i++){ const roof=new T.Mesh(new T.ExtrudeGeometry(new T.Shape([new T.Vector2(0,0),new T.Vector2(2.2,0),new T.Vector2(2.2,1.1)]),{depth:4.2,bevelEnabled:false}),mat(0x8d98ab)); roof.position.set(-3.3+i*2.25,3,-2.1); f.add(roof); }
    for(let i=0;i<2;i++){ const ch=new T.Mesh(new T.CylinderGeometry(.34,.42,3.3,14),mat(0xa94b3a)); ch.position.set(-2.2+i*1.2,4.5,-1.2); f.add(ch); }
    const win=box(5.6,.55,.05,0xffe8a8,{emissive:0xffd27a,emissiveIntensity:.55}); win.position.set(0,2,2.12); f.add(win);
    const belt=box(8.4,.35,1.3,0x2b3345); belt.position.set(0,.6,4.1); f.add(belt);
    const bp=bottleParts(); obj.bottles=[]; obj.bp=bp;
    const glassM=new T.MeshPhysicalMaterial({color:0xcfe9ff,transparent:true,opacity:.5,roughness:.04,metalness:0,clearcoat:1,clearcoatRoughness:.05});
    const liqM=new T.MeshStandardMaterial({color:0xd9a441,roughness:.3,emissive:0x6b4a10,emissiveIntensity:.35});
    const capM=new T.MeshStandardMaterial({color:0xcaa24a,metalness:.85,roughness:.25});
    obj.glassM=glassM;
    for(let i=0;i<9;i++){
      const g=new T.Group(); g.add(new T.Mesh(bp.glassG,glassM)); const lq=new T.Mesh(bp.liqG,liqM); g.add(lq); const cp=new T.Mesh(bp.capG,capM); cp.position.y=1.48; g.add(cp);
      g.scale.setScalar(.62); g.position.set(-4.2+i*1.0,.78,4.1); g.userData.i=i; f.add(g); obj.bottles.push(g);
    }
    obj.smoke=[]; const smG=new T.SphereGeometry(.38,10,8);
    for(let i=0;i<14;i++){ const m=new T.Mesh(smG,new T.MeshBasicMaterial({color:0xdfe6f2,transparent:true,opacity:0,depthWrite:false})); m.userData={ph:i/14,cx:-2.2+(i%2)*1.2}; f.add(m); obj.smoke.push(m); }
    // ---- port crane ----
    const crane=new T.Group(); crane.position.set(5.2,0,3.8); S.add(crane); obj.crane=crane;
    const cr=0xe0a21b;
    [[-1.7,-1],[1.7,-1],[-1.7,1],[1.7,1]].forEach(p=>{ const l=box(.22,5.6,.22,cr); l.position.set(p[0],2.8,p[1]); crane.add(l); });
    const beam=box(4.2,.3,.3,cr); beam.position.set(0,5.7,0); crane.add(beam);
    const boom=box(.3,.3,9,cr); boom.position.set(0,5.7,-3.2); crane.add(boom);
    const trolley=new T.Group(); trolley.position.set(0,5.4,-3); crane.add(trolley); obj.trolley=trolley;
    const rope=box(.05,2.2,.05,0x333333); rope.position.y=-1.1; trolley.add(rope);
    const hang=box(.9,.45,.4,0xe0413a); hang.position.y=-2.3; trolley.add(hang); obj.hang=hang;
    // ---- warehouse (x ~ 12) ----
    const w=new T.Group(); w.position.set(13,0,1.2); S.add(w); obj.wh=w;
    const wb=box(9,3.2,5,0xdfe5ee); wb.position.y=1.6; w.add(wb); obj.wbody=wb;
    const wroof=new T.Mesh(new T.ExtrudeGeometry(new T.Shape([new T.Vector2(-4.7,0),new T.Vector2(4.7,0),new T.Vector2(0,1.5)]),{depth:5.2,bevelEnabled:false}),mat(0x3b6ea8)); wroof.position.set(0,3.2,-2.6); w.add(wroof);
    for(let i=0;i<3;i++){ const d=box(1.5,2.1,.1,0x40506a); d.position.set(-2.6+i*2.6,1.05,2.55); w.add(d); }
    const sign=box(3.4,.55,.08,0x1f5eff,{emissive:0x1f5eff,emissiveIntensity:.5}); sign.position.set(0,2.85,2.56); w.add(sign);
    obj.whStackG=new T.Group(); obj.whStackG.position.set(0,0,0); w.add(obj.whStackG);
    // trucks
    function truck(color,ghost){
      const g=new T.Group(); const op=ghost?.28:1;
      const tr=box(2.8,1.0,1.0,color,{transparent:ghost,opacity:op}); tr.position.set(-.9,.75,0); g.add(tr);
      const cab=box(.9,.9,.95,ghost?0x9aa7b8:0x2a3550,{transparent:ghost,opacity:op}); cab.position.set(.9,.7,0); g.add(cab);
      [-1.6,-.2,.9].forEach(x=>{ const wl=new T.Mesh(new T.CylinderGeometry(.22,.22,1.05,12),mat(0x111111,{transparent:ghost,opacity:op})); wl.rotation.x=Math.PI/2; wl.position.set(x,.22,0); g.add(wl); });
      return g;
    }
    obj.truckIn=truck(0x16a34a,false); obj.truckIn.position.set(6,0,5.4); S.add(obj.truckIn);
    obj.truckOut=truck(0x9aa7b8,true); obj.truckOut.position.set(11,0,5.9); obj.truckOut.rotation.y=Math.PI; S.add(obj.truckOut);
    obj.ships=new T.Group(); S.add(obj.ships);
    obj.portG=new T.Group(); S.add(obj.portG);
    obj.dots=[]; // clouds
    for(let i=0;i<5;i++){ const c=new T.Mesh(new T.SphereGeometry(1,10,8),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35,depthWrite:false})); c.scale.set(3+Math.random()*2,.7,1.2); c.position.set(-18+i*9,12+Math.random()*3,-14); S.add(c); obj.dots.push(c); }
    applyTheme();
  }

  const CONT_COLORS=[0xe0413a,0x2a62d9,0xf0b429,0x1fa971,0x8b5cf6,0xf97316];
  function lineColor(n){ n=(n||'').toLowerCase(); if(/msc/.test(n)) return 0xf0b429; if(/cma/.test(n)) return 0x2a62d9; if(/esl|emirates/.test(n)) return 0x1fa971; return null; }
  function makeShip(nCont,line,laneZ){
    const g=new T.Group();
    const hullShape=new T.Shape([new T.Vector2(-3.4,0),new T.Vector2(2.6,0),new T.Vector2(3.6,.9),new T.Vector2(-3.4,.9)]);
    const hull=new T.Mesh(new T.ExtrudeGeometry(hullShape,{depth:1.7,bevelEnabled:false}),mat(0x22304a)); hull.position.z=-.85; g.add(hull);
    const stripe=box(6.9,.18,1.72,0xc4372f); stripe.position.set(-.2,.28,0); g.add(stripe);
    const bridge=box(1,1.3,1.4,0xf4f6fa); bridge.position.set(-2.7,1.55,0); g.add(bridge);
    const lc=lineColor(line); const n=Math.min(Math.max(nCont,1),18);
    for(let i=0;i<n;i++){
      const col=i%6, row=Math.floor(i/6);
      const c=box(.95,.5,.5,lc||CONT_COLORS[(i*5+nCont)%CONT_COLORS.length]);
      c.position.set(-1.5+col*.98,1.15+row*.52,((i%2)?.28:-.28)); g.add(c);
    }
    g.position.z=laneZ; return g;
  }
  function rebuildShips(){
    if(!S) return;
    while(obj.ships.children.length) obj.ships.remove(obj.ships.children[0]);
    obj.shipList=[];
    (data.ships||[]).slice(0,6).forEach((s,i)=>{
      const lane=-1.2-(i%3)*2.4;
      const g=makeShip(s.n||1,s.line,lane);
      g.userData={p:Math.min(Math.max(s.p==null?.5:s.p,0),1),lane,i};
      obj.ships.add(g); obj.shipList.push(g);
    });
    // port stack (arrived/clearing) and warehouse stack (received)
    while(obj.portG.children.length) obj.portG.remove(obj.portG.children[0]);
    const np=Math.min(data.portStack||0,12);
    for(let i=0;i<np;i++){ const c=box(.95,.5,.5,CONT_COLORS[i%6]); c.position.set(3.2+(i%4)*1.0,.25+Math.floor(i/4)*.52,3.6+(i%2)*.3); obj.portG.add(c); }
    while(obj.whStackG.children.length) obj.whStackG.remove(obj.whStackG.children[0]);
    const nw=Math.min(data.whStack||0,16);
    for(let i=0;i<nw;i++){ const b=box(.8,.55,.8,0xc99a5b); b.position.set(-3.4+(i%8)*.95,.28+Math.floor(i/8)*.58,-.6); obj.whStackG.add(b); }
    dirty=true;
  }

  function applyTheme(){
    if(!S) return;
    const sea=dark?0x1b5a97:0x2f86d0, fog=dark?0x0b1d3f:0xbcd9ff;
    obj.sea.material.color.setHex(sea); S.fog.color.setHex(fog);
    obj.hemi.intensity=dark?.75:1.15; obj.sun.intensity=dark?1.0:1.7;
    obj.ground.material.color.setHex(dark?0x4a566b:0xa7b3c4);
    obj.fbody.material.color.setHex(dark?0x8a94a8:0xcfd6e2); obj.wbody.material.color.setHex(dark?0xb8c2d3:0xe7ecf4);
    obj.dots.forEach(c=>c.material.opacity=dark?.12:.5);
  }

  function resize(){
    if(!R||!host) return;
    const w=host.clientWidth||600,h=host.clientHeight||300;
    R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  }
  function applyFocus(){
    const p=FOCUS[focus]||FOCUS.all; const w=host?host.clientWidth||600:600, h=host?host.clientHeight||300:300;
    const a=w/h, k=a<1.4?(1.4/a):1; // pull back on narrow screens
    want={x:p.x,y:p.y*(.7+.3*k),z:p.z*(focus==='all'?k:Math.min(k,1.5)),lx:p.lx,ly:p.ly}; if(focus==='all'&&a<1.4){ want.x=0; }
    if(reduced) { Object.assign(cur,want); }
    dirty=true;
  }

  function frame(ts){
    raf=0; if(!running||!R) return;
    const t=ts/1000; clock=t;
    if(!reduced){
      const sp=obj.seaBase, pos=obj.sea.geometry.attributes.position;
      for(let i=0;i<pos.count;i++){ const x=sp[i*3],z=sp[i*3+2]; pos.array[i*3+1]=Math.sin(x*.35+t*1.3)*.14+Math.cos(z*.45+t*1.0)*.12; }
      pos.needsUpdate=true; obj.sea.geometry.computeVertexNormals();
      obj.bottles.forEach(b=>{ b.position.x+=.011*60/60; if(b.position.x>4.4) b.position.x=-4.4; });
      obj.smoke.forEach(m=>{ const ph=(t*.18+m.userData.ph)%1; m.position.set(m.userData.cx+ph*1.4,5.8+ph*3,-1.2); m.scale.setScalar(.5+ph*1.4); m.material.opacity=(1-ph)*(dark?.28:.4); });
      (obj.shipList||[]).forEach(g=>{ const u=g.userData; const x=-6+u.p*13.5; g.position.x=x+Math.sin(t*.4+u.i)*.15; g.position.y=Math.sin(t*1.2+u.i*1.7)*.09; g.rotation.z=Math.sin(t*.9+u.i)*.015; });
      obj.trolley.position.z=-3+Math.sin(t*.5)*1.5; obj.hang.position.y=-2.3+Math.sin(t*1.0)*.5;
      obj.truckIn.position.x=6+((t*1.1)%7); obj.truckOut.position.x=13-((t*.9)%7);
      obj.dots.forEach((c,i)=>{ c.position.x+=.004; if(c.position.x>22) c.position.x=-26; });
    }
    // camera easing + gentle sway + yaw drag
    const k=reduced?1:.06;
    ['x','y','z','lx','ly'].forEach(a=>{ cur[a]+=(want[a]-cur[a])*k; });
    yaw+=(yawT-yaw)*.08;
    const sway=reduced?0:Math.sin(t*.12)*.8;
    cam.position.set(cur.x+sway+yaw*8, cur.y, cur.z);
    cam.lookAt(cur.lx+yaw*2, cur.ly, 0);
    R.render(S,cam);
    dirty=false;
    if(!reduced || dirty) raf=requestAnimationFrame(frame);
  }
  function loop(){ if(raf||!running) return; raf=requestAnimationFrame(frame); }
  function setRunning(v){ running=v&&visible&&!failed&&!document.hidden; if(running) loop(); else if(raf){ cancelAnimationFrame(raf); raf=0; } }

  async function init(){
    if(T||failed) return;
    if(loading) return loading;
    loading=(async()=>{
      try{
        const c=document.createElement('canvas'); if(!(c.getContext('webgl2')||c.getContext('webgl'))) throw new Error('no webgl');
        T=await import(THREE_URL);
        reduced=reduce();
        R=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});
        R.setPixelRatio(Math.min(window.devicePixelRatio||1, window.innerWidth<700?1.25:1.75));
        R.setClearColor(0x000000,0);
        cam=new T.PerspectiveCamera(36,2,.1,200);
        build(); rebuildShips();
        R.domElement.setAttribute('aria-hidden','true');
        // drag to look around (horizontal only; vertical scroll passes through on touch)
        R.domElement.style.touchAction='pan-y';
        let down=false,sx=0;
        R.domElement.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;R.domElement.setPointerCapture(e.pointerId);});
        R.domElement.addEventListener('pointermove',e=>{ if(!down)return; const dir=document.documentElement.dir==='rtl'?-1:1; yawT=Math.max(-1,Math.min(1,yawT+dir*(e.clientX-sx)/400)); sx=e.clientX; dirty=true; });
        const end=()=>{down=false; yawT=0;}; R.domElement.addEventListener('pointerup',end); R.domElement.addEventListener('pointercancel',end);
        document.addEventListener('visibilitychange',()=>setRunning(true));
        new ResizeObserver(()=>{ resize(); applyFocus(); dirty=true; }).observe(document.body);
        document.documentElement.classList.add('three-ready');
      }catch(err){ failed=true; console.warn('[Stage] 3D unavailable → fallback', err&&err.message); }
    })();
    return loading;
  }

  function fallbackSvg(){
    return `<svg class="fallback" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="fsea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f86d0"/><stop offset="1" stop-color="#0a2d52"/></linearGradient></defs>
      <rect y="160" width="800" height="140" fill="url(#fsea)"/>
      <g fill="#c7cfdb"><rect x="30" y="100" width="110" height="62"/><rect x="50" y="70" width="14" height="32" fill="#a94b3a"/><rect x="80" y="70" width="14" height="32" fill="#a94b3a"/></g>
      <g fill="#dfe5ee"><rect x="640" y="104" width="130" height="58"/><path d="M634 104 L705 78 L776 104Z" fill="#3b6ea8"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="-40 0;60 0;-40 0" dur="9s" repeatCount="indefinite"/>
        <path d="M250 190 h160 l22 -28 h-182z" fill="#22304a"/><rect x="262" y="140" width="22" height="22" fill="#f4f6fa"/>
        <rect x="300" y="146" width="24" height="14" fill="#e0413a"/><rect x="326" y="146" width="24" height="14" fill="#2a62d9"/><rect x="352" y="146" width="24" height="14" fill="#f0b429"/></g>
      <path d="M0 200 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" stroke="#fff" stroke-opacity=".3" fill="none" stroke-width="3"><animate attributeName="d" dur="4s" repeatCount="indefinite" values="M0 200 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0;M0 200 q50 10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0;M0 200 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></path>
    </svg>`;
  }

  return {
    // host: element .stage3d (created by caller); opts: {focus, data, dark}
    async mount(el, opts){
      host=el; opts=opts||{};
      focus=opts.focus||'all'; data=Object.assign({counts:{},ships:[],whStack:0,portStack:0},opts.data||{}); dark=!!opts.dark;
      if(!el.querySelector('svg.fallback')) el.insertAdjacentHTML('afterbegin',fallbackSvg());
      if(window.__NO3D){ el.classList.add('no-webgl'); return; }
      await init();
      if(failed||!R){ el.classList.add('no-webgl'); return; }
      el.classList.remove('no-webgl');
      if(R.domElement.parentNode!==el) el.insertBefore(R.domElement, el.firstChild);
      reduced=reduce(); resize(); applyFocus(); applyTheme(); rebuildShips();
      if(!el._io){ el._io=new IntersectionObserver(es=>{ visible=es[0].isIntersecting; setRunning(true); },{threshold:.05}); el._io.observe(el); }
      visible=true; setRunning(true);
      if(reduced){ cur=Object.assign({},want); dirty=true; if(!raf) raf=requestAnimationFrame(frame); }
    },
    setFocus(f){ focus=f; applyFocus(); },
    setDark(d){ dark=!!d; applyTheme(); dirty=true; },
    setData(d){ data=Object.assign(data,d); rebuildShips(); },
    detach(){ if(R&&R.domElement.parentNode) R.domElement.parentNode.removeChild(R.domElement); setRunning(false); host=null; },
    get ready(){ return !!R; }, get failed(){ return failed; },
  };
})();

<script>/* ===== v2 LOGISTICS: derived shipment stages, KPIs, control tower, sea / warehouse panels =====
   Stages are DERIVED from milestone dates (shipment.status is free text in the database).
   Thresholds below are ASSUMPTIONS (editable constants), not company policy. */
(function(){
  const T=(a,e)=>window.__T(a,e);
  const NEAR_DAYS=7, PORT_WARN_DAYS=7, WH_WARN_DAYS=5;
  const DAY=864e5;
  const dd=s=>{ if(!s) return null; const t=/^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00:00'):new Date(s); return isNaN(t)?null:t; };
  const today=()=>{ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
  const diff=(a,b)=>(a&&b)?Math.round((b-a)/DAY):null;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const esc=v=>escHtml(v);

  const ST={
    production:{c:'var(--st-production)',icon:'🏭',ar:'قيد الإنتاج',en:'In production'},
    ready:{c:'var(--st-ready)',icon:'📦',ar:'جاهزة للشحن',en:'Ready to ship'},
    sea:{c:'var(--st-sea)',icon:'🚢',ar:'في البحر',en:'At sea'},
    port:{c:'var(--st-port)',icon:'⚓',ar:'بالميناء / تخليص',en:'At port · clearing'},
    cleared:{c:'var(--st-cleared)',icon:'🚚',ar:'مُخلَّصة — للمستودع',en:'Cleared · to warehouse'},
    received:{c:'var(--st-received)',icon:'✅',ar:'مُستلمة',en:'Received'},
  };
  const ORDER=['production','ready','sea','port','cleared','received'];
  const stLabel=k=>T(ST[k].ar,ST[k].en);

  function derive(s){
    const t=today(), shipped=dd(s.shipped_date), eta=dd(s.eta_date), ata=dd(s.ata_date), cl=dd(s.customs_cleared_date), rcv=dd(s.received_date);
    let key='production';
    if(rcv||s.status==='مُستلم') key='received'; else if(cl) key='cleared'; else if(ata) key='port'; else if(shipped) key='sea';
    else if(s.production_done_date||s.inspection_date) key='ready';
    const o={s,key,flags:[],etaDays:null,near:false,late:false,progress:null,indicative:false,containers:shipContainerList(s).length};
    if(key==='sea'){
      if(eta){ o.etaDays=diff(t,eta); o.late=o.etaDays<0; o.near=!o.late&&o.etaDays<=NEAR_DAYS; const tot=diff(shipped,eta); o.progress=tot>0?Math.min(1,Math.max(0,diff(shipped,t)/tot)):(o.late?1:.5); }
      else { o.progress=.5; o.indicative=true; }
    }
    const F=(k,ar,en)=>o.flags.push({k,ar,en});
    if(key==='sea'&&o.late) F('late',`تجاوزت ETA بـ ${-o.etaDays} يوم`,`${-o.etaDays}d past ETA`);
    if(key==='sea'&&!eta) F('noeta','بدون ETA','No ETA');
    if(key==='port'){ const n=diff(ata,t); if(n>PORT_WARN_DAYS) F('port',`بالميناء ${n} يوم بدون تخليص`,`${n}d at port, not cleared`); }
    if(key==='cleared'){ const n=diff(cl,t); if(n>WH_WARN_DAYS) F('wh',`مُخلَّصة منذ ${n} يوم ولم تُستلم`,`Cleared ${n}d ago, not received`); }
    if(key==='sea'&&!String(s.tracking_url||'').trim()) F('track','بدون مرجع تتبع (B/L)','No tracking ref (B/L)');
    if(key!=='received'&&!o.containers) F('cont','بدون رقم حاوية','No container number');
    if(key!=='received'&&shipItems(s.id).length===0&&!s.po_id) F('items','غير مرتبطة بأمر/أصناف','Not linked to an order/items');
    const dts=[s.shipped_date,s.eta_date,s.ata_date,s.customs_cleared_date,s.received_date];
    if((ata&&shipped&&ata<shipped)||(rcv&&ata&&rcv<ata)||(cl&&ata&&cl<ata)) F('order','ترتيب تواريخ غير منطقي','Date order looks wrong');
    return o;
  }

  function metrics(){
    const list=cache.shipments.map(derive), by={}; ORDER.forEach(k=>by[k]=list.filter(x=>x.key===k));
    const sea=by.sea, flagged=list.filter(x=>x.flags.some(f=>f.k!=='track')&&x.key!=='received');
    const pairs=(a,b)=>list.map(x=>diff(dd(x.s[a]),dd(x.s[b]))).filter(n=>n!=null&&n>=0);
    const arrived=list.filter(x=>x.s.ata_date&&x.s.eta_date);
    const onTime=arrived.filter(x=>dd(x.s.ata_date)<=dd(x.s.eta_date)).length;
    const qty=sea.reduce((a,x)=>a+(Number(shipTotalQty(x.s))||0),0);
    const now=new Date(), ym=now.getFullYear()*12+now.getMonth();
    const rc=cache.warehouseReceipts, rcMonth=rc.filter(r=>{ const d=dd(r.received_date); return d&&d.getFullYear()*12+d.getMonth()===ym; }).length;
    let sumR=0,sumE=0,disc=0; rc.forEach(r=>{ try{ const t=receiptTotals(r); if(t.n){ sumR+=t.rcv; sumE+=t.exp; if(t.rcv!==t.exp) disc++; } }catch(e){} });
    const damaged=rc.filter(r=>r.condition_status&&r.condition_status!=='سليمة بالكامل').length;
    const shippedIds=new Set(); cache.shipments.forEach(s=>shipPoIds(s).forEach(id=>shippedIds.add(id)));
    const noShip=cache.orders.filter(o=>o.status!=='مُستلم'&&o.status!=='مُلغى'&&o.order_type==='دولي'&&!shippedIds.has(o.id));
    return {list,by,sea,flagged,total:list.length,
      near:sea.filter(x=>x.near),late:sea.filter(x=>x.late),
      contSea:sea.reduce((a,x)=>a+x.containers,0),qtySea:qty,
      transit:avg(pairs('shipped_date','ata_date')),clear:avg(pairs('ata_date','customs_cleared_date')),toWh:avg(pairs('customs_cleared_date','received_date')),
      onTimePct:arrived.length?Math.round(onTime/arrived.length*100):null,arrivedN:arrived.length,
      rc,rcMonth,disc,damaged,acc:sumE?Math.round(sumR/sumE*1000)/10:null,noShip};
  }

  function series(field,n=6){
    const now=new Date(); const out=Array(n).fill(0);
    cache.shipments.forEach(s=>{ const d=dd(s[field]); if(!d) return; const k=(now.getFullYear()*12+now.getMonth())-(d.getFullYear()*12+d.getMonth()); if(k>=0&&k<n) out[n-1-k]++; });
    return out;
  }
  function spark(arr,color){
    if(!arr||arr.every(v=>!v)) return '';
    const w=64,h=28,mx=Math.max(...arr,1),st=w/(arr.length-1||1);
    const pts=arr.map((v,i)=>`${(i*st).toFixed(1)},${(h-3-(v/mx)*(h-8)).toFixed(1)}`).join(' ');
    return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color||'var(--kc)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((arr.length-1)*st).toFixed(1)}" cy="${(h-3-(arr[arr.length-1]/mx)*(h-8)).toFixed(1)}" r="2.6" fill="${color||'var(--kc)'}"/></svg>`;
  }
  function kpi(o){
    const fmt=v=>(typeof v==='number'?fmtNum(v):v);
    return `<div class="kpi-card ${o.color||'blue'}" ${o.go?`data-go="${o.go}"`:''} ${o.stage?`data-stage="${o.stage}"`:''} ${o.hint?`title="${esc(o.hint)}"`:''}>
      <div class="kpi-icon">${o.icon}</div>${o.spark||''}
      <div class="kpi-value">${o.value==null?'—':fmt(o.value)}${o.suffix||''}</div>
      <div class="kpi-label">${o.label}</div>
      <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.max(0,Math.min(100,o.pct==null?0:o.pct))}%"></div></div></div>`;
  }
  const pctOf=(n,t)=>t?Math.round(n/t*100):0;
  const dayStr=v=>v==null?null:Math.round(v*10)/10;

  function kpiSections(M){
    const tot=M.total, r=ST;
    const A=[
      kpi({icon:'🚢',value:M.sea.length,label:T('شحنات في الطريق (في البحر)','Shipments on the way (at sea)'),color:'blue',go:'shipments',stage:'sea',pct:pctOf(M.sea.length,tot),spark:spark(series('shipped_date')),hint:T('الحالة محسوبة من تواريخ الشحن/الوصول','Stage derived from shipped / arrival dates')}),
      kpi({icon:'⏳',value:M.near.length,label:T(`قاربت الوصول (ETA خلال ${NEAR_DAYS} أيام)`,`Near arrival (ETA within ${NEAR_DAYS} days)`),color:M.near.length?'amber':'green',go:'shipments',stage:'near',pct:pctOf(M.near.length,M.sea.length),hint:T('افتراض: العتبة 7 أيام','Assumption: 7-day threshold')}),
      kpi({icon:'🚨',value:M.late.length,label:T('متأخرة عن ETA (لم تصل)','Past ETA (not arrived)'),color:M.late.length?'red':'green',go:'shipments',stage:'late',pct:pctOf(M.late.length,M.sea.length)}),
      kpi({icon:'⚓',value:M.by.port.length,label:T('وصلت الميناء — إنهاء الإجراءات','Arrived at port — finishing clearance'),color:M.by.port.length?'amber':'green',go:'shipments',stage:'port',pct:pctOf(M.by.port.length,tot),spark:spark(series('ata_date'))}),
      kpi({icon:'🚚',value:M.by.cleared.length,label:T('مُخلَّصة بانتظار استلام المستودع','Cleared, awaiting warehouse'),color:M.by.cleared.length?'amber':'green',go:'shipments',stage:'cleared',pct:pctOf(M.by.cleared.length,tot)}),
      kpi({icon:'✅',value:M.by.received.length,label:T('شحنات مُستلمة','Shipments received'),color:'green',go:'shipments',stage:'received',pct:pctOf(M.by.received.length,tot),spark:spark(series('received_date'))}),
      kpi({icon:'🏭',value:M.by.production.length+M.by.ready.length,label:T('قبل الشحن (إنتاج/جاهزة)','Pre-shipment (production / ready)'),color:'blue',go:'shipments',stage:'production',pct:pctOf(M.by.production.length+M.by.ready.length,tot)}),
      kpi({icon:'🔎',value:M.flagged.length,label:T('تحتاج مراجعة (Check)','Needs check'),color:M.flagged.length?'red':'green',go:'shipments',stage:'check',pct:pctOf(M.flagged.length,tot),hint:T('تأخر ETA، بدون ETA، تأخر تخليص، بيانات ناقصة، ترتيب تواريخ','Late ETA, no ETA, stuck clearance, missing data, date order')}),
    ];
    const B=[
      kpi({icon:'📦',value:M.contSea,label:T('حاويات على السفن الآن','Containers at sea now'),color:'blue',go:'shipments',stage:'sea',pct:100}),
      kpi({icon:'🧮',value:M.qtySea,label:T('كمية في الطريق (مجموع كميات الشحنات)','Quantity on the way (sum of shipment qty)'),color:'blue',pct:100,hint:T('وحدات مختلفة قد تُجمع معًا — للاسترشاد','Mixed units may be summed — indicative')}),
      kpi({icon:'🎯',value:M.onTimePct,suffix:M.onTimePct==null?'':'%',label:T(`الوصول في الموعد (من ${M.arrivedN} شحنة)`,`On-time arrival (of ${M.arrivedN} shipments)`),color:M.onTimePct==null?'blue':M.onTimePct>=80?'green':M.onTimePct>=50?'amber':'red',pct:M.onTimePct||0}),
      kpi({icon:'🌊',value:dayStr(M.transit),suffix:M.transit==null?'':T(' يوم',' d'),label:T('متوسط مدة العبور (شحن ← وصول)','Avg transit (shipped → arrived)'),color:'blue',pct:M.transit?Math.min(100,M.transit/60*100):0}),
      kpi({icon:'🛃',value:dayStr(M.clear),suffix:M.clear==null?'':T(' يوم',' d'),label:T('متوسط التخليص (وصول ← تخليص)','Avg clearance (arrived → cleared)'),color:M.clear>PORT_WARN_DAYS?'amber':'green',pct:M.clear?Math.min(100,M.clear/20*100):0}),
      kpi({icon:'🏬',value:dayStr(M.toWh),suffix:M.toWh==null?'':T(' يوم',' d'),label:T('من التخليص للمستودع','Cleared → warehouse'),color:M.toWh>WH_WARN_DAYS?'amber':'green',pct:M.toWh?Math.min(100,M.toWh/15*100):0}),
      kpi({icon:'🧾',value:M.noShip.length,label:T('أوامر دولية مفتوحة بدون شحنة','Open international POs with no shipment'),color:M.noShip.length?'amber':'green',go:'orders',pct:pctOf(M.noShip.length,cache.orders.length)}),
    ];
    const C=[
      kpi({icon:'📥',value:M.rc.length,label:T('استلامات المستودع (in-load)','Warehouse receipts (in-load)'),color:'blue',go:'warehouse_receipts',pct:100}),
      kpi({icon:'🗓️',value:M.rcMonth,label:T('استلامات هذا الشهر','Receipts this month'),color:'green',go:'warehouse_receipts',pct:pctOf(M.rcMonth,M.rc.length)}),
      kpi({icon:'⚖️',value:M.acc,suffix:M.acc==null?'':'%',label:T('دقة الاستلام (مستلم ÷ متوقع)','Receiving accuracy (received ÷ expected)'),color:M.acc==null?'blue':M.acc>=98?'green':M.acc>=90?'amber':'red',go:'warehouse_receipts',pct:M.acc||0}),
      kpi({icon:'🧩',value:M.disc,label:T('استلامات بها فروقات كمية','Receipts with quantity gaps'),color:M.disc?'amber':'green',go:'warehouse_receipts',pct:pctOf(M.disc,M.rc.length)}),
      kpi({icon:'💥',value:M.damaged,label:T('استلامات بها تلف','Receipts with damage'),color:M.damaged?'red':'green',go:'warehouse_receipts',pct:pctOf(M.damaged,M.rc.length)}),
    ];
    return {A,B,C};
  }

  function stageDataFor(M){
    return { ships:M.sea.map(x=>({p:x.progress,n:x.containers||1,line:x.s.shipping_line})), whStack:M.by.received.length+M.rcMonth, portStack:M.by.port.length+M.by.cleared.length };
  }
  function stageHtml(M,opts){
    const z=(k,icon,n,label,go,stage)=>`<div class="zone" data-go="${go}" data-stage="${stage}" role="button" tabindex="0"><span class="zi">${icon}</span><div><b>${n}</b><span>${label}</span></div></div>`;
    const zones=`<div class="stage-zones">
      ${z('f','🏭',M.by.production.length+M.by.ready.length,T('المصنع / قبل الشحن','Factory / pre-shipment'),'shipments','production')}
      ${z('s','🚢',M.sea.length,T(`في البحر · ${M.contSea} حاوية`,`At sea · ${M.contSea} cont.`),'shipments','sea')}
      ${z('p','⚓',M.by.port.length+M.by.cleared.length,T('الميناء والتخليص','Port & clearance'),'shipments','port')}
      ${z('w','🏬',M.by.received.length,T('مُستلمة بالمستودع','Received in warehouse'),'warehouse_receipts','')}
    </div>`;
    return `<div class="stage3d ${opts.compact?'compact':''}" id="stage3d"><div class="stage-title">${opts.title}<i>${opts.sub||''}</i></div>
      <div class="stage-ctl"><button type="button" data-view="all">${T('الكل','All')}</button><button type="button" data-view="factory">${T('المصنع','Factory')}</button><button type="button" data-view="sea">${T('البحر','Sea')}</button><button type="button" data-view="warehouse">${T('المستودع','Warehouse')}</button></div>
      ${opts.compact?'':zones}</div>`;
  }
  function mountStage(M,focus){
    const el=document.getElementById('stage3d'); if(!el) return;
    el.querySelectorAll('.zone').forEach(zn=>{ zn.onclick=()=>goTab(zn.dataset.go,zn.dataset.stage); zn.onkeydown=e=>{ if(e.key==='Enter') zn.click(); }; });
    el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>Stage.setFocus(b.dataset.view));
    Stage.mount(el,{focus,data:stageDataFor(M),dark:v2IsDark()});
  }

  function pipelineHtml(M,active){
    return `<div class="pipeline" role="list">`+ORDER.map(k=>{
      const arr=M.by[k], cont=arr.reduce((a,x)=>a+x.containers,0);
      return `<div class="pl-step ${active===k?'on':''}" role="listitem" style="--c:${ST[k].c}" data-go="shipments" data-stage="${k}" tabindex="0"><div class="n">${arr.length}</div><div class="l">${ST[k].icon} ${stLabel(k)}</div><div class="q">${cont?T(`${cont} حاوية`,`${cont} container(s)`):'&nbsp;'}</div></div>`;
    }).join('')+`</div>`;
  }
  function wirePipeline(root){ root.querySelectorAll('.pl-step').forEach(p=>{ p.onclick=()=>goTab(p.dataset.go,p.dataset.stage); p.onkeydown=e=>{ if(e.key==='Enter') p.click(); }; }); }

  function chip(x){ const c=ST[x.key]; return `<span class="stage-chip" style="--c:${c.c}">${stLabel(x.key)}</span>`; }
  function dayBadge(x){
    if(x.etaDays==null) return `<span class="d" style="--c:var(--muted)">ETA ?</span>`;
    if(x.late) return `<span class="d" style="--c:var(--st-late)">+${-x.etaDays}${T('ي','d')}</span>`;
    return `<span class="d" style="--c:${x.near?'var(--st-near)':'var(--st-sea)'}">${x.etaDays===0?T('اليوم','Today'):T(`بعد ${x.etaDays}ي`,`in ${x.etaDays}d`)}</span>`;
  }
  function contChips(s){ const l=shipContainerList(s); return l.length?l.slice(0,3).map(c=>`<span class="cont-chip">${esc(c)}</span>`).join(' ')+(l.length>3?` <span class="muted">+${l.length-3}</span>`:''):`<span class="muted">${T('بدون رقم حاوية','No container no.')}</span>`; }

  function radarHtml(M){
    const rows=M.sea.slice().sort((a,b)=>(a.etaDays==null)-(b.etaDays==null)||a.etaDays-b.etaDays).slice(0,8);
    return `<div class="radar"><h4>🛰️ ${T('رادار الوصول','Arrivals radar')} <small>${T('الأقرب أولاً','soonest first')}</small></h4>`+
      (rows.length?rows.map(x=>`<div class="radar-row" style="--c:${x.late?'var(--st-late)':x.near?'var(--st-near)':'var(--st-sea)'}">${dayBadge(x)}<div style="flex:1;min-width:140px">${contChips(x.s)}<div class="muted">${esc(shipSupplierNames(x.s).join('، ')||'—')} · ETA ${fmtDate(x.s.eta_date)}</div></div></div>`).join(''):`<div class="empty-note">${T('لا شحنات في البحر الآن','No shipments at sea right now')}</div>`)+`</div>`;
  }
  function checkHtml(M){
    const rows=M.flagged.slice(0,8);
    return `<div class="radar"><h4>🔎 ${T('تحتاج مراجعة','Needs check')} <small>${M.flagged.length}</small></h4>`+
      (rows.length?rows.map(x=>`<div class="radar-row"><div style="flex:1;min-width:140px">${chip(x)} ${contChips(x.s)}<div style="margin-top:3px">${x.flags.filter(f=>f.k!=='track').map(f=>`<span class="flag-chip">${T(f.ar,f.en)}</span>`).join(' ')}</div></div></div>`).join(''):`<div class="empty-note">✅ ${T('لا توجد شحنات تحتاج مراجعة','Nothing needs checking')}</div>`)+`</div>`;
  }
  function seaBoxHtml(M){
    const rows=M.sea.slice().sort((a,b)=>(a.etaDays==null)-(b.etaDays==null)||a.etaDays-b.etaDays);
    const lane=`<div class="sea-lane"><span class="port a">${T('المنشأ','Origin')}</span><span class="port b">${T('ميناء الوصول','Destination port')}</span>`+
      rows.slice(0,6).map((x,i)=>`<div class="ship" style="inset-inline-start:${Math.round(8+x.progress*84)}%;top:${16+(i%3)*8}px" title="${esc(shipLabel(x.s))}">🚢</div>`).join('')+`</div>`;
    return `<div class="sea-box"><h4>🌊 ${T('حاويات على سفن في البحر','Containers on ships at sea')} <small>${M.sea.length} ${T('شحنة','shipment(s)')} · ${M.contSea} ${T('حاوية','container(s)')}</small></h4>${lane}`+
      (rows.length?rows.map(x=>`<div class="sea-row"><div style="min-width:130px">${contChips(x.s)}</div><div class="bar" title="${Math.round(x.progress*100)}%"><i data-w="${Math.round(x.progress*100)}"></i></div><div class="muted" style="min-width:92px">${esc(x.s.shipping_line||'—')} · ${x.etaDays==null?'ETA ?':x.late?T(`متأخرة ${-x.etaDays}ي`,`${-x.etaDays}d late`):T(`بعد ${x.etaDays}ي`,`in ${x.etaDays}d`)}${x.indicative?' *':''}</div></div>`).join('')+(rows.some(x=>x.indicative)?`<div class="wh-note">* ${T('بدون ETA — موضع السفينة تقريبي','No ETA — ship position is indicative')}</div>`:''):`<div class="empty-note">${T('لا توجد شحنات في البحر الآن','No shipments at sea right now')}</div>`)+`</div>`;
  }
  function whBoxHtml(M){
    return `<div class="wh-box"><h4>🏬 ${T('المستودع — Load In / Out','Warehouse — Load In / Out')} <small>${T('تحميل/تفريغ','in-load / out-load')}</small></h4>
      <div class="wh-split">
        <div class="wh-in"><span class="muted">⬇️ ${T('Load In — استلام','Load In — receiving')}</span><b>${M.rcMonth}</b><span class="muted">${T('هذا الشهر','this month')} · ${M.rc.length} ${T('إجمالي','total')}</span>
          <div class="wh-note">${T(`في الطريق للمستودع: ${M.by.cleared.length+M.by.port.length} شحنة`,`Heading to warehouse: ${M.by.cleared.length+M.by.port.length} shipment(s)`)}</div></div>
        <div class="wh-out"><span class="muted">⬆️ ${T('Load Out — صرف/شحن للعملاء','Load Out — dispatch')}</span><b>${T('غير مسجّل [TBD]','Not tracked [TBD]')}</b>
          <div class="wh-note">${T('النظام الحالي يسجّل الاستلام فقط. لعرض Out-load نحتاج مصدر بيانات (صرف المستودع / 3PL).','This system records receiving only. Showing out-load needs a data source (warehouse dispatch / 3PL feed).')}</div></div>
      </div></div>`;
  }
  const kpiGrid=(arr)=>`<div class="kpi-grid">${arr.join('')}</div>`;
  const sec=(t,sub)=>`<div class="kpi-section-title">${t}${sub?` <small>${sub}</small>`:''}</div>`;

  function growBars(root){ requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('.sea-row .bar i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'))); }

  // ---------- per-tab enhancers ----------
  function enhanceDashboard(root,M){
    const anchor=root.querySelector('#dash-from'); const filterCard=anchor&&anchor.closest('.card'); if(!filterCard) return;
    const w=document.createElement('div'); w.className='lg-wrap'; w.id='lg-wrap';
    const K=kpiSections(M);
    w.innerHTML=stageHtml(M,{title:T('🛰️ برج مراقبة سلسلة الإمداد','🛰️ Supply-chain control tower'),sub:T(`${M.total} شحنة — حيّ من البيانات`,`${M.total} shipments — live from your data`)})+
      pipelineHtml(M)+
      sec(T('الشحنات — من المصنع للمستودع','Shipments — factory to warehouse'),T('محسوبة من تواريخ المراحل','derived from milestone dates'))+kpiGrid(K.A)+
      `<div class="lg-two">${radarHtml(M)}${checkHtml(M)}</div>`+
      sec(T('أداء اللوجستيات','Logistics performance'),T('متوسطات محسوبة من التواريخ المسجّلة','averages calculated from recorded dates'))+kpiGrid(K.B)+
      sec(T('استلام المستودع','Warehouse receiving'))+kpiGrid(K.C)+
      sec(T('الأوامر والمشتريات','Orders & procurement'),T('تتأثر بالفلاتر أدناه','affected by the filters below'));
    filterCard.before(w); wirePipeline(w); mountStage(M,'all');
  }
  function enhanceShipments(root,M){
    const card=root.querySelector('.card'); if(!card) return;
    const w=document.createElement('div'); w.className='lg-wrap'; w.id='lg-wrap';
    const f=window.LG_FILTER||'';
    w.innerHTML=stageHtml(M,{compact:true,title:T('🌊 الشحنات في الطريق','🌊 Shipments in transit'),sub:`${M.sea.length} ${T('في البحر','at sea')}`})+pipelineHtml(M,f)+
      `<div class="lg-two">${seaBoxHtml(M)}${whBoxHtml(M)}</div>`+
      (f?`<div class="card" style="padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>🔍 ${T('تصفية','Filter')}:</span>${f==='near'?`<span class="stage-chip" style="--c:var(--st-near)">${T('قاربت الوصول','Near arrival')}</span>`:f==='late'?`<span class="stage-chip" style="--c:var(--st-late)">${T('متأخرة','Past ETA')}</span>`:f==='check'?`<span class="stage-chip" style="--c:var(--st-late)">${T('تحتاج مراجعة','Needs check')}</span>`:`<span class="stage-chip" style="--c:${ST[f].c}">${stLabel(f)}</span>`}<button class="btn small" id="lg-clear">${T('مسح التصفية','Clear filter')}</button></div>`:'');
    card.before(w); wirePipeline(w); growBars(w); mountStage(M,'sea');
    const clr=w.querySelector('#lg-clear'); if(clr) clr.onclick=()=>goTab('shipments','');
    // decorate table rows
    const table=card.querySelector('table'); if(!table) return;
    const heads=[...table.querySelectorAll('thead th')]; const hi=heads.findIndex(h=>/آخر محطة/.test(h.textContent));
    const byId=new Map(M.list.map(x=>[x.s.id,x]));
    let shown=0;
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const btn=tr.querySelector('[data-act="edit-ship"]'); const x=btn&&byId.get(btn.dataset.id); if(!x) return;
      const pass=!f||(f==='near'?x.near:f==='late'?x.late:f==='check'?x.flags.some(g=>g.k!=='track')&&x.key!=='received':f==='production'?(x.key==='production'||x.key==='ready'):x.key===f);
      if(!pass){ tr.style.display='none'; return; } shown++;
      if(hi>=0&&tr.children[hi]){ const td=tr.children[hi]; const on=SHIP_MILESTONES.filter(m=>x.s[m[0]]).length;
        td.insertAdjacentHTML('afterbegin',chip(x)+(x.flags.some(g=>g.k!=='track')&&x.key!=='received'?`<span class="flag-chip" title="${esc(x.flags.filter(g=>g.k!=='track').map(g=>T(g.ar,g.en)).join(' · '))}">${T('تشيك','check')}</span>`:'')+'<br>');
        td.insertAdjacentHTML('beforeend',`<div class="ms-strip" aria-hidden="true">${SHIP_MILESTONES.map((m,i)=>`<i class="${x.s[m[0]]?'on':''}"></i>`).join('')}</div>`); }
    });
    if(f&&!shown) table.querySelector('tbody').insertAdjacentHTML('beforeend',`<tr><td colspan="${heads.length}" class="empty-note">${T('لا توجد شحنات بهذه الحالة','No shipments in this stage')}</td></tr>`);
  }
  function enhanceReceipts(root,M){
    const card=root.querySelector('.card'); if(!card) return;
    const w=document.createElement('div'); w.className='lg-wrap'; w.id='lg-wrap';
    const K=kpiSections(M);
    w.innerHTML=stageHtml(M,{compact:true,title:T('🏬 استلام المستودع','🏬 Warehouse receiving'),sub:`${M.rcMonth} ${T('هذا الشهر','this month')}`})+kpiGrid(K.C)+`<div class="lg-two">${whBoxHtml(M)}${radarHtml(M)}</div>`;
    card.before(w); mountStage(M,'warehouse');
  }
  function enhanceOrders(root,M){
    const card=root.querySelector('.card'); if(!card) return;
    const open=cache.orders.filter(o=>o.status!=='مُستلم'&&o.status!=='مُلغى').length;
    const w=document.createElement('div'); w.className='lg-wrap'; w.id='lg-wrap';
    w.innerHTML=stageHtml(M,{compact:true,title:T('🏭 من المصنع إلى بابك','🏭 From the factory to your door'),sub:T(`${open} أمر مفتوح · ${M.noShip.length} دولي بدون شحنة`,`${open} open orders · ${M.noShip.length} international with no shipment`)});
    card.before(w); mountStage(M,'factory');
  }

  // ---------- hook ----------
  const _render=window.renderActiveTab;
  window.renderActiveTab=function(){
    document.body.dataset.tab=activeTab;
    if(window.Chart&&Chart.defaults){ Chart.defaults.color=v2IsDark()?'#93a1bf':'#64708a'; Chart.defaults.borderColor=v2IsDark()?'#243153':'#e3e8f2'; }
    _render.apply(this,arguments);
    const root=document.getElementById('tab-content');
    try{
      const needs=['dashboard','shipments','warehouse_receipts','orders'].includes(activeTab);
      if(needs){ const M=metrics(); window.__LG=M;
        if(!window.__NO3D||true){ // stage block always rendered (fallback SVG when 3D off)
          ({dashboard:enhanceDashboard,shipments:enhanceShipments,warehouse_receipts:enhanceReceipts,orders:enhanceOrders})[activeTab](root,M); } }
      v2EnhanceKpis(root); v2ResponsiveTables(root);
      if(window.V2.lang==='en'&&typeof chartInstances==='object'){ Object.values(chartInstances).forEach(c=>{ try{ if(c.data&&c.data.labels) c.data.labels=c.data.labels.map(v2Tr); (c.data.datasets||[]).forEach(d=>{ if(d.label) d.label=v2Tr(d.label); }); c.update('none'); }catch(e){} }); }
    }catch(e){ console.error('[v2 enhance]',e); }
  };
  window.__lgDerive=derive; window.__lgMetrics=metrics;
})();

/* post-load guard: if the original boot already rendered before v2 hooks were installed */
(function(){ try{ if(typeof currentProfile!=='undefined' && currentProfile && document.getElementById('app-view').style.display!=='none'){ renderTabs(); renderActiveTab(); } }catch(e){ console.warn('[v2 guard]',e); } })();
</script>
<div id="v2-badge" data-no-i18n style="position:fixed;inset-inline-start:10px;bottom:10px;z-index:300;background:#6a3df0;color:#fff;border-radius:999px;padding:4px 12px;font:600 11px system-ui;opacity:.9;pointer-events:none">v2 PREVIEW</div>

</body>
