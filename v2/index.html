        <thead><tr>
          ${fullAccess ? `<th><input type="checkbox" id="select-all-orders" ${cache.orders.length && selectedOrderIds.size===cache.orders.length?'checked':''}></th>` : ''}
          <th>رقم الأمر</th><th>المورد</th><th>النوع</th><th>العملة</th><th>سعر الصرف</th><th>الإجمالي (ر.س)</th>
          <th>الحالة</th><th>نما سوفت</th><th>تاريخ الأمر</th><th>بنود</th><th></th>
        </tr></thead>
        <tbody>
          ${cache.orders.map(o=>{
            const lines = linesFor(o.id);
            const lineTotal = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
            const sarTotal = o.total_sar || (o.exchange_rate_to_sar ? lineTotal * o.exchange_rate_to_sar : null);
            return `<tr>
              ${fullAccess ? `<td><input type="checkbox" class="order-check" data-id="${o.id}" ${selectedOrderIds.has(o.id)?'checked':''}></td>` : ''}
              <td>${o.po_number || '—'}</td>
              <td>${supplierName(o.supplier_id)}</td>
              <td>${o.order_type||'—'}</td>
              <td>${o.currency}</td>
              <td>${o.exchange_rate_to_sar ? fmtNum(o.exchange_rate_to_sar) : '—'}</td>
              <td>${sarTotal ? fmtNum(sarTotal) : '—'}</td>
              <td><span class="badge ${o.status==='مُستلم'?'ok':o.status==='مُلغى'?'bad':'info'}">${o.status}</span></td>
              <td>${o.nama_uploaded ? '<span class="badge ok">✓</span>' : '<span class="badge bad">✗</span>'}</td>
              <td>${fmtDate(o.order_date)}</td>
              <td>${lines.length}</td>
              <td><button class="btn small" data-id="${o.id}" data-act="edit-order">${canEditExisting()?'تعديل':'👁 معاينة'}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  if (canAdd) root.querySelector('#imp-orders').onclick = openImportModal;
  root.querySelector('#exp-orders').onclick = () => exportToExcel(cache.orders.map(o=>{
    const lines = linesFor(o.id);
    const lineTotal = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    return {
      رقم_الأمر:o.po_number, المورد:supplierName(o.supplier_id), النوع:o.order_type, العملة:o.currency,
      سعر_الصرف:o.exchange_rate_to_sar, الإجمالي_بالعملة:lineTotal, الإجمالي_بالريال:o.total_sar,
      الحالة:o.status, نما_سوفت:o.nama_uploaded?'نعم':'لا', تاريخ_الأمر:o.order_date, موعد_الحاجة:o.need_by_date, ملاحظات:o.notes
    };
  }), 'purchase_orders');
  root.querySelector('#exp-lines').onclick = () => exportToExcel(cache.lines.map(l=>{ const o = cache.orders.find(x=>x.id===l.po_id)||{}; const {id, po_id, created_at, ...rest} = l; return { رقم_الأمر:o.po_number, المورد:supplierName(o.supplier_id), ...rest }; }), 'po_line_items');
  if (canAdd) root.querySelector('#add-order').onclick = () => openOrderModal(null);
  root.querySelectorAll('[data-act="edit-order"]').forEach(b=>{
    b.onclick = () => openOrderModal(cache.orders.find(o=>o.id===b.dataset.id));
  });
  wireRowPreview(root, 'edit-order', !canEditExisting());

  if (fullAccess) {
    const bulkCount = () => root.querySelector('#bulk-count') && (root.querySelector('#bulk-count').textContent = selectedOrderIds.size);
    const bulkDelBtn = () => root.querySelector('#bulk-del-selected');
    root.querySelector('#select-all-orders').onchange = (e) => {
      if (e.target.checked) cache.orders.forEach(o=>selectedOrderIds.add(o.id));
      else selectedOrderIds.clear();
      renderOrders(root);
    };
    root.querySelectorAll('.order-check').forEach(cb=>{
      cb.onchange = () => {
        if (cb.checked) selectedOrderIds.add(cb.dataset.id); else selectedOrderIds.delete(cb.dataset.id);
        bulkCount();
        if (bulkDelBtn()) bulkDelBtn().disabled = selectedOrderIds.size === 0;
        const selAll = root.querySelector('#select-all-orders');
        if (selAll) selAll.checked = selectedOrderIds.size === cache.orders.length && cache.orders.length > 0;
      };
    });
    root.querySelector('#bulk-del-selected').onclick = async () => {
      const ids = [...selectedOrderIds];
      if (!ids.length) return;
      if (!confirm(`حذف ${ids.length} أمر شراء محدد وكل بنودهم؟ لا يمكن التراجع.`)) return;
      const { error } = await sb.from('erp_purchase_orders').delete().in('id', ids);
      if (error) { toast('خطأ: '+error.message); return; }
      selectedOrderIds.clear();
      toast(`تم حذف ${ids.length} أمر شراء`); await refreshAll(); renderActiveTab();
    };
    root.querySelector('#bulk-del-all').onclick = async () => {
      const ids = cache.orders.map(o=>o.id);
      if (!ids.length) return;
      if (!confirm(`حذف جميع أوامر الشراء (${ids.length}) وكل بنودها؟ هذا إجراء نهائي لا يمكن التراجع عنه.`)) return;
      if (!confirm('تأكيد أخير: سيتم حذف كل أوامر الشراء المعروضة الآن. متابعة؟')) return;
      const { error } = await sb.from('erp_purchase_orders').delete().in('id', ids);
      if (error) { toast('خطأ: '+error.message); return; }
      selectedOrderIds.clear();
      toast(`تم حذف ${ids.length} أمر شراء`); await refreshAll(); renderActiveTab();
    };
  }
}

function openOrderModal(order){
  const isEdit = !!order;
  const editable = !isEdit ? canWrite() : canEditExisting();
  const attachments = isEdit ? attachmentsFor('po', order.id) : [];

  openModal(`
    <h3>${isEdit?(editable?'تعديل أمر شراء':'معاينة أمر شراء (عرض فقط)'):'أمر شراء جديد'}</h3>
    <div class="row">
      <div class="field"><label>رقم الأمر</label><input id="f-po_number" value="${order?.po_number||''}" ${editable?'':'disabled'}></div>
      <div class="field"><label>المورد</label><select id="f-supplier_id" ${editable?'':'disabled'}><option value="">—</option>${supplierOptions(order?.supplier_id)}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>نوع الطلب</label><select id="f-order_type" ${editable?'':'disabled'}>
        <option value="">—</option><option value="محلي" ${order?.order_type==='محلي'?'selected':''}>محلي</option><option value="دولي" ${order?.order_type==='دولي'?'selected':''}>دولي</option>
      </select></div>
      <div class="field"><label>العملة</label><select id="f-currency" ${editable?'':'disabled'}>
        ${['SAR','USD','EUR','CNY'].map(c=>`<option value="${c}" ${order?.currency===c?'selected':''}>${c}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>سعر الصرف للريال</label><input type="number" step="0.000001" id="f-exchange_rate" value="${order?.exchange_rate_to_sar||''}" ${editable?'':'disabled'} placeholder="مثال: 3.75"></div>
      <div class="field"><label>الإجمالي بالريال (محسوب)</label><input id="f-total_sar" value="${order?.total_sar ? fmtNum(order.total_sar) : '—'}" disabled style="background:var(--bg);font-weight:600"></div>
    </div>
    <div class="row">
      <div class="field"><label>الحالة</label><select id="f-status" ${editable?'':'disabled'}>
        ${['مخطط','مؤكد','قيد الإنتاج','شُحن','وصل','مُستلم','مُلغى'].map(s=>`<option value="${s}" ${order?.status===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="field"><label>تاريخ الأمر</label><input type="date" id="f-order_date" value="${order?.order_date||''}" ${editable?'':'disabled'}></div>
    </div>
    <div class="row">
      <div class="field"><label>موعد الحاجة</label><input type="date" id="f-need_by_date" value="${order?.need_by_date||''}" ${editable?'':'disabled'}></div>
    </div>

    <!-- Nama Soft Upload Status -->
    <div style="margin:10px 0">
      <label class="nama-toggle ${order?.nama_uploaded?'uploaded':''}">
        <input type="checkbox" id="f-nama_uploaded" ${order?.nama_uploaded?'checked':''} ${editable?'':'disabled'}>
        <span>تم الرفع على نما سوفت</span>
        ${order?.nama_uploaded_at ? `<span class="muted" style="margin-right:8px">(${fmtDate(order.nama_uploaded_at)})</span>` : ''}
      </label>
    </div>

    <div class="field"><label>ملاحظات</label><textarea id="f-notes" ${editable?'':'disabled'}>${order?.notes||''}</textarea></div>

    ${isEdit ? renderLineItemsBlock(order) : `
    <div class="card" style="margin-top:10px">
      <div class="toolbar"><strong>بنود الأمر</strong><button type="button" class="btn small" id="new-add-line">+ بند آخر</button></div>
      <table>
        <thead><tr><th>اسم الصنف</th><th>الفئة</th><th>سعر الوحدة (المبلغ)</th><th>الكمية</th><th></th></tr></thead>
        <tbody id="new-lines-body">
          <tr class="new-line-row">
            <td><input class="nl-name" placeholder="مثال: زجاجة"></td>
            <td><input class="nl-category" placeholder="مثال: عبوات، مواد خام"></td>
            <td><input type="number" step="0.0001" class="nl-price"></td>
            <td><input type="number" step="0.01" class="nl-qty"></td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <p class="muted" style="margin-top:6px">أضف كل أصناف هذا الأمر هنا (زجاج، غطاء، مضخة...) بدل إنشاء أمر شراء منفصل لكل صنف.</p>
    </div>`}

    ${isEdit ? renderAttachmentsBlock('po', order.id, attachments) : '<p class="muted" style="margin-top:8px">📎 اضغط "حفظ" أولاً — ستفتح النافذة تلقائيًا لإرفاق الملفات.</p>'}

    <div class="row" style="margin-top:14px">
      ${editable ? `<button class="btn primary" id="save-order">حفظ</button>` : ''}
      <button class="btn" id="cancel-order">إغلاق</button>
      ${isEdit && canFullAccess() ? `<button class="btn danger" id="del-order">حذف</button>` : ''}
    </div>
  `, (root)=>{
    // Auto-calculate total SAR when exchange rate or item rows change
    const rateInput = root.querySelector('#f-exchange_rate');
    const sarDisplay = root.querySelector('#f-total_sar');
    const computeLineTotal = () => {
      if (isEdit) {
        const lines = linesFor(order.id);
        return lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
      }
      return [...root.querySelectorAll('.new-line-row')].reduce((s,tr)=>{
        const price = parseFloat(tr.querySelector('.nl-price').value)||0;
        const qty = parseFloat(tr.querySelector('.nl-qty').value)||0;
        return s + price*qty;
      },0);
    };
    const updateSar = () => {
      const rate = parseFloat(rateInput.value) || 0;
      const lineTotal = computeLineTotal();
      sarDisplay.value = (rate > 0 && lineTotal > 0) ? fmtNum(lineTotal * rate) : '—';
    };
    rateInput.addEventListener('input', updateSar);
    if (!isEdit) {
      const linesBody = root.querySelector('#new-lines-body');
      linesBody.addEventListener('input', updateSar);
      root.querySelector('#new-add-line').onclick = () => {
        const tr = document.createElement('tr');
        tr.className = 'new-line-row';
        tr.innerHTML = `
          <td><input class="nl-name" placeholder="مثال: غطاء"></td>
          <td><input class="nl-category" placeholder="مثال: عبوات"></td>
          <td><input type="number" step="0.0001" class="nl-price"></td>
          <td><input type="number" step="0.01" class="nl-qty"></td>
          <td><button type="button" class="btn small danger nl-del">حذف</button></td>`;
        linesBody.appendChild(tr);
        tr.querySelector('.nl-del').onclick = () => { tr.remove(); updateSar(); };
      };
      updateSar();
    }

    // Nama toggle visual
    const namaCheckbox = root.querySelector('#f-nama_uploaded');
    namaCheckbox.addEventListener('change', () => {
      namaCheckbox.closest('.nama-toggle').classList.toggle('uploaded', namaCheckbox.checked);
    });

    root.querySelector('#cancel-order').onclick = closeModal;
    if (editable) root.querySelector('#save-order').onclick = async () => {
      const lineTotal = computeLineTotal();
      const rate = parseFloat(val('f-exchange_rate')) || null;

      // New order only: collect every item row the user added
      const newLineRows = !isEdit ? [...root.querySelectorAll('.new-line-row')].map(tr => ({
        item_name: tr.querySelector('.nl-name').value.trim(),
        category: tr.querySelector('.nl-category').value || null,
        unit_price: parseFloat(tr.querySelector('.nl-price').value) || 0,
        quantity: parseFloat(tr.querySelector('.nl-qty').value) || 0,
      })).filter(r => r.item_name) : [];

      const payload = {
        po_number: val('f-po_number') || null,
        supplier_id: val('f-supplier_id') || null,
        order_type: val('f-order_type') || null,
        currency: val('f-currency'),
        status: val('f-status'),
        order_date: val('f-order_date') || null,
        need_by_date: val('f-need_by_date') || null,
        notes: val('f-notes') || null,
        exchange_rate_to_sar: rate,
        total_sar: rate && lineTotal ? Math.round(lineTotal * rate * 100) / 100 : null,
        nama_uploaded: namaCheckbox.checked,
        nama_uploaded_at: namaCheckbox.checked && !order?.nama_uploaded ? new Date().toISOString() : (order?.nama_uploaded_at || null),
      };
      try {
        if (isEdit) {
          const { error } = await sb.from('erp_purchase_orders').update(payload).eq('id', order.id);
          if (error) throw error;
          toast('تم الحفظ'); closeModal(); await refreshAll(); renderActiveTab();
        } else {
          payload.created_by = currentUser.id;
          const { data: newOrder, error } = await sb.from('erp_purchase_orders').insert(payload).select().single();
          if (error) throw error;
          if (newLineRows.length) {
            const { error: lineErr } = await sb.from('erp_po_line_items').insert(
              newLineRows.map(r => ({
                po_id: newOrder.id, item_name: r.item_name, category: r.category,
                unit_price: r.unit_price, quantity: r.quantity, currency: payload.currency,
                created_by: currentUser.id,
              }))
            );
            if (lineErr) toast('تم حفظ الأمر، لكن حدث خطأ في حفظ البنود: ' + lineErr.message);
          }
          await refreshAll(); renderActiveTab();
          toast('تم الحفظ — يمكنك الآن إرفاق ملف');
          openOrderModal(cache.orders.find(o=>o.id===newOrder.id));
        }
      } catch(e){ toast('خطأ: ' + e.message); }
    };
    if (isEdit && canFullAccess()) root.querySelector('#del-order').onclick = async () => {
      if (!confirm('حذف هذا الأمر وكل بنوده؟')) return;
      const { error } = await sb.from('erp_purchase_orders').delete().eq('id', order.id);
      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم الحذف'); closeModal(); await refreshAll(); renderActiveTab();
    };
    wireLineItemsBlock(root, order);
    if (isEdit) wireAttachmentsBlock(root, 'po', order.id, () => openOrderModal(cache.orders.find(o=>o.id===order.id)));
  });
}

    openModal(`
      <h3>بند جديد</h3>
      <div class="field"><label>اسم الصنف</label><input id="l-item_name"></div>
      <div class="row">
        <div class="field"><label>الفئة</label><input id="l-category" placeholder="مثال: عبوات، مواد خام، كراتين"></div>
      </div>
      <div class="row">
        <div class="field"><label>سعر الوحدة</label><input type="number" step="0.0001" id="l-unit_price"></div>
        <div class="field"><label>الكمية</label><input type="number" step="0.01" id="l-quantity"></div>
      </div>
      <div class="field"><label>العملة</label><input id="l-currency" value="${order.currency}"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="save-line">حفظ البند</button>
        <button class="btn" id="back-line">رجوع</button>
      </div>
    `, (r2)=>{
      r2.querySelector('#back-line').onclick = () => openOrderModal(order);
      r2.querySelector('#save-line').onclick = async () => {
        const payload = {
          po_id: order.id, item_name: val('l-item_name'),
          unit_price: parseFloat(val('l-unit_price'))||0, quantity: parseFloat(val('l-quantity'))||0,
          currency: val('l-currency'), category: val('l-category')||null, created_by: currentUser.id,
        };
        const { error } = await sb.from('erp_po_line_items').insert(payload);
        if (error) { toast('خطأ: '+error.message); return; }

      if (!confirm('حذف هذا البند؟')) return;
      const { error } = await sb.from('erp_po_line_items').delete().eq('id', b.dataset.lid);
      if (error) { toast('خطأ: '+error.message); return; }
      await refreshAll();
      openOrderModal(cache.orders.find(o=>o.id===order.id));
    };
  });
}

// entityType is one of: 'po','payment','shipment','supplier','season','sample','receipt'
function renderAttachmentsBlock(entityType, entityId, attachments){
  return `
    <div class="card" style="margin-top:10px">
      <div class="toolbar"><strong>المرفقات (${attachments.length})</strong></div>
      <div class="attach-list" id="attach-list">
        ${attachments.map(a=>`
          <div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
            <span style="flex:1">${a.file_name || 'ملف'} <span class="muted">(${a.file_type||''})</span></span>
            <button class="btn small" data-aid="${a.id}" data-act="view-attach">عرض</button>
            ${canDelete()?`<button class="btn small danger" data-aid="${a.id}" data-act="del-attach">حذف</button>`:''}
          </div>
        `).join('')}
        ${attachments.length===0 ? '<p class="muted">لا توجد مرفقات</p>' : ''}
      </div>
      ${(canWrite() || (entityType==='receipt' && canWarehouse())) ? `
      <div class="attach-area" id="attach-drop">
        <p>📎 اسحب الملفات هنا أو <label style="color:var(--primary);cursor:pointer;text-decoration:underline">اختر ملفًا (صورة منتج، أمر استلام، شهادة جمركية، أمر شراء نما...)<input type="file" id="attach-input" style="display:none" multiple></label></p>
        <p class="muted" id="attach-status"></p>
      </div>` : ''}
    </div>
  `;
}

function wireAttachmentsBlock(root, entityType, entityId, onRefresh){
  // عرض مرفق — الحاوية خاصة (bucket: public=false)، لذا نستخدم رابط موقّع بدل رابط عام
  root.querySelectorAll('[data-act="view-attach"]').forEach(b=>{
    b.onclick = async () => {
      const att = cache.attachments.find(a=>a.id===b.dataset.aid);
      if (!att?.file_path) { toast('لا يمكن إيجاد مسار الملف'); return; }
      const { data, error } = await sb.storage.from('erp-attachments').createSignedUrl(att.file_path, 120);
      if (error) { toast('خطأ: '+error.message); return; }
      window.open(data.signedUrl, '_blank');
    };
  });

  root.querySelectorAll('[data-act="del-attach"]').forEach(b=>{
    b.onclick = async () => {
      if (!confirm('حذف هذا المرفق؟')) return;
      const att = cache.attachments.find(a=>a.id===b.dataset.aid);
      if (att?.file_path) {
        await sb.storage.from('erp-attachments').remove([att.file_path]);
      }
      const { error } = await sb.from('erp_attachments').delete().eq('id', b.dataset.aid);
      if (error) { toast('خطأ: '+error.message); return; }
      await refreshAll();
      onRefresh();
    };
  });

  const dropArea = root.querySelector('#attach-drop');
  const fileInput = root.querySelector('#attach-input');
  if (!dropArea || !fileInput) return;

  ['dragenter','dragover'].forEach(e=>dropArea.addEventListener(e, (ev)=>{ ev.preventDefault(); dropArea.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(e=>dropArea.addEventListener(e, (ev)=>{ ev.preventDefault(); dropArea.classList.remove('dragover'); }));

  dropArea.addEventListener('drop', (ev) => handleFiles(ev.dataTransfer.files, entityType, entityId, onRefresh));
  fileInput.addEventListener('change', () => handleFiles(fileInput.files, entityType, entityId, onRefresh));
}

async function handleFiles(files, entityType, entityId, onRefresh){
  const statusEl = document.getElementById('attach-status');
  for (const file of files) {
    if (statusEl) statusEl.textContent = `جارٍ رفع ${file.name}...`;
    const path = `${entityType}/${entityId}/${Date.now()}_${file.name}`;
    const { error: uploadError } = await sb.storage.from('erp-attachments').upload(path, file);
    if (uploadError) { toast('خطأ في الرفع: ' + uploadError.message); continue; }
    const { error: dbError } = await sb.from('erp_attachments').insert({
      entity_type: entityType, entity_id: entityId, file_name: file.name, file_type: file.type,
      file_size: file.size, file_path: path, uploaded_by: currentUser.id,
    });
    if (dbError) { toast('خطأ في التسجيل: ' + dbError.message); continue; }
  }
  if (statusEl) statusEl.textContent = 'تم الرفع بنجاح ✓';

}

// ============================================================
// AGING REPORT — SLA / delivery duration per purchase order
// ============================================================
function renderAging(root){
  const msDay = 1000*60*60*24;
  const nowMs = Date.now();
  const rows = cache.orders.map(o=>{
    const ships = shipmentsFor(o.id);
    const receivedDates = ships.map(s=>s.received_date).filter(Boolean);
    const receivedDate = receivedDates.length ? receivedDates.sort().slice(-1)[0] : null;
    const isClosed = o.status==='مُستلم' || !!receivedDate;
    let ageDays = null;
    if (o.order_date) {
      const endMs = receivedDate ? new Date(receivedDate).getTime() : nowMs;
      ageDays = Math.floor((endMs - new Date(o.order_date).getTime())/msDay);
    }
    let sla = '—', slaClass = '';
    if (ageDays != null) {
      if (ageDays <= 30) { sla = 'سريع'; slaClass='ok'; }
      else if (ageDays <= 60) { sla = 'ضمن المعتاد'; slaClass='info'; }
      else { sla = isClosed ? 'متأخر' : 'مفتوح ومتأخر'; slaClass='bad'; }
    }
    return { o, receivedDate, isClosed, ageDays, sla, slaClass };
  }).filter(r=>r.ageDays!=null).sort((a,b)=>b.ageDays-a.ageDays);

  const closedRows = rows.filter(r=>r.isClosed);
  const avgClosedAge = closedRows.length ? Math.round(closedRows.reduce((s,r)=>s+r.ageDays,0)/closedRows.length) : 0;
  const delayedOpen = rows.filter(r=>!r.isClosed && r.ageDays>60).length;
  const oldestOpen = rows.filter(r=>!r.isClosed).sort((a,b)=>b.ageDays-a.ageDays)[0];

  root.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="kpi-card green"><div class="kpi-icon">📊</div><div class="kpi-value">${avgClosedAge}</div><div class="kpi-label">متوسط مدة التوريد للأوامر المستلمة (يوم)</div></div>
      <div class="kpi-card ${delayedOpen>0?'red':'green'}"><div class="kpi-icon">🚨</div><div class="kpi-value">${delayedOpen}</div><div class="kpi-label">أوامر مفتوحة ومتأخرة (أكثر من 60 يوم)</div></div>
      <div class="kpi-card amber"><div class="kpi-icon">⌛</div><div class="kpi-value">${oldestOpen?oldestOpen.ageDays:0}</div><div class="kpi-label">أقدم أمر مفتوح (يوم)${oldestOpen?' — '+(oldestOpen.o.po_number||''):''}</div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <strong>تقرير تقادم أوامر الشراء (${rows.length})</strong>
        <button class="btn small" id="exp-aging">تصدير إكسل</button>
      </div>
      <p class="muted" style="margin-bottom:8px">تصنيف تقريبي (محسوب): سريع ≤30 يوم · ضمن المعتاد 31–60 يوم · متأخر &gt;60 يوم. المدة = تاريخ الأمر → تاريخ الاستلام (آخر شحنة مستلمة)، أو حتى اليوم إن كان الأمر مفتوحًا.</p>
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr><th>رقم الأمر</th><th>المورد</th><th>النوع</th><th>تاريخ الطلب</th><th>تاريخ الاستلام</th><th>الحالة</th><th>المدة (يوم)</th><th>التصنيف</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.o.po_number||'—'}</td>
              <td>${supplierName(r.o.supplier_id)}</td>
              <td>${r.o.order_type||'—'}</td>
              <td>${fmtDate(r.o.order_date)}</td>
              <td>${r.receivedDate?fmtDate(r.receivedDate):'—'}</td>
              <td>${r.o.status}</td>
              <td><strong>${r.ageDays}</strong></td>
              <td><span class="badge ${r.slaClass}">${r.sla}</span></td>
            </tr>`).join('')}
          ${rows.length===0?'<tr><td colspan="8" class="muted">لا توجد أوامر بتاريخ طلب مسجّل</td></tr>':''}
        </tbody>
      </table>
      </div>
    </div>
  `;
  root.querySelector('#exp-aging').onclick = () => exportToExcel(rows.map(r=>({
    رقم_الأمر:r.o.po_number, المورد:supplierName(r.o.supplier_id), النوع:r.o.order_type,
    تاريخ_الطلب:r.o.order_date, تاريخ_الاستلام:r.receivedDate, الحالة:r.o.status, المدة_بالأيام:r.ageDays, التصنيف:r.sla
  })), 'aging_report');
}

            </tr>`;
          }).join('') || '<tr><td colspan="10" class="muted" style="text-align:center;padding:20px">لا توجد دفعات</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>`;
  root.querySelector('#exp-fin').onclick = () => exportToExcel(rows.map(p=>({ الأمر:p.po_number, المورد:p.supplier_name, الصنف:p.item_name, المبلغ:p.amount, العملة:p.currency, الاستحقاق:p.due_date, الحالة:p.status, تاريخ_التحويل:p.transferred_date, المرجع:p.reference })), 'finance_payments');
  root.querySelector('#fin-st').onchange = e => { finFilter.st = e.target.value; renderFinancePayments(root); };
  root.querySelector('#fin-q').oninput = e => { finFilter.q = e.target.value; const pos = e.target.selectionStart; renderFinancePayments(root); const i = root.querySelector('#fin-q'); i.focus(); i.setSelectionRange(pos,pos); };
  root.querySelectorAll('.fin-paid').forEach(cb=>{
    cb.onchange = async () => {
      const mark = cb.checked;
      if (!confirm(mark ? 'تأكيد: تم تحويل هذه الدفعة؟ (سيُسجَّل تاريخ اليوم)' : 'إلغاء علامة "مدفوعة" لهذه الدفعة؟')) { cb.checked = !mark; return; }
      await finSetPaid(cb.dataset.id, mark, null, ()=>renderActiveTab());
    };
  });
  root.querySelectorAll('[data-act="fin-view"]').forEach(b=> b.onclick = () => openFinanceModal(b.dataset.id));

async function finSetPaid(id, mark, date, after){
  const { error } = await sb.rpc('erp_finance_set_paid', { p_id: id, p_paid: mark, p_date: date });

  toast(mark ? 'تم تسجيل الدفعة كمدفوعة' : 'تم إلغاء علامة الدفع');
  await refreshAll(); after&&after();
}

const today = new Date().toISOString().slice(0,10);

function statusBadge(s){
  const cls = s==='مُحوَّلة'?'ok':(s==='مُعتمدة'||s==='مطلوبة')?'warn':'bad';
  return `<span class="badge ${cls}">${s}</span>`;
}

    });
    root.querySelector('#cancel-pay').onclick = closeModal;
    root.querySelector('#save-pay').onclick = async () => {
      const payload = {
        po_id: val('p-po_id')||null, supplier_id: val('p-supplier_id')||null,
        item_name: val('p-item_name')||null, category: val('p-category')||null,
        quantity: parseFloat(val('p-quantity'))||null,
        payment_seq: parseInt(val('p-payment_seq'))||1,
        amount: parseFloat(val('p-amount'))||null, currency: val('p-currency'),
        due_date: val('p-due_date')||null, status: val('p-status'),
        transferred_date: val('p-transferred_date')||null, reference: val('p-reference')||null,
      };
      try {
        if (isEdit) {
          const { error } = await sb.from('erp_payments').update(payload).eq('id', payment.id);
          if (error) throw error;
          toast('تم الحفظ'); closeModal(); await refreshAll(); renderActiveTab();

          payload.created_by = currentUser.id;
          const { data: newPay, error } = await sb.from('erp_payments').insert(payload).select().single();

          await refreshAll(); renderActiveTab();
          toast('تم الحفظ — يمكنك الآن إرفاق ملف');
          openPaymentModal(cache.payments.find(p=>p.id===newPay.id));
        }
      } catch(e){ toast('خطأ: '+e.message); }

      if (!confirm('حذف هذه الدفعة؟')) return;

      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم الحذف'); closeModal(); await refreshAll(); renderActiveTab();
    };
    if (isEdit) wireAttachmentsBlock(root, 'payment', payment.id, () => openPaymentModal(cache.payments.find(p=>p.id===payment.id)));
    if (isEdit) wireCommentsBlock(root, payment.id, () => openPaymentModal(cache.payments.find(p=>p.id===payment.id)));
  });
}

const SHIP_MILESTONES = [
  ['supplier_confirmed_date','تأكيد المورد'], ['production_done_date','انتهاء الإنتاج'],
  ['inspection_date','الفحص'], ['shipped_date','الشحن'], ['eta_date','الوصول المتوقع'],
  ['ata_date','الوصول الفعلي'], ['customs_cleared_date','التخليص الجمركي'], ['received_date','الاستلام'],
];

function renderShipments(root){
  const canAdd = canWrite();
  const list = cache.shipments;
  root.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <strong>الشحنات (${list.length})</strong>
        <div class="row" style="flex:0;gap:8px">
          <button class="btn small" id="exp-ship">تصدير إكسل</button>
          ${canAdd ? '<button class="btn primary small" id="add-ship">+ شحنة جديدة</button>' : ''}
        </div>
      </div>
      ${bulkBarHtml('shipments', list)}
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr>${bulkThHtml('shipments', list)}<th>الأوامر</th><th>الموردون</th><th>الحاويات</th><th>شركة الشحن</th><th>تاريخ طلب الحاوية</th><th>الوصول المتوقع</th><th>الوصول الفعلي</th><th>الكمية الإجمالية</th><th>آخر محطة</th><th>الحالة</th><th>التتبع (رقم البوليصة)</th><th>تحديث بواسطة</th><th></th></tr></thead>
        <tbody>
          ${list.map(s=>{
            const lastDone = SHIP_MILESTONES.filter(m=>s[m[0]]).pop();
            const progress = SHIP_MILESTONES.filter(m=>s[m[0]]).length;
            const pos = shipPoNumbers(s), sups = shipSupplierNames(s), cons = shipContainerList(s), qty = shipTotalQty(s), nItems = shipItems(s.id).length;
            return `<tr>
              ${bulkTdHtml('shipments', s.id)}
              <td>${pos.length?pos.map(escHtml).join('، '):'—'}</td>
              <td>${sups.length?sups.map(escHtml).join('، '):'—'}</td>
              <td><strong>${cons.length?cons.map(escHtml).join('<br>'):'—'}</strong></td>
              <td>${escHtml(s.shipping_line)||'—'}</td>
              <td>${fmtDate(s.container_order_date)}</td>
              <td>${fmtDate(s.eta_date)}</td>
              <td>${fmtDate(s.ata_date)}</td>
              <td>${qty!=null&&qty!==''?fmtNum(qty):'—'}${nItems>1?` <span class="muted">(${nItems} أصناف)</span>`:''}</td>
              <td>${lastDone?lastDone[1]:'—'} <span class="muted">(${progress}/${SHIP_MILESTONES.length})</span></td>
              <td>${escHtml(s.status)||'—'}</td>
              <td>${trackCell(s)}</td>
              <td>${userLabel(s.updated_by)}</td>
              <td><button class="btn small" data-id="${s.id}" data-act="edit-ship">${canEditExisting()?'تعديل':'👁 معاينة'}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  root.querySelector('#exp-ship').onclick = () => exportToExcel(cache.shipments.map(s=>{
    const itemsTxt = shipItems(s.id).map(i=>`${cache.orders.find(o=>o.id===i.po_id)?.po_number||'—'}: ${i.item_name||'—'} × ${i.quantity??'—'}`).join(' ؛ ');
    const row = { أوامر_الشراء: shipPoNumbers(s).join('، '), الموردون: shipSupplierNames(s).join('، '), أرقام_الحاويات: shipContainerList(s).join(' / '), شركة_الشحن: s.shipping_line,
      تاريخ_طلب_الحاوية: s.container_order_date, الأصناف: itemsTxt || s.container_contents, الكمية_الإجمالية: shipTotalQty(s),
      رقم_البوليصة_أو_رابط_التتبع: s.tracking_url, الحالة: s.status, تم_التحديث_بواسطة: userLabel(s.updated_by), ملاحظات: s.notes };
    SHIP_MILESTONES.forEach(m=>row[m[1]]=s[m[0]]); return row;
  }), 'shipments');
  if (canAdd) root.querySelector('#add-ship').onclick = () => openShipmentModal(null);
  root.querySelectorAll('[data-act="edit-ship"]').forEach(b=>{
    b.onclick = () => openShipmentModal(cache.shipments.find(s=>s.id===b.dataset.id));
  });
  wireRowPreview(root, 'edit-ship', !canEditExisting());
  wireBulk(root, 'shipments', list, { table:'erp_shipments', label:'شحنة', plural:'الشحنات', attachType:'shipment', note:'(بحاوياتها وأصنافها ومرفقاتها)' });
}

function openShipmentModal(ship){
  const isEdit = !!ship;
  const editable = !isEdit ? canWrite() : canEditExisting();
  const owner = canDelete();
  const attachments = isEdit ? attachmentsFor('shipment', ship.id) : [];
  const dis = editable ? '' : 'disabled';

  // نسخة قابلة للتعديل من الحاويات والأصناف
  let containers = isEdit ? shipContainers(ship.id).map(c=>({ id:c.id, number:c.container_number||'' })) : [];
  let items = isEdit ? shipItems(ship.id).map(i=>({ id:i.id, po_id:i.po_id||'', name:i.item_name||'', qty:i.quantity==null?'':i.quantity })) : [];
  // شحنة قديمة بدون صفوف فرعية: نعرض بياناتها القديمة، وتُحفظ كصفوف جديدة عند أول حفظ
  if (isEdit && !containers.length) containers = splitContainers(ship.container_number).map(n=>({ id:null, number:n }));
  if (isEdit && !items.length && ship.po_id) items = [{ id:null, po_id:ship.po_id, name:ship.container_contents||'', qty:ship.total_quantity==null?'':ship.total_quantity }];
  if (!containers.length) containers.push({ id:null, number:'' });
  if (!items.length) items.push({ id:null, po_id:'', name:'', qty:'' });

  openModal(`
    <h3>${isEdit?(editable?'تعديل شحنة':'معاينة شحنة (عرض فقط)'):'شحنة جديدة'}</h3>
    <div class="field">
      <label>الحاويات (رقم لكل حاوية)</label>
      <div id="s-containers"></div>
      ${editable ? '<button type="button" class="btn small" id="sc-add">+ إضافة حاوية</button>' : ''}
    </div>
    <div class="field">
      <label>الأصناف — كل صنف مرتبط بأمر شراء (الشحنة قد تضم أكثر من أمر)</label>
      <div id="s-items"></div>
      ${editable ? '<button type="button" class="btn small" id="si-add">+ إضافة صنف</button>' : ''}
      <p class="muted" style="margin-top:6px">الكمية الإجمالية: <strong id="s-total-qty">0</strong> <span>(مجموع كميات الأصناف)</span></p>
    </div>
    <div class="row">
      <div class="field"><label>شركة الشحن</label><input id="s-shipping_line" list="ship-lines" value="${escHtml(ship?.shipping_line)}" placeholder="مثال: MSC, CMA CGM, ESL" ${dis}><datalist id="ship-lines">${TRACK_CARRIERS.map(c=>`<option value="${c.name}"></option>`).join('')}</datalist></div>
      <div class="field"><label>تاريخ طلب الحاوية</label><input type="date" id="s-container_order_date" value="${ship?.container_order_date||''}" ${dis}></div>
    </div>
    <div class="field"><label>رقم البوليصة (B/L) أو رابط التتبع</label><input id="s-tracking_url" value="${escHtml(ship?.tracking_url)}" placeholder="مثال: MEDUAFE39772 — أو رابط كامل https://..." ${dis}><p class="muted" id="s-trk-preview" style="margin-top:4px"></p></div>
    <div class="row">
      ${SHIP_MILESTONES.map(([key,label])=>`<div class="field"><label>${label}</label><input type="date" id="s-${key}" value="${ship?.[key]||''}" ${dis}></div>`).join('')}
    </div>
    <div class="field"><label>الحالة</label><input id="s-status" value="${escHtml(ship?.status)}" ${dis}></div>
    <div class="field"><label>ملاحظات</label><textarea id="s-notes" ${dis}>${escHtml(ship?.notes)}</textarea></div>
    ${isEdit && ship?.updated_by ? `<p class="muted">آخر تحديث بواسطة: ${userLabel(ship.updated_by)}</p>` : ''}
    ${isEdit ? renderAttachmentsBlock('shipment', ship.id, attachments) : '<p class="muted" style="margin-top:8px">📎 اضغط "حفظ" أولاً — ستفتح النافذة تلقائيًا لإرفاق الملفات.</p>'}
    <div class="row" style="margin-top:14px">
      ${editable ? '<button class="btn primary" id="save-ship">حفظ</button>' : ''}
      <button class="btn" id="cancel-ship">إغلاق</button>
      ${isEdit && canDelete() ? `<button class="btn danger" id="del-ship">حذف</button>` : ''}
    </div>
  `, (root)=>{
    root.querySelector('.modal').style.maxWidth = '860px';
    const lineNames = (poId) => [...new Set(linesFor(poId).map(l=>l.item_name).filter(Boolean))];
    const poSelect = (po) => `<option value="">— اختر أمر الشراء —</option>${orderOptions(po)}`;
    const updateTotal = () => {
      const t = items.reduce((a,it)=>a+(parseFloat(it.qty)||0),0);
      root.querySelector('#s-total-qty').textContent = fmtNum(t);
    };
    const renderRows = () => {
      root.querySelector('#s-containers').innerHTML = containers.map((c,i)=>`
        <div class="sh-row">
          <input class="sc-num" data-i="${i}" value="${escHtml(c.number)}" placeholder="XXXX1234567" style="flex:1" ${dis}>
          ${editable && containers.length>1 && (!c.id || owner) ? `<button type="button" class="btn small danger sc-del" data-i="${i}" title="حذف الحاوية">✕</button>` : ''}
        </div>`).join('');
      root.querySelector('#s-items').innerHTML = items.map((it,i)=>`
        <div class="sh-row items">
          <select class="si-po" data-i="${i}" style="flex:2 1 190px" ${dis}>${poSelect(it.po_id)}</select>
          <input class="si-name" data-i="${i}" list="si-dl-${i}" value="${escHtml(it.name)}" placeholder="اسم الصنف" style="flex:2 1 170px" ${dis}>
          <datalist id="si-dl-${i}">${lineNames(it.po_id).map(n=>`<option value="${escHtml(n)}"></option>`).join('')}</datalist>
          <input class="si-qty" data-i="${i}" type="number" step="0.01" min="0" value="${escHtml(it.qty)}" placeholder="الكمية" style="flex:1 1 100px" ${dis}>
          ${editable && items.length>1 && (!it.id || owner) ? `<button type="button" class="btn small danger si-del" data-i="${i}" title="حذف الصنف">✕</button>` : ''}
        </div>`).join('');
      updateTotal();
    };
    const sync = () => {
      root.querySelectorAll('.sc-num').forEach(el=>{ containers[+el.dataset.i].number = el.value; });
      root.querySelectorAll('.si-po').forEach(el=>{ items[+el.dataset.i].po_id = el.value; });
      root.querySelectorAll('.si-name').forEach(el=>{ items[+el.dataset.i].name = el.value; });
      root.querySelectorAll('.si-qty').forEach(el=>{ items[+el.dataset.i].qty = el.value; });
    };
    renderRows();
    root.querySelector('#s-containers').addEventListener('click', (e)=>{
      const b = e.target.closest('.sc-del'); if (!b) return;
      sync(); containers.splice(+b.dataset.i, 1); renderRows();
    });
    root.querySelector('#s-items').addEventListener('click', (e)=>{
      const b = e.target.closest('.si-del'); if (!b) return;
      sync(); items.splice(+b.dataset.i, 1); renderRows();
    });
    root.querySelector('#s-items').addEventListener('input', ()=>{ sync(); updateTotal(); });
    root.querySelector('#s-items').addEventListener('change', (e)=>{
      if (!e.target.classList.contains('si-po')) return;
      sync();
      const dl = root.querySelector('#si-dl-'+e.target.dataset.i);
      if (dl) dl.innerHTML = lineNames(e.target.value).map(n=>`<option value="${escHtml(n)}"></option>`).join('');
    });
    if (editable) {
      root.querySelector('#sc-add').onclick = () => { sync(); containers.push({ id:null, number:'' }); renderRows(); };
      root.querySelector('#si-add').onclick = () => { sync(); items.push({ id:null, po_id:items[items.length-1]?.po_id||'', name:'', qty:'' }); renderRows(); };
    }
    root.querySelector('#cancel-ship').onclick = closeModal;
    const trkPreview = () => {
      const el = root.querySelector('#s-trk-preview'); if (!el) return;
      const t = trackInfo(val('s-shipping_line'), val('s-tracking_url'));
      el.innerHTML = !t ? '' : t.kind==='url' ? `✓ رابط تتبع مباشر` : t.href ? `✓ سيظهر كرابط يفتح موقع <strong>${t.carrier}</strong> وينسخ الرقم تلقائيًا` : `⚠ اكتب شركة الشحن (MSC / CMA / ESL) ليتحول الرقم لرابط`;
    };
    ['s-tracking_url','s-shipping_line'].forEach(id=>root.querySelector('#'+id).addEventListener('input', trkPreview));
    trkPreview();

    if (editable) root.querySelector('#save-ship').onclick = async () => {
      sync();
      const cleanC = containers.map(c=>({ id:c.id, number:(c.number||'').trim() })).filter(c=>c.number);
      const seen = new Set();
      for (const c of cleanC) { const k = c.number.toUpperCase(); if (seen.has(k)) { toast('رقم الحاوية مكرر داخل الشحنة: '+c.number); return; } seen.add(k); }
      const cleanI = items.filter(it => it.po_id || (it.name||'').trim() || String(it.qty).trim()!=='');
      if (!cleanI.length || cleanI.some(it=>!it.po_id)) { toast('كل صنف لازم يكون له أمر شراء — اختر الأمر لكل صف أو احذف الصف الفارغ'); return; }
      if (cleanI.some(it=>String(it.qty).trim()!=='' && !(parseFloat(it.qty)>=0))) { toast('كمية غير صحيحة في أحد الأصناف'); return; }
      // صفوف محفوظة سابقًا واختفت = حذف → للمالك فقط
      const oldC = isEdit ? shipContainers(ship.id) : [], oldI = isEdit ? shipItems(ship.id) : [];
      const keepC = new Set(cleanC.filter(c=>c.id).map(c=>c.id)), keepI = new Set(cleanI.filter(i=>i.id).map(i=>i.id));
      const delC = oldC.filter(c=>!keepC.has(c.id)).map(c=>c.id), delI = oldI.filter(i=>!keepI.has(i.id)).map(i=>i.id);
      if ((delC.length || delI.length) && !owner) { toast('حذف حاوية أو صنف محفوظ مسموح للمالك فقط'); return; }

      const totalQty = cleanI.reduce((a,it)=>a+(parseFloat(it.qty)||0),0);
      const payload = {
        po_id: cleanI[0].po_id,
        container_number: cleanC.map(c=>c.number).join(' / ') || null,
        shipping_line: val('s-shipping_line')||null, tracking_url: val('s-tracking_url')||null,
        container_order_date: val('s-container_order_date')||null,
        container_contents: cleanI.map(i=>(i.name||'').trim()).filter(Boolean).join('، ') || null,
        total_quantity: totalQty || null,
        notes: val('s-notes')||null,
        status: val('s-status')||null,
        updated_by: currentUser.id,
      };
      SHIP_MILESTONES.forEach(([key])=> payload[key] = val('s-'+key) || null);

      let shipId = isEdit ? ship.id : null;
      try {
        if (isEdit) {
          const { error } = await sb.from('erp_shipments').update(payload).eq('id', shipId);
          if (error) throw error;
        } else {
          payload.created_by = currentUser.id;
          const { data: newShip, error } = await sb.from('erp_shipments').insert(payload).select().single();
          if (error) throw error;
          shipId = newShip.id;
        }
        // الحاويات
        if (delC.length) { const { error } = await sb.from('erp_shipment_containers').delete().in('id', delC); if (error) throw error; }
        for (const c of cleanC.filter(c=>c.id)) {
          const old = oldC.find(x=>x.id===c.id);
          if (old && old.container_number !== c.number) { const { error } = await sb.from('erp_shipment_containers').update({ container_number:c.number }).eq('id', c.id); if (error) throw error; }
        }
        const newC = cleanC.filter(c=>!c.id).map(c=>({ shipment_id:shipId, container_number:c.number, created_by:currentUser.id }));
        if (newC.length) { const { error } = await sb.from('erp_shipment_containers').insert(newC); if (error) throw error; }
        // الأصناف
        if (delI.length) { const { error } = await sb.from('erp_shipment_items').delete().in('id', delI); if (error) throw error; }
        const toRow = (it) => {
          const name = (it.name||'').trim();
          const ln = cache.lines.find(l=>l.po_id===it.po_id && l.item_name && l.item_name.trim()===name);
          return { po_id:it.po_id, po_line_item_id: ln ? ln.id : null, item_name: name || null, quantity: String(it.qty).trim()==='' ? null : parseFloat(it.qty) };
        };
        for (const it of cleanI.filter(i=>i.id)) {
          const old = oldI.find(x=>x.id===it.id), r = toRow(it);
          if (old && (old.po_id!==r.po_id || (old.item_name||null)!==r.item_name || Number(old.quantity)!==Number(r.quantity) || (old.quantity==null)!==(r.quantity==null) || (old.po_line_item_id||null)!==r.po_line_item_id)) {
            const { error } = await sb.from('erp_shipment_items').update(r).eq('id', it.id); if (error) throw error;
          }
        }
        const newI = cleanI.filter(i=>!i.id).map(it=>({ ...toRow(it), shipment_id:shipId, created_by:currentUser.id }));
        if (newI.length) { const { error } = await sb.from('erp_shipment_items').insert(newI); if (error) throw error; }
        toast(isEdit ? 'تم الحفظ' : 'تم الحفظ — يمكنك الآن إرفاق ملف');
        await refreshAll(); renderActiveTab();
        if (isEdit) closeModal(); else openShipmentModal(cache.shipments.find(s=>s.id===shipId));
      } catch(e){
        toast('خطأ: '+e.message);
        if (shipId) { await refreshAll(); renderActiveTab(); openShipmentModal(cache.shipments.find(s=>s.id===shipId)); }
      }
    };
    if (isEdit && canDelete()) root.querySelector('#del-ship').onclick = async () => {
      if (!confirm('حذف هذه الشحنة بحاوياتها وأصنافها؟')) return;
      const { error } = await sb.from('erp_shipments').delete().eq('id', ship.id);
      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم الحذف'); closeModal(); await refreshAll(); renderActiveTab();
    };
    if (isEdit) wireAttachmentsBlock(root, 'shipment', ship.id, () => openShipmentModal(cache.shipments.find(s=>s.id===ship.id)));
  });
}

function computeCommitment(f){
  if (!f.need_by_date) return null;
  const d = new Date(f.need_by_date);
  const totalDays = (parseInt(f.production_days)||0)+(parseInt(f.shipping_days)||0)+(parseInt(f.customs_days)||0)+(parseInt(f.inspection_days)||0)+(parseInt(f.margin_days)||0);
  d.setDate(d.getDate() - totalDays);
  return d.toISOString().slice(0,10);
}
function renderSeason(root){
  const canAdd = canWrite();
  root.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <strong>خطة الـ6 أشهر (${cache.season.length})</strong>
        <div class="row" style="flex:0;gap:8px">
          <button class="btn small" id="exp-season">تصدير إكسل</button>
          ${canAdd ? '<button class="btn primary small" id="add-season">+ بند جديد</button>' : ''}
        </div>
      </div>
      ${bulkBarHtml('season', cache.season)}
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr>${bulkThHtml('season', cache.season)}<th>الصنف</th><th>المورد</th><th>موعد الحاجة</th><th>موعد الالتزام (محسوب)</th><th>مرتبط بأمر؟</th><th>الحالة</th><th></th></tr></thead>
        <tbody>
          ${cache.season.map(s=>`
            <tr>
              ${bulkTdHtml('season', s.id)}<td>${s.item_name}</td><td>${supplierName(s.supplier_id)}</td>
              <td>${fmtDate(s.need_by_date)}</td><td><strong>${fmtDate(s.commitment_date)}</strong></td>
              <td>${s.linked_po_id? '✓' : '—'}</td><td>${s.status}</td>
              <td>${canAdd?`<button class="btn small" data-id="${s.id}" data-act="edit-season">${canEditExisting()?'تعديل':'عرض'}</button>`:''}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <p class="muted" style="margin-top:8px">موعد الالتزام = موعد الحاجة − (إنتاج + شحن + تخليص + فحص + هامش) — SOP-01</p>
    </div>
  `;
  root.querySelector('#exp-season').onclick = () => exportToExcel(cache.season.map(s=>({
    الصنف:s.item_name, المورد:supplierName(s.supplier_id), موعد_الحاجة:s.need_by_date, موعد_الالتزام:s.commitment_date,
    أيام_الإنتاج:s.production_days, أيام_الشحن:s.shipping_days, أيام_التخليص:s.customs_days, أيام_الفحص:s.inspection_days, أيام_الهامش:s.margin_days, الحالة:s.status
  })), 'season_plan');
  if (canAdd) root.querySelector('#add-season').onclick = () => openSeasonModal(null);
  root.querySelectorAll('[data-act="edit-season"]').forEach(b=>{
    b.onclick = () => openSeasonModal(cache.season.find(s=>s.id===b.dataset.id));
  });
  wireBulk(root, 'season', cache.season, { table:'erp_season_plan', label:'بند', plural:'بنود خطة الموسم', attachType:'season' });
}
function openSeasonModal(item){
  const isEdit = !!item;
  const editable = !isEdit ? canWrite() : canEditExisting();
  const attachments = isEdit ? attachmentsFor('season', item.id) : [];
  openModal(`
    <h3>${isEdit?'تعديل بند خطة الموسم':'بند جديد في خطة الموسم'}</h3>
    <div class="row">
      <div class="field"><label>اسم الصنف</label><input id="sp-item_name" value="${item?.item_name||''}"></div>
      <div class="field"><label>المورد</label><select id="sp-supplier_id"><option value="">—</option>${supplierOptions(item?.supplier_id)}</select></div>
    </div>
    <div class="field"><label>موعد الحاجة</label><input type="date" id="sp-need_by_date" value="${item?.need_by_date||''}"></div>
    <div class="row">

// ============================================================
// WAREHOUSE RECEIVING — استلام المستودع (تأكيد الوصول والكميات الفعلية)
// ============================================================
// ----- استلام المستودع: استلام واحد قد يغطي أكثر من أمر شراء (شحنة واحدة) -----
function receiptPoIds(r){
  const ids = [...new Set(cache.warehouseReceiptPos.filter(x=>x.receipt_id===r.id).map(x=>x.po_id))];
  if (r.po_id && !ids.includes(r.po_id)) ids.unshift(r.po_id); // استلامات قديمة بأمر واحد
  return ids;
}
function receiptPoNumbers(r){ return receiptPoIds(r).map(id=>cache.orders.find(o=>o.id===id)?.po_number||'—'); }
function receiptSupplierNames(r){
  return [...new Set(receiptPoIds(r).map(id=>{ const o=cache.orders.find(x=>x.id===id); return o?supplierName(o.supplier_id):null; }).filter(Boolean))];
}
function lineExpected(l){
  const pl = l.po_line_item_id ? cache.lines.find(x=>x.id===l.po_line_item_id) : null;
  if (pl && pl.quantity!=null) return Number(pl.quantity);
  return l.ordered_quantity!=null ? Number(l.ordered_quantity) : null;
}
function receiptTotals(r){
  const ls = receiptLinesFor(r.id);
  return { n: ls.length,
    exp: ls.reduce((a,l)=>a+(lineExpected(l)||0),0),
    rcv: ls.reduce((a,l)=>a+(Number(l.received_quantity)||0),0) };
}

function renderWarehouseReceipts(root){
  const canAdd = canWriteReceipts();
  root.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <strong>استلام المستودع (${cache.warehouseReceipts.length})</strong>
        <div class="row" style="flex:0;gap:8px">
          <button class="btn small" id="exp-wh">تصدير إكسل</button>
          ${canAdd ? '<button class="btn primary small" id="add-wh">+ استلام جديد</button>' : ''}
        </div>
      </div>
      ${bulkBarHtml('receipts', cache.warehouseReceipts)}
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr>${bulkThHtml('receipts', cache.warehouseReceipts)}<th>الأوامر</th><th>المورد</th><th>الحاوية</th><th>موقع المستودع</th><th>تاريخ الاستلام</th><th>استلم بواسطة</th><th>الحالة</th><th>حالة البضاعة</th><th>المستلم / المتوقع</th><th></th></tr></thead>
        <tbody>
          ${cache.warehouseReceipts.map(r=>{
            const ship = cache.shipments.find(s=>s.id===r.shipment_id);
            const condBad = r.condition_status && r.condition_status !== 'سليمة بالكامل';
            const pos = receiptPoNumbers(r), sups = receiptSupplierNames(r), t = receiptTotals(r);
            const diff = t.rcv - t.exp;
            const tot = t.n ? `${fmtNum(t.rcv)} / ${fmtNum(t.exp)} ${diff===0?'<span class="badge ok">مطابق</span>':`<span class="badge ${diff<0?'bad':'warn'}">${diff>0?'+':''}${fmtNum(diff)}</span>`}` : '—';
            return `<tr>
              ${bulkTdHtml('receipts', r.id)}<td>${pos.length?pos.map(escHtml).join('، '):'—'}</td>
              <td>${sups.length?sups.map(escHtml).join('، '):'—'}</td>
              <td>${ship?escHtml(shipLabel(ship)):'—'}</td>
              <td>${r.warehouse_location||'—'}</td>
              <td>${fmtDate(r.received_date)}</td>
              <td>${r.received_by_name||'—'}</td>
              <td>${r.status||'—'}</td>
              <td>${condBad?`<span class="badge bad">${r.condition_status}</span>`:(r.condition_status||'—')}</td>
              <td>${tot}</td>
              <td><button class="btn small" data-id="${r.id}" data-act="edit-wh">${canEditReceipts()?'تعديل':'👁 معاينة'}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  // التصدير: صف لكل بند استلام (والاستلام بلا بنود يظهر في صف واحد)
  root.querySelector('#exp-wh').onclick = () => {
    const rows = [];
    cache.warehouseReceipts.forEach(r=>{
      const base = { الأوامر: receiptPoNumbers(r).join(' ، '), الموردون: receiptSupplierNames(r).join(' ، '),
        الحاوية: (()=>{ const s=cache.shipments.find(x=>x.id===r.shipment_id); return s?shipLabel(s):''; })(),
        موقع_المستودع: r.warehouse_location, تاريخ_الاستلام: r.received_date, استلم_بواسطة: r.received_by_name,
        الحالة: r.status, حالة_البضاعة: r.condition_status, ملاحظات: r.notes };
      const ls = receiptLinesFor(r.id);
      if (!ls.length) { rows.push({ ...base, أمر_البند:'', الصنف:'', المتوقع:'', المستلم:'', الفرق:'', ملاحظات_الفرق:'' }); return; }
      ls.forEach(l=>{
        const po = cache.orders.find(o=>o.id===(l.po_id || cache.lines.find(x=>x.id===l.po_line_item_id)?.po_id));
        const exp = lineExpected(l);
        rows.push({ ...base, أمر_البند: po?po.po_number:'', الصنف: l.item_name, المتوقع: exp, المستلم: Number(l.received_quantity),
          الفرق: exp!=null ? Number(l.received_quantity)-exp : '', ملاحظات_الفرق: l.discrepancy_notes });
      });
    });
    exportToExcel(rows, 'warehouse_receipts');
  };
  if (canAdd) root.querySelector('#add-wh').onclick = () => openWarehouseReceiptModal(null);
  root.querySelectorAll('[data-act="edit-wh"]').forEach(b=>{
    b.onclick = () => openWarehouseReceiptModal(cache.warehouseReceipts.find(r=>r.id===b.dataset.id));
  });
  wireRowPreview(root, 'edit-wh', !canEditReceipts());
  wireBulk(root, 'receipts', cache.warehouseReceipts, { table:'erp_warehouse_receipts', label:'استلام', plural:'استلامات المستودع', attachType:'receipt', note:'(بكل بنودها)' });
}

function openWarehouseReceiptModal(receipt){
  const isEdit = !!receipt;
  const editable = !isEdit ? canWriteReceipts() : canEditReceipts();
  const dis = editable ? '' : 'disabled';
  const attachments = isEdit ? attachmentsFor('receipt', receipt.id) : [];
  const existingLines = isEdit ? receiptLinesFor(receipt.id) : [];
  const lineOwnerPo = l => l.po_id || cache.lines.find(x=>x.id===l.po_line_item_id)?.po_id || receipt?.po_id || null;

  let shipId = receipt?.shipment_id || '';
  const sel = isEdit ? receiptPoIds(receipt) : [];
  existingLines.forEach(l=>{ const p = lineOwnerPo(l); if (p && !sel.includes(p)) sel.push(p); });
  const savedPoSet = new Set(existingLines.map(lineOwnerPo).filter(Boolean)); // أوامر لها بنود محفوظة: لا تُزال من هنا
  const originallyNoPo = isEdit && receiptPoIds(receipt).length === 0;
  const rows = new Map();
  const usedLines = new Set();
  let seq = 0, statusTouched = false;

  // ----- حالة الصفوف (واحد لكل صنف في الأمر + أصناف يدوية) -----
  function ensureRows(poId){
    linesFor(poId).forEach(pl=>{
      const key = 'L:'+pl.id;
      if (rows.has(key)) return;
      const ex = existingLines.find(l=>l.po_line_item_id===pl.id && !usedLines.has(l.id));
      if (ex) usedLines.add(ex.id);
      rows.set(key, { key, po_id:poId, po_line_item_id:pl.id, item_name:pl.item_name, ordered:Number(pl.quantity)||0,
        received: ex ? String(ex.received_quantity) : '', notes: ex?.discrepancy_notes||'', lineId: ex?.id||null, manual:false });
    });
    existingLines.filter(l=>!usedLines.has(l.id) && lineOwnerPo(l)===poId).forEach(l=>{
      usedLines.add(l.id);
      rows.set('M:'+l.id, { key:'M:'+l.id, po_id:poId, po_line_item_id:l.po_line_item_id||null, item_name:l.item_name,
        ordered:null, expSaved: l.ordered_quantity!=null?Number(l.ordered_quantity):null,
        received:String(l.received_quantity), notes:l.discrepancy_notes||'', lineId:l.id, manual:true });
    });
  }
  sel.forEach(ensureRows);

  // الكمية في الشحنة (للعلم فقط): تُطابَق بمعرّف البند ثم بالاسم؛ null = غير معروف، 0 = غير مدرج فعلًا
  const normName = t => String(t||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
  function shipQty(poId, plId, name){
    if (!shipId) return null;
    const its = shipItems(shipId).filter(i=>i.po_id===poId);
    if (!its.length) return null;
    const byId = its.filter(i=>plId && i.po_line_item_id===plId);
    if (byId.length) return byId.reduce((a,i)=>a+(Number(i.quantity)||0),0);
    const nm = normName(name);
    const byName = nm ? its.filter(i=>!i.po_line_item_id && normName(i.item_name)===nm) : [];
    if (byName.length) return byName.reduce((a,i)=>a+(Number(i.quantity)||0),0);
    return its.some(i=>!i.po_line_item_id) ? null : 0; // بنود شحنة غير مربوطة: لا نجزم بعدم الإدراج
  }
  // الكمية المتوقعة = كمية بند أمر الشراء (الفرق = المستلم − المطلوب في الأمر)
  function expOf(r){
    if (r.manual) return r.expSaved!=null ? r.expSaved : null;
    return r.ordered;
  }
  function diffHtml(r){
    if (r.received==='' || isNaN(Number(r.received))) return '<span class="muted">—</span>';
    const e = expOf(r); if (e==null) return '<span class="muted">—</span>';
    const d = Number(r.received) - e;
    return d===0 ? '<span class="badge ok">مطابق</span>' : `<span class="badge ${d<0?'bad':'warn'}">${d>0?'+':''}${fmtNum(d)}</span>`;
  }
  function poRows(poId){
    const list = [...rows.values()].filter(r=>r.po_id===poId);
    const inShip = r => (r.manual || shipQty(r.po_id, r.po_line_item_id, r.item_name)!==0) ? 0 : 1;
    return list.sort((a,b)=>inShip(a)-inShip(b)); // الأصناف داخل الشحنة أولاً (الترتيب الأصلي يُحفظ)
  }
  function totalsHtml(poId){
    const rs = poRows(poId);
    const exp = rs.reduce((a,r)=>a+(expOf(r)||0),0);
    const rcv = rs.reduce((a,r)=>a+(r.received!==''&&!isNaN(Number(r.received))?Number(r.received):0),0);
    return `<td><strong>الإجمالي</strong></td><td colspan="${shipColVisible(poId)?2:1}"><strong>${fmtNum(exp)}</strong></td><td><strong>${fmtNum(rcv)}</strong></td><td colspan="3"></td>`;
  }
  function shipColVisible(poId){ return !!shipId && shipItems(shipId).some(i=>i.po_id===poId); }

  function itemsHtml(){
    if (!sel.length) return '<p class="muted" style="margin-top:8px">اختر أمر شراء واحدًا أو أكثر لتظهر أصنافه هنا وتسجّل الكمية المستلمة فعليًا.</p>';
    return sel.map(poId=>{
      const o = cache.orders.find(x=>x.id===poId);
      const showShip = shipColVisible(poId);
      const body = poRows(poId).map(r=>{
        const sh = r.manual ? null : shipQty(r.po_id, r.po_line_item_id, r.item_name);
        const dim = sh===0 ? 'opacity:.55' : '';
        const nameCell = (r.manual && !r.po_line_item_id) ? `<input class="wh-name" value="${escHtml(r.item_name)}" placeholder="اسم الصنف" ${dis}>` : escHtml(r.item_name) + (sh===0?' <span class="muted">(غير مدرج في الشحنة)</span>':'') + (r.manual?' <span class="badge info">خارج الأمر</span>':'');
        const delBtn = r.lineId ? (canDelete()?`<button type="button" class="btn small wh-delrow" data-key="${r.key}">حذف</button>`:'')
                                : (r.manual && editable ? `<button type="button" class="btn small wh-rmrow" data-key="${r.key}">×</button>` : '');
        return `<tr data-key="${r.key}" style="${dim}">
          <td>${nameCell}</td>
          <td>${r.ordered!=null?fmtNum(r.ordered):'—'}</td>
          ${showShip?`<td>${sh!=null?fmtNum(sh):'—'}</td>`:''}
          <td><input class="wh-rcv" type="number" step="0.01" min="0" inputmode="decimal" value="${escHtml(r.received)}" style="width:110px" ${dis}></td>
          <td class="wh-diff">${diffHtml(r)}</td>
          <td><input class="wh-note" value="${escHtml(r.notes)}" placeholder="ملاحظة الفرق" ${dis}></td>
          <td>${delBtn}</td>
        </tr>`;
      }).join('');
      return `<div class="card" data-po="${poId}" style="margin-top:10px">
        <div class="toolbar"><strong>أمر ${escHtml(o?.po_number||'(بلا رقم)')} — ${escHtml(o?supplierName(o.supplier_id):'')}</strong>
          ${editable?`<div class="row" style="flex:0;gap:6px"><button type="button" class="btn small wh-fill" data-po="${poId}">تعبئة الفارغ بالمتوقع</button><button type="button" class="btn small wh-addrow" data-po="${poId}">+ صنف خارج الأمر</button></div>`:''}</div>
        <div style="overflow:auto"><table>
          <thead><tr><th>الصنف</th><th>المطلوب (الأمر)</th>${showShip?'<th>في الشحنة</th>':''}<th>المستلم فعليًا</th><th>الفرق</th><th>ملاحظات</th><th></th></tr></thead>
          <tbody>${body || '<tr><td colspan="7" class="muted">لا توجد أصناف في هذا الأمر — أضف صنفًا يدويًا.</td></tr>'}</tbody>
          <tfoot><tr class="wh-tot" data-po="${poId}">${totalsHtml(poId)}</tr></tfoot>
        </table></div>
      </div>`;
    }).join('');
  }
  function chipsHtml(){
    return sel.map(id=>{
      const o = cache.orders.find(x=>x.id===id), locked = savedPoSet.has(id);
      return `<span class="badge info" style="padding:4px 8px;margin:2px;display:inline-flex;gap:6px;align-items:center">${escHtml(o?.po_number||'(بلا رقم)')} — ${escHtml(o?supplierName(o.supplier_id):'')}${editable?` <button type="button" class="btn small wh-rmpo" data-po="${id}" style="padding:0 6px" ${locked?'disabled title="لهذا الأمر بنود محفوظة — يحذف المالك بنوده أولاً"':''}>×</button>`:''}</span>`;
    }).join('') || '<span class="muted">لم يُختر أي أمر بعد</span>';
  }
  function addPoOptions(){
    const rest = cache.orders.filter(o=>!sel.includes(o.id));
    const inShip = shipId ? rest.filter(o=>shipPoIds(cache.shipments.find(s=>s.id===shipId)||{id:''}).includes(o.id)) : [];
    const others = rest.filter(o=>!inShip.includes(o));
    const opt = o => `<option value="${o.id}">${escHtml(o.po_number||'(بلا رقم)')} — ${escHtml(supplierName(o.supplier_id))}</option>`;
    return `<option value="">＋ أضف أمر شراء…</option>` +
      (inShip.length?`<optgroup label="أوامر الشحنة المختارة">${inShip.map(opt).join('')}</optgroup>`:'') +
      (others.length?`<optgroup label="باقي الأوامر">${others.map(opt).join('')}</optgroup>`:'');
  }
  function shipOptions(){
    return cache.shipments.map(s=>`<option value="${s.id}" ${shipId===s.id?'selected':''}>${escHtml(shipLabel(s))} — أوامر: ${escHtml(shipPoNumbers(s).join('، ')||'—')}</option>`).join('');
  }

  openModal(`
    <h3>${isEdit?(editable?'تعديل استلام مستودع':'معاينة استلام مستودع (عرض فقط)'):'استلام مستودع جديد'}</h3>
    <div class="field"><label>الشحنة (اختياري) — عند اختيارها تُضاف أوامرها تلقائيًا</label>
      <select id="wh-shipment_id" ${dis}><option value="">—</option>${shipOptions()}</select></div>
    <div class="field"><label>أوامر الشراء في هذا الاستلام (يمكن أكثر من أمر)</label>
      <div id="wh-chips">${chipsHtml()}</div>
      ${editable?`<select id="wh-addpo" style="margin-top:6px">${addPoOptions()}</select>`:''}</div>
    <div class="row">
      <div class="field"><label>موقع المستودع</label><input id="wh-warehouse_location" list="wh-locations" value="${escHtml(receipt?.warehouse_location||'')}" placeholder="مثال: المستودع الرئيسي، مستودع خمرة" ${dis}>
        <datalist id="wh-locations"><option value="المستودع الرئيسي"><option value="مستودع خمرة"></datalist>
      </div>
      <div class="field"><label>تاريخ الاستلام</label><input type="date" id="wh-received_date" value="${receipt?.received_date||today}" ${dis}></div>
    </div>
    <div class="row">
      <div class="field"><label>استلم بواسطة</label><input id="wh-received_by_name" value="${escHtml(receipt?.received_by_name||'')}" placeholder="اسم مسؤول المستودع" ${dis}></div>
      <div class="field"><label>الحالة</label><select id="wh-status" ${dis}>${['مستلم جزئياً','مستلم بالكامل','به فروقات'].map(s=>`<option value="${s}" ${receipt?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>حالة البضاعة المستلمة</label><select id="wh-condition_status" ${dis}>${['سليمة بالكامل','تالفة جزئيًا','تالفة كليًا'].map(s=>`<option value="${s}" ${(receipt?.condition_status||'سليمة بالكامل')===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>ملاحظات</label><textarea id="wh-notes" ${dis}>${escHtml(receipt?.notes||'')}</textarea></div>

    <div style="margin-top:6px"><strong>أصناف الاستلام (الكميات الفعلية)</strong>
      <div class="muted">الفرق = المستلم فعليًا − المطلوب في أمر الشراء (عمود «في الشحنة» للعلم فقط). اترك الصنف فارغًا إن لم يصل.</div></div>
    <div id="wh-items">${itemsHtml()}</div>

    ${isEdit ? renderAttachmentsBlock('receipt', receipt.id, attachments) : '<p class="muted" style="margin-top:8px">بعد الحفظ تُفتح النافذة تلقائيًا لإرفاق صور حالة البضاعة.</p>'}

    <div class="row" style="margin-top:14px">
      ${editable ? '<button class="btn primary" id="save-wh">حفظ</button>' : ''}
      <button class="btn" id="cancel-wh">إغلاق</button>
      ${isEdit && canDelete() ? `<button class="btn danger" id="del-wh">حذف الاستلام</button>` : ''}
    </div>
  `, (root)=>{
    root.querySelector('.modal').style.maxWidth = '980px';
    const itemsEl = root.querySelector('#wh-items'), chipsEl = root.querySelector('#wh-chips');
    const addSel = root.querySelector('#wh-addpo'), shipSel = root.querySelector('#wh-shipment_id'), statusSel = root.querySelector('#wh-status');
    statusSel.addEventListener('change', ()=>{ statusTouched = true; });

    function redrawPos(){
      itemsEl.innerHTML = itemsHtml(); chipsEl.innerHTML = chipsHtml();
      if (addSel) addSel.innerHTML = addPoOptions();
    }
    function suggestStatus(){
      if (!editable || statusTouched) return;
      const rs = [...rows.values()];
      const filled = rs.filter(r=>r.received!=='' && !isNaN(Number(r.received)));
      if (!filled.length) return;
      const anyDiff = filled.some(r=>{ const e=expOf(r); return e!=null && Number(r.received)!==e; });
      const allCovered = rs.filter(r=>!r.manual && (expOf(r)||0)>0).every(r=>r.received!=='');
      statusSel.value = anyDiff ? 'به فروقات' : (allCovered ? 'مستلم بالكامل' : 'مستلم جزئياً');
    }
    function addPo(poId){
      if (!poId || sel.includes(poId)) return;
      sel.push(poId); ensureRows(poId);
    }

    root.querySelector('#cancel-wh').onclick = closeModal;
    if (editable) {
      shipSel.onchange = () => {
        shipId = shipSel.value;
        if (shipId) {
          const s = cache.shipments.find(x=>x.id===shipId);
          const added = shipPoIds(s).filter(id=>!sel.includes(id));
          added.forEach(addPo);
          if (added.length) toast('أُضيفت أوامر الشحنة: ' + added.map(id=>cache.orders.find(o=>o.id===id)?.po_number||'—').join('، '));
        }
        redrawPos(); suggestStatus();
      };
      addSel.onchange = () => { addPo(addSel.value); redrawPos(); };
    }

    // ----- أحداث الجدول (تفويض) -----
    itemsEl.addEventListener('input', (e)=>{
      const tr = e.target.closest('tr[data-key]'); if (!tr) return;
      const r = rows.get(tr.dataset.key); if (!r) return;
      if (e.target.classList.contains('wh-rcv')) {
        r.received = e.target.value;
        tr.querySelector('.wh-diff').innerHTML = diffHtml(r);
        const tot = itemsEl.querySelector(`.wh-tot[data-po="${r.po_id}"]`); if (tot) tot.innerHTML = totalsHtml(r.po_id);
        suggestStatus();
      } else if (e.target.classList.contains('wh-note')) r.notes = e.target.value;
      else if (e.target.classList.contains('wh-name')) r.item_name = e.target.value;
    });
    itemsEl.addEventListener('click', async (e)=>{
      const b = e.target.closest('button'); if (!b || !editable && !b.classList.contains('wh-delrow')) return;
      if (b.classList.contains('wh-fill')) {
        poRows(b.dataset.po).forEach(r=>{ const x=expOf(r); if (r.received==='' && x>0) r.received = String(x); });
        redrawPos(); suggestStatus();
      } else if (b.classList.contains('wh-addrow')) {
        const key = 'M:new'+(++seq);
        rows.set(key, { key, po_id:b.dataset.po, po_line_item_id:null, item_name:'', ordered:null, expSaved:null, received:'', notes:'', lineId:null, manual:true });
        redrawPos();
      } else if (b.classList.contains('wh-rmrow')) { rows.delete(b.dataset.key); redrawPos(); suggestStatus(); }
      else if (b.classList.contains('wh-delrow')) {
        const r = rows.get(b.dataset.key); if (!r?.lineId) return;
        if (!confirm('حذف هذا البند من الاستلام نهائيًا؟ (أي تعديلات غير محفوظة في هذه النافذة ستضيع)')) return;
        const { error } = await sb.from('erp_warehouse_receipt_lines').delete().eq('id', r.lineId);
        if (error) { toast('خطأ: '+error.message); return; }
        await refreshAll(); renderActiveTab();
        openWarehouseReceiptModal(cache.warehouseReceipts.find(x=>x.id===receipt.id));
      }
    });
    chipsEl.addEventListener('click', (e)=>{
      const b = e.target.closest('.wh-rmpo'); if (!b || b.disabled || !editable) return;
      const id = b.dataset.po, i = sel.indexOf(id); if (i<0) return;
      sel.splice(i,1);
      [...rows.keys()].filter(k=>rows.get(k).po_id===id).forEach(k=>rows.delete(k));
      redrawPos(); suggestStatus();
    });

    // ----- الحفظ: الاستلام ثم ربط الأوامر ثم البنود -----
    if (editable) root.querySelector('#save-wh').onclick = async () => {
      if (!sel.length && !(isEdit && originallyNoPo)) { toast('اختر أمر شراء واحدًا على الأقل'); return; }
      const bad = [...rows.values()].find(r=>{
        const filled = r.received!=='';
        if (filled && (isNaN(Number(r.received)) || Number(r.received)<0)) return true;
        if ((filled || r.lineId) && !String(r.item_name||'').trim()) return true;
        return false;
      });
      if (bad) { toast('راجع الصفوف: الكمية رقم موجب، والصنف اليدوي يحتاج اسمًا'); return; }
      const btn = root.querySelector('#save-wh'); btn.disabled = true;
      const payload = {
        po_id: sel[0]||null, shipment_id: shipId||null,
        warehouse_location: val('wh-warehouse_location')||null,
        received_date: val('wh-received_date')||null,
        received_by_name: val('wh-received_by_name')||null,
        status: val('wh-status'), condition_status: val('wh-condition_status')||null, notes: val('wh-notes')||null,
      };
      let rid = receipt?.id || null;
      try {
        if (isEdit) {
          const { error } = await sb.from('erp_warehouse_receipts').update(payload).eq('id', rid);
          if (error) throw error;
        } else {
          payload.created_by = currentUser.id;
          const { data: nr, error } = await sb.from('erp_warehouse_receipts').insert(payload).select().single();
          if (error) throw error;
          rid = nr.id;
        }
        // ربط الأوامر
        const have = cache.warehouseReceiptPos.filter(x=>x.receipt_id===rid).map(x=>x.po_id);
        const toAdd = sel.filter(id=>!have.includes(id)), toDel = have.filter(id=>!sel.includes(id));
        if (toAdd.length) {
          const { error } = await sb.from('erp_warehouse_receipt_pos').insert(toAdd.map(po_id=>({ receipt_id:rid, po_id, created_by:currentUser.id })));
          if (error) throw error;
        }
        for (const po_id of toDel) {
          const { error } = await sb.from('erp_warehouse_receipt_pos').delete().eq('receipt_id', rid).eq('po_id', po_id);
          if (error) throw error;
        }
        // البنود
        const inserts = [], updates = [];
        [...rows.values()].forEach(r=>{
          const filled = r.received!=='';
          const e = expOf(r);
          const rec = filled ? Number(r.received) : 0;
          const notes = (r.notes||'').trim() || null;
          if (r.lineId) {
            const old = existingLines.find(l=>l.id===r.lineId);
            const same = old && Number(old.received_quantity)===rec && (old.discrepancy_notes||null)===notes
              && (old.ordered_quantity!=null?Number(old.ordered_quantity):null)===(e!=null?e:null)
              && old.po_id===r.po_id && old.item_name===r.item_name;
            if (!same) updates.push({ id:r.lineId, patch:{ po_id:r.po_id, item_name:r.item_name.trim(), ordered_quantity:e, received_quantity:rec, discrepancy_notes:notes } });
          } else if (filled) {
            inserts.push({ receipt_id:rid, po_id:r.po_id, po_line_item_id:r.po_line_item_id, item_name:r.item_name.trim(),
              ordered_quantity:e, received_quantity:rec, discrepancy_notes:notes, created_by:currentUser.id });
          }
        });
        if (inserts.length) { const { error } = await sb.from('erp_warehouse_receipt_lines').insert(inserts); if (error) throw error; }
        for (const u of updates) { const { error } = await sb.from('erp_warehouse_receipt_lines').update(u.patch).eq('id', u.id); if (error) throw error; }

        await refreshAll(); renderActiveTab();
        if (isEdit) { toast('تم الحفظ'); closeModal(); }
        else { toast('تم الحفظ — يمكنك الآن إرفاق صور حالة البضاعة'); openWarehouseReceiptModal(cache.warehouseReceipts.find(r=>r.id===rid)); }
      } catch(err) {
        btn.disabled = false;
        if (rid && !isEdit) { // الاستلام اتسجّل قبل الخطأ: نفتحه للتعديل حتى لا يتكرر
          await refreshAll(); renderActiveTab();
          toast('تم حفظ الاستلام لكن حدث خطأ في جزء منه: ' + (err.message||err) + ' — راجع البيانات واحفظ مرة أخرى');
          openWarehouseReceiptModal(cache.warehouseReceipts.find(r=>r.id===rid));
        } else toast('خطأ: ' + (err.message||err));
      }
    };
    if (isEdit && canDelete()) root.querySelector('#del-wh').onclick = async () => {
      if (!confirm('حذف استلام المستودع وكل بنوده؟')) return;
      const { error } = await sb.from('erp_warehouse_receipts').delete().eq('id', receipt.id);
      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم الحذف'); closeModal(); await refreshAll(); renderActiveTab();
    };

function renderComparison(root){

    const orders = cache.orders.filter(o=>o.supplier_id===s.id);
    const lines = orders.flatMap(o=>linesFor(o.id));
    const totalSpend = lines.reduce((sum,l)=>sum+(l.line_total||l.unit_price*l.quantity||0),0);
    const payments = orders.flatMap(o=>paymentsFor(o.id));
    const paidPayments = payments.filter(p=>p.status==='مُحوَّلة');
    const shipments = orders.flatMap(o=>shipmentsFor(o.id));
    const receivedShipments = shipments.filter(sh=>sh.received_date);

    return {
      ...s, orderCount: orders.length, lineCount: lines.length, totalSpend,
      paymentCount: payments.length, paidCount: paidPayments.length,
      shipmentCount: shipments.length, receivedCount: receivedShipments.length,

    };

          <div class="stat-row"><span class="stat-label">عدد البنود</span><span class="stat-value">${s.lineCount}</span></div>
          <div class="stat-row"><span class="stat-label">إجمالي الإنفاق</span><span class="stat-value">${fmtNum(s.totalSpend)}</span></div>
          <div class="stat-row"><span class="stat-label">نسبة من الإجمالي</span><span class="stat-value ${totalSpendAll && s.totalSpend/totalSpendAll>0.5?'style="color:var(--danger);font-weight:700"':''}">${totalSpendAll ? Math.round(s.totalSpend/totalSpendAll*100) : 0}%</span></div>
          <div class="stat-row"><span class="stat-label">العملات</span><span class="stat-value">${s.currencies||'—'}</span></div>
          <div class="stat-row"><span class="stat-label">الدفعات (مسددة/إجمالي)</span><span class="stat-value">${s.paidCount}/${s.paymentCount}</span></div>
