<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المشتريات — العز للعود (v2 Preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f8f9fb;--surface:#fff;--text:#1a1a2e;--muted:#6b7280;
  --primary:#2563eb;--primary-light:#dbeafe;--danger:#ef4444;--danger-light:#fee2e2;
  --success:#16a34a;--success-light:#dcfce7;--warn:#f59e0b;--warn-light:#fef3c7;
  --border:#e5e7eb;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --chart-1:#2563eb;--chart-2:#7c3aed;--chart-3:#059669;--chart-4:#dc2626;
  --chart-5:#d97706;--chart-6:#0891b2;--chart-7:#db2777;--chart-8:#4f46e5;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--muted:#94a3b8;
    --primary:#3b82f6;--primary-light:#1e3a5f;--danger:#f87171;--danger-light:#3f1d1d;
    --success:#4ade80;--success-light:#14532d;--warn:#fbbf24;--warn-light:#422006;
    --border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .logo-wrap{background:#fff;padding:4px 10px;border-radius:6px;display:flex;align-items:center}
.topbar .brand img{height:26px;width:auto;object-fit:contain;display:block}
.topbar h1{font-size:16px;font-weight:700;color:var(--primary)}
.topbar .whoami{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.container{max-width:1400px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;background:var(--surface);padding:6px;border-radius:var(--radius);box-shadow:var(--shadow)}
.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted);transition:.2s}
.tabs button.active{background:var(--primary);color:#fff;font-weight:600}
.tabs button:hover:not(.active){background:var(--primary-light);color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);font-weight:600;text-align:right;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--primary-light)}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{opacity:.85}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:160px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text)}
.field textarea{min-height:60px;resize:vertical}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:var(--success-light);color:var(--success)}
.badge.warn{background:var(--warn-light);color:var(--warn)}
.badge.bad{background:var(--danger-light);color:var(--danger)}
.badge.info{background:var(--primary-light);color:var(--primary)}
.muted{font-size:12px;color:var(--muted)}
.sh-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.sh-row input,.sh-row select{border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);min-width:0}

/* KPI Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-card .kpi-icon{font-size:28px;margin-bottom:6px}
.kpi-card .kpi-value{font-size:28px;font-weight:700;line-height:1.2}
.kpi-card .kpi-label{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-card .kpi-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--border)}
.kpi-card .kpi-bar-fill{height:100%;border-radius:0 2px 2px 0;transition:width .5s}
.kpi-card.green .kpi-value{color:var(--success)}
.kpi-card.green .kpi-bar-fill{background:var(--success)}
.kpi-card.red .kpi-value{color:var(--danger)}
.kpi-card.red .kpi-bar-fill{background:var(--danger)}
.kpi-card.blue .kpi-value{color:var(--primary)}
.kpi-card.blue .kpi-bar-fill{background:var(--primary)}
.kpi-card.amber .kpi-value{color:var(--warn)}
.kpi-card.amber .kpi-bar-fill{background:var(--warn)}

.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-top:14px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-card h4{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.chart-card canvas{max-height:280px}

/* Comparison */
.compare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.supplier-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.supplier-card h4{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--primary)}
.supplier-card .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.supplier-card .stat-row:last-child{border-bottom:none}
.supplier-card .stat-label{color:var(--muted)}
.supplier-card .stat-value{font-weight:600}

/* Nama toggle */
.nama-toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.nama-toggle.uploaded{border-color:var(--success);background:var(--success-light)}
.nama-toggle input{width:auto}

/* Auth */
.auth-box{max-width:360px;margin:80px auto;background:var(--surface);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);text-align:center}
.auth-box h2{margin-bottom:16px;font-size:18px;color:var(--primary)}
.auth-box p{color:var(--muted);font-size:13px;margin-bottom:16px}
.pending-box{max-width:400px;margin:80px auto;text-align:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--primary)}

/* Toast */
.toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200}
.toast-msg{background:var(--text);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:13px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Attachment area */
.attach-area{border:2px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;margin-top:10px}
.attach-area.dragover{border-color:var(--primary);background:var(--primary-light)}
.attach-list{margin-top:8px;font-size:12px}
.attach-list a{color:var(--primary);text-decoration:none}
.attach-list a:hover{text-decoration:underline}

@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .charts-row{grid-template-columns:1fr}
  .compare-grid{grid-template-columns:1fr}
  .row{flex-direction:column}
  .row>.field{min-width:100%}
  .topbar{padding:8px 12px}
  .container{padding:10px}
}
/* ===== v2 ===== */
/* ===== v2 DESIGN SYSTEM (layered over the original stylesheet) ===== */
:root{
  --bg:#f3f5fa;--surface:#ffffff;--surface-2:#f8f9fd;--text:#0f1b33;--muted:#64708a;
  --primary:#1f5eff;--primary-2:#6a3df0;--primary-light:#e6edff;
  --border:#e3e8f2;--radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 8px 24px -12px rgba(15,27,51,.14);
  --shadow-lg:0 2px 4px rgba(15,27,51,.06),0 24px 48px -20px rgba(15,27,51,.28);
  --glass:rgba(255,255,255,.72);--ring:rgba(31,94,255,.35);
  --st-production:#8b5cf6;--st-ready:#0ea5e9;--st-sea:#2563eb;--st-near:#f59e0b;--st-port:#ec4899;--st-cleared:#14b8a6;--st-received:#16a34a;--st-late:#ef4444;
  --font-ar:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-en:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0a1020;--surface:#121a2e;--surface-2:#17213a;--text:#e8edf8;--muted:#93a1bf;
  --primary:#5b8cff;--primary-2:#9b7bff;--primary-light:#1a2a52;
  --danger:#f87171;--danger-light:#3a1b22;--success:#4ade80;--success-light:#12331f;--warn:#fbbf24;--warn-light:#3a2c0b;
  --border:#243153;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 28px 56px -20px rgba(0,0,0,.8);
  --glass:rgba(18,26,46,.72);--ring:rgba(91,140,255,.45);
}
html[data-theme="light"]{
  --bg:#f3f5fa;--surface:#ffffff;--text:#0f1b33;--muted:#64708a;--primary:#1f5eff;--primary-light:#e6edff;
  --danger:#ef4444;--danger-light:#fee2e2;--success:#16a34a;--success-light:#dcfce7;--warn:#d97706;--warn-light:#fef3c7;--border:#e3e8f2;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html[lang="en"] body{font-family:var(--font-en)}
html[lang="ar"] body{font-family:var(--font-ar)}
body{font-size:14px;line-height:1.55;transition:background .35s,color .35s;overflow-x:hidden;
  background:
    radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--primary) 9%,transparent),transparent 60%),
    radial-gradient(900px 480px at -10% 10%,color-mix(in srgb,var(--primary-2) 8%,transparent),transparent 60%),
    var(--bg);
  background-attachment:fixed}
/* themed tab backdrops (procedural SVG, no external images) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;transition:opacity .5s;
  background-repeat:no-repeat;background-position:bottom center;background-size:cover}
body[data-tab="shipments"]::before,body[data-tab="dashboard"]::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 400' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%231f5eff' stop-opacity='0'/><stop offset='1' stop-color='%231f5eff' stop-opacity='.16'/></linearGradient></defs><rect width='1440' height='400' fill='url(%23g)'/><path d='M0 320 C180 280 300 360 480 320 S800 280 960 320 1250 360 1440 310 V400 H0Z' fill='%231f5eff' fill-opacity='.08'/><path d='M0 350 C200 320 340 390 520 350 S840 320 1000 350 1280 385 1440 345 V400 H0Z' fill='%236a3df0' fill-opacity='.08'/></svg>")}
body[data-tab="orders"]::before,body[data-tab="aging"]::before,body[data-tab="season"]::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 400' preserveAspectRatio='none'><g fill='none' stroke='%231f5eff' stroke-opacity='.10'><path d='M40 380 v-90 h60 v90 M120 380 v-120 h40 v120 M180 380 v-70 h80 v70 M300 380 v-150 h50 v150 M370 380 v-100 h70 v100'/><circle cx='1200' cy='140' r='60'/><circle cx='1200' cy='140' r='100'/><path d='M1140 380 q60 -140 120 0'/></g></svg>")}
body[data-tab="warehouse_receipts"]::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 400' preserveAspectRatio='none'><g fill='%2314b8a6' fill-opacity='.07'><rect x='60' y='240' width='160' height='160'/><rect x='240' y='290' width='120' height='110'/><rect x='380' y='220' width='200' height='180'/><rect x='980' y='260' width='140' height='140'/><rect x='1140' y='210' width='220' height='190'/></g></svg>")}
html[data-theme="dark"] body::before{opacity:.9}

/* ----- topbar ----- */
.topbar{padding:10px clamp(12px,3vw,28px);gap:12px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border)}
.topbar>div:first-child{min-width:0}
.topbar h1{font-size:clamp(14px,2.2vw,17px);background:linear-gradient(90deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand{min-width:0}
.topbar .brand img{height:30px}
.tb-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);height:34px;min-width:34px;padding:0 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.tb-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.tb-btn:focus-visible,.kpi-card:focus-visible,.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.topbar .whoami{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ----- tabs: scrollable pill bar ----- */
.container{max-width:1480px;padding:clamp(10px,2vw,22px)}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);position:sticky;top:58px;z-index:40;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border-radius:999px;padding:8px 16px;white-space:nowrap;flex-shrink:0;font-weight:500}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 6px 16px -6px var(--primary)}

/* ----- cards, tables, forms ----- */
.card,.chart-card,.supplier-card{border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s}
.card:hover,.chart-card:hover{box-shadow:var(--shadow-lg)}
.btn{border-radius:999px;padding:8px 18px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent}
.btn.primary:hover{opacity:1;filter:brightness(1.08);transform:translateY(-1px)}
.field input,.field select,.field textarea,.sh-row input,.sh-row select{border-radius:var(--radius-sm);background:var(--surface-2)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ring);border-color:var(--primary)}
th{background:var(--surface-2);text-align:start;position:sticky;top:0;z-index:2}
tr:hover td{background:color-mix(in srgb,var(--primary-light) 55%,transparent)}
.badge{border-radius:999px;padding:3px 10px}
.modal{border-radius:20px;box-shadow:var(--shadow-lg);animation:popIn .25s ease}
.modal-overlay{backdrop-filter:blur(6px);background:rgba(8,12,24,.5)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.toast-msg{border-radius:999px;box-shadow:var(--shadow-lg)}
#tab-content>*{animation:riseIn .45s cubic-bezier(.2,.7,.2,1) both}
#tab-content>*:nth-child(2){animation-delay:.04s}#tab-content>*:nth-child(3){animation-delay:.08s}#tab-content>*:nth-child(4){animation-delay:.12s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ----- KPI cards (animated, interactive) ----- */
.kpi-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.kpi-card{--kc:var(--primary);text-align:start;padding:16px 16px 18px;border-radius:var(--radius);cursor:default;transition:transform .25s,box-shadow .25s,border-color .25s;
  background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 7%,var(--surface)),var(--surface) 60%);animation:riseIn .5s both}
.kpi-card.green{--kc:var(--success)}.kpi-card.red{--kc:var(--danger)}.kpi-card.blue{--kc:var(--primary)}.kpi-card.amber{--kc:var(--warn)}
.kpi-card[data-go]{cursor:pointer}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--kc) 50%,var(--border))}
.kpi-card .kpi-icon{--p:100;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;margin:0 0 10px;position:relative;
  background:conic-gradient(var(--kc) calc(var(--p)*1%),color-mix(in srgb,var(--kc) 14%,transparent) 0)}
.kpi-card .kpi-icon::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.kpi-card .kpi-icon>*,.kpi-card .kpi-icon{isolation:isolate}
.kpi-card .kpi-icon span{position:relative;z-index:1}
.kpi-card .kpi-value{font-size:clamp(24px,3vw,31px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--kc)!important}
.kpi-card .kpi-label{font-size:12.5px;line-height:1.4}
.kpi-card .kpi-bar{height:5px;background:color-mix(in srgb,var(--kc) 12%,transparent)}
.kpi-card .kpi-bar-fill{background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 55%,#fff))!important;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.kpi-card .kpi-spark{position:absolute;inset-inline-end:12px;top:14px;width:64px;height:28px;opacity:.9}
.kpi-section-title{display:flex;align-items:center;gap:10px;margin:22px 4px 10px;font-size:15px;font-weight:700}
.kpi-section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.kpi-section-title small{font-weight:500;color:var(--muted);font-size:12px}
.charts-row{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}

/* ----- Logistics control tower ----- */
.lg-wrap{display:grid;gap:14px;margin-bottom:16px}
.stage3d{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-lg);
  height:clamp(260px,38vw,400px);background:linear-gradient(180deg,#0b1d3f 0%,#103a73 52%,#0e5c8e 53%,#0a2d52 100%)}
html[data-theme="light"] .stage3d{background:linear-gradient(180deg,#bcd9ff 0%,#e4f0ff 52%,#2f7fc4 53%,#1c5d98 100%)}
.stage3d.compact{height:clamp(170px,24vw,240px)}
.stage3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage3d .fallback{position:absolute;inset:0;display:none}
.stage3d.no-webgl .fallback{display:block}
.stage-zones{position:absolute;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;pointer-events:none}
.zone{pointer-events:auto;cursor:pointer;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px;transition:.25s;min-width:0}
.zone:hover{transform:translateY(-3px);border-color:var(--primary)}
.zone .zi{font-size:20px}
.zone b{font-size:20px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.zone span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-title{position:absolute;inset-inline-start:16px;top:12px;color:#fff;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.45);font-size:15px;display:flex;gap:8px;align-items:center}
html[data-theme="light"] .stage-title{color:#0b2a55;text-shadow:0 1px 8px rgba(255,255,255,.7)}
.stage-title i{font-style:normal;font-weight:500;font-size:12px;opacity:.85}
.stage-ctl{position:absolute;inset-inline-end:12px;top:10px;display:flex;gap:6px}
.stage-ctl button{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:999px;height:30px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}
.stage-ctl button:hover{border-color:var(--primary)}

.pipeline{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.pl-step{flex:1 0 128px;position:relative;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-inline-start-width:0;cursor:pointer;transition:.25s;--c:var(--primary)}
.pl-step:first-child{border-inline-start-width:1px;border-start-start-radius:var(--radius);border-end-start-radius:var(--radius)}
.pl-step:last-child{border-start-end-radius:var(--radius);border-end-end-radius:var(--radius)}
.pl-step:hover,.pl-step.on{background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:inset 0 -3px 0 var(--c)}
.pl-step .n{font-size:26px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.pl-step .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.pl-step .q{font-size:11px;color:var(--muted);opacity:.85;margin-top:2px}
.pl-step::after{content:"";position:absolute;inset-inline-end:-1px;top:50%;width:8px;height:8px;border:solid var(--border);border-width:1px 1px 0 0;background:var(--surface);transform:translate(50%,-50%) rotate(45deg);z-index:1}
html[dir="rtl"] .pl-step::after{transform:translate(-50%,-50%) rotate(-135deg)}
.pl-step:last-child::after{display:none}

.lg-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:14px}
.sea-box,.wh-box,.radar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sea-box h4,.wh-box h4,.radar h4{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sea-box h4 small,.wh-box h4 small,.radar h4 small{color:var(--muted);font-weight:500;font-size:11px}
.sea-lane{position:relative;height:74px;border-radius:12px;overflow:hidden;margin-bottom:8px;background:linear-gradient(180deg,#dff0ff 0%,#dff0ff 46%,#2d86d0 46%,#124e8a 100%)}
html[data-theme="dark"] .sea-lane{background:linear-gradient(180deg,#0f2748 0%,#0f2748 46%,#1b5a97 46%,#0a2a4d 100%)}
.sea-lane::before{content:"";position:absolute;left:0;right:0;top:46%;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 14px,transparent 14px 34px);animation:waves 3.2s linear infinite;opacity:.6}
@keyframes waves{to{background-position:68px 0}}
.sea-lane .port{position:absolute;top:8px;font-size:11px;font-weight:700;color:var(--text);background:var(--glass);padding:2px 8px;border-radius:999px}
.sea-lane .port.a{inset-inline-start:8px}.sea-lane .port.b{inset-inline-end:8px}
.ship{position:absolute;top:20px;font-size:26px;transform:translateX(-50%);transition:left 1.4s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite;cursor:pointer}
html[dir="rtl"] .ship{transform:translateX(50%) scaleX(-1)}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-3px}}
.ship small{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;background:var(--glass);padding:0 6px;border-radius:6px;color:var(--text);font-weight:600}
html[dir="rtl"] .ship small{transform:translateX(-50%) scaleX(-1)}
.sea-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px;flex-wrap:wrap}
.sea-row:last-child{border-bottom:none}
.sea-row .bar{flex:1 1 120px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--primary) 14%,transparent);overflow:hidden;min-width:80px}
.sea-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-2));width:0;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.cont-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr}
.wh-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wh-in,.wh-out{border-radius:12px;padding:12px;border:1px solid var(--border);background:var(--surface-2)}
.wh-in b,.wh-out b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
.wh-in b{color:var(--st-received)}
.wh-out{border-style:dashed;opacity:.85}
.wh-out b{color:var(--muted);font-size:18px}
.wh-note{font-size:11px;color:var(--muted);margin-top:8px}
.radar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;flex-wrap:wrap}
.radar-row:last-child{border-bottom:none}
.radar-row .d{min-width:62px;text-align:center;font-weight:800;font-size:13px;border-radius:10px;padding:4px 8px;background:color-mix(in srgb,var(--c,var(--primary)) 14%,transparent);color:var(--c,var(--primary));font-variant-numeric:tabular-nums}
.stage-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.stage-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.flag-chip{display:inline-block;margin-inline-start:4px;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;background:var(--danger-light);color:var(--danger)}
.ms-strip{display:flex;gap:2px;margin-top:5px}
.ms-strip i{flex:1;height:4px;border-radius:99px;background:var(--border)}
.ms-strip i.on{background:var(--primary)}
.empty-note{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:12px}

/* ----- RTL/LTR logical fixes ----- */
html[dir="ltr"] th{text-align:left}
html[dir="ltr"] .tabs{direction:ltr}
.toast-root{inset-inline:0;left:0;right:0;display:flex;justify-content:center;transform:none;pointer-events:none}
.toast-msg{pointer-events:auto}

/* ----- Mobile: tables become cards ----- */
@media(max-width:820px){
  .topbar .muted{display:none}
  .topbar .brand img{height:24px}
  .tabs{top:52px}
  .zone b{font-size:16px}.zone span{font-size:10px}.zone .zi{font-size:16px}
  .stage-zones{grid-template-columns:repeat(2,1fr)}
  .stage3d{height:clamp(300px,70vw,380px)}
  .wh-split{grid-template-columns:1fr}
}
@media(max-width:700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-card{padding:12px}
  .kpi-card .kpi-icon{width:38px;height:38px;font-size:17px;margin-bottom:6px}
  .kpi-card .kpi-spark{display:none}
  .toolbar{align-items:stretch}
  .toolbar .row{flex:1 1 100%!important}
  .card{padding:12px}
  .modal{padding:16px;max-height:92vh;border-radius:18px}
  .card>div[style*="overflow:auto"]{overflow:visible!important;max-height:none!important}
  table.rt{display:block}
  table.rt thead{display:none}
  table.rt tbody{display:grid;gap:10px}
  table.rt tr{display:block;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:6px 12px}
  table.rt td{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px dashed var(--border);padding:7px 0;text-align:end;word-break:break-word}
  table.rt td:last-child{border-bottom:none;justify-content:flex-end}
  table.rt td::before{content:attr(data-label);flex:0 0 38%;max-width:40%;text-align:start;color:var(--muted);font-size:11.5px;font-weight:600}
  table.rt td:not([data-label])::before,table.rt td[data-label=""]::before{display:none}
  table.rt td:first-child:not([data-label]){justify-content:flex-start}
  table.rt tr:hover td{background:transparent}
}
@media(max-width:420px){.tb-btn .lbl{display:none}.pl-step{flex-basis:108px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media print{.topbar,.tabs,.stage3d,.tb-tools{display:none!important}body{background:#fff}}

/* ----- v2 addenda ----- */
html[dir="rtl"] .stage3d canvas{transform:scaleX(-1)}
.ship{transition:inset-inline-start 1.4s cubic-bezier(.2,.7,.2,1)}
.kpi-card .kpi-icon>span{position:relative;z-index:1;line-height:1}
.pl-step:focus-visible,.zone:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.lg-wrap .kpi-grid{margin-bottom:2px}
.radar-row .d{--c:var(--primary)}
.sea-row,.radar-row{align-items:center}
.stage3d .fallback{width:100%;height:100%}
@media(max-width:700px){.stage-ctl{top:auto;bottom:calc(100% - 44px);inset-inline-end:8px}.stage-title{font-size:13px;inset-inline-end:8px;flex-wrap:wrap}.stage-title i{display:none}}
.btn,.tb-btn,.stage-ctl button{white-space:nowrap}
.toolbar>.row{flex-wrap:nowrap}
#v2-badge{opacity:.7!important;font-size:10px!important;padding:2px 9px!important}
@media(max-width:700px){
  table.rt td .tdv{flex:1;min-width:0;text-align:end}
  table.rt td:first-child:not([data-label]) .tdv{text-align:start}
  .pipeline{margin-inline:-2px}
  .tabs{max-width:100%}
}
@media(max-width:700px){
  .stage-ctl{top:40px;bottom:auto;inset-inline-end:auto;inset-inline-start:10px}
  .stage-title{inset-inline-end:10px}
}
@media(max-width:480px){.topbar .whoami>span{display:none}.topbar h1{font-size:13px}}

</style>

<script>
// ============================================================
// CONFIG & INIT
// ============================================================
const SUPABASE_URL = 'https://rpbxrtteuwldqhlkgfro.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwYnhydHRldXdsZHFobGtnZnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjk2NjQsImV4cCI6MjEwODg0NTY2NH0.5ei5DrLLUFXeOgT6t_KyWoxUrbIoCx8RLerroA0nkdg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function emailFor(input){
  if (input.includes('@')) return input;
  return input.trim().toLowerCase() + '@users.alezz-oud.com';
}

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentProfile = null;
let activeTab = 'dashboard';
let cache = { suppliers:[], orders:[], lines:[], payments:[], shipments:[], shipmentItems:[], shipmentContainers:[], season:[], profiles:[], audit:[], attachments:[], samples:[], warehouseReceipts:[], warehouseReceiptLines:[], warehouseReceiptPos:[], paymentComments:[], financePayments:[], backupLog:[] };
let chartInstances = {};
let selectedOrderIds = new Set();
let dashFilter = { from:'', to:'', supplier:'', category:'' };

// ============================================================
// UTILITIES
// ============================================================
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast-root').append(el);
  setTimeout(()=>el.remove(), 3000);
}
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('ar-SA') : '—'; }
function fmtNum(n){ return n!=null ? Number(n).toLocaleString('ar-SA',{maximumFractionDigits:2}) : '—'; }
function val(id){ return document.getElementById(id)?.value ?? ''; }

const CHART_COLORS = ['#2563eb','#7c3aed','#059669','#dc2626','#d97706','#0891b2','#db2777','#4f46e5','#84cc16','#f43f5e'];

// ============================================================
// AUTH
// ============================================================
let isSignup = false;
document.getElementById('a-toggle').onclick = (e) => {
  e.preventDefault();
  isSignup = !isSignup;
  document.getElementById('a-toggle').textContent = isSignup ? 'لديك حساب؟ سجل دخولك' : 'إنشاء حساب جديد';
  document.getElementById('a-submit').textContent = isSignup ? 'إنشاء حساب' : 'دخول';
};
document.getElementById('a-submit').onclick = async () => {
  const email = emailFor(val('a-user'));
  const pass = val('a-pass');
  if (!pass) { document.getElementById('a-error').textContent = 'أدخل كلمة المرور'; return; }
  document.getElementById('a-error').textContent = '';
  try {
    let res;
    if (isSignup) {
      res = await sb.auth.signUp({ email, password: pass, options:{ data:{ username: val('a-user').trim().toLowerCase() } } });
    } else {
      res = await sb.auth.signInWithPassword({ email, password: pass });
    }
    if (res.error) throw res.error;
  } catch(e) { document.getElementById('a-error').textContent = e.message; }
};

function signOut(){ sb.auth.signOut(); }

sb.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user || null;
  await boot();
});

async function boot(){
  if (!currentUser) {
    showView('auth');
    document.getElementById('whoami').innerHTML = '';
    return;
  }
  const { data: profile } = await sb.from('erp_profiles').select('*').eq('id', currentUser.id).maybeSingle();
  currentProfile = profile;
  if (!profile || profile.role === 'pending') {
    showView('pending');
    document.getElementById('btn-signout-pending').onclick = signOut;
    return;
  }
  showView('app');
  renderWhoAmI();
  await refreshAll();
  const myTabs = TAB_DEFS.filter(t=>t.roles.includes(currentProfile.role));
  if (!myTabs.find(t=>t.id===activeTab)) activeTab = myTabs[0]?.id || 'dashboard';
  renderTabs();
  renderActiveTab();
}

function showView(v){
  ['auth-view','pending-view','app-view'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById(v+'-view').style.display = '';
}

function renderWhoAmI(){
  document.getElementById('whoami').innerHTML = `
    <span>${escHtml(currentProfile.full_name || currentProfile.username)} (${ROLE_LABELS[currentProfile.role]||currentProfile.role})</span>
    <button class="btn small" onclick="signOut()">خروج</button>
  `;
}

// ============================================================
// DATA LOADING
// ============================================================
async function refreshAll(){
  const role = currentProfile.role;
  // المالية: لا تقرأ أي جدول مباشرة — فقط الدفعات عبر دالة آمنة + التعليقات
  if (role === 'finance') {
    const [fp, pc] = await Promise.all([
      sb.rpc('erp_finance_payments'),
      sb.from('erp_payment_comments').select('*').order('created_at'),
    ]);
    if (fp.error) toast('تعذّر تحميل الدفعات: ' + fp.error.message);
    cache.financePayments = Array.isArray(fp.data) ? fp.data : [];
    cache.paymentComments = pc.data || [];
    return;
  }
  const isOwner = role === 'owner';
  const empty = Promise.resolve({ data: [] });
  const [s,o,l,p,sh,sp,pr,au,at,sm,wr,wl,pc,si,sc,bl,wp] = await Promise.all([
    sb.from('erp_suppliers').select('*').order('name'),
    sb.from('erp_purchase_orders').select('*').order('created_at',{ascending:false}),
    sb.from('erp_po_line_items').select('*').order('created_at'),
    sb.from('erp_payments').select('*').order('due_date'),
    sb.from('erp_shipments').select('*').order('created_at',{ascending:false}),
    sb.from('erp_season_plan').select('*').order('need_by_date'),
    sb.from('erp_profiles').select('*').order('username'),
    isOwner ? sb.from('erp_audit_log').select('*').order('changed_at',{ascending:false}).limit(100) : empty,
    sb.from('erp_attachments').select('*').order('created_at',{ascending:false}),
    sb.from('erp_samples').select('*').order('created_at',{ascending:false}),
    sb.from('erp_warehouse_receipts').select('*').order('created_at',{ascending:false}),
    sb.from('erp_warehouse_receipt_lines').select('*').order('created_at'),
    role === 'warehouse' ? empty : sb.from('erp_payment_comments').select('*').order('created_at'),
    sb.from('erp_shipment_items').select('*').order('created_at'),
    sb.from('erp_shipment_containers').select('*').order('created_at'),
    isOwner ? sb.from('erp_backup_log').select('*').order('created_at',{ascending:false}).limit(30) : empty,
    sb.from('erp_warehouse_receipt_pos').select('*').order('created_at'),
  ]);
  cache.suppliers = s.data||[];
  cache.orders = o.data||[];
  cache.lines = l.data||[];
  cache.payments = p.data||[];
  cache.shipments = sh.data||[];
  cache.shipmentItems = si.data||[];
  cache.shipmentContainers = sc.data||[];
  cache.backupLog = bl.data||[];
  cache.season = sp.data||[];
  cache.profiles = pr.data||[];
  cache.audit = au.data||[];
  cache.attachments = at.data||[];
  cache.samples = sm.data||[];
  cache.warehouseReceipts = wr.data||[];
  cache.warehouseReceiptLines = wl.data||[];
  cache.warehouseReceiptPos = wp.data||[];
  cache.paymentComments = pc.data||[];
}

function supplierName(id){ const s = cache.suppliers.find(x=>x.id===id); return s ? s.name : '—'; }
function linesFor(poId){ return cache.lines.filter(l=>l.po_id===poId); }
function paymentsFor(poId){ return cache.payments.filter(p=>p.po_id===poId); }
// ----- ربط الشحنة بالأوامر والحاويات والأصناف (شحنة واحدة قد تضم أكثر من أمر وحاوية وصنف) -----
function splitContainers(t){ return [...new Set(String(t||'').split(/[\s,;،/]+/).map(x=>x.trim()).filter(Boolean))]; }
function shipItems(shipId){ return cache.shipmentItems.filter(i=>i.shipment_id===shipId); }
function shipContainers(shipId){ return cache.shipmentContainers.filter(c=>c.shipment_id===shipId); }
function shipPoIds(s){
  const ids = [...new Set(shipItems(s.id).map(i=>i.po_id).filter(Boolean))];
  if (!ids.length && s.po_id) ids.push(s.po_id); // شحنات قديمة بدون أصناف
  return ids;
}
function shipContainerList(s){
  const l = shipContainers(s.id).map(c=>c.container_number).filter(Boolean);
  return l.length ? l : splitContainers(s.container_number);
}
function shipTotalQty(s){
  const it = shipItems(s.id);
  return it.length ? it.reduce((a,i)=>a+(Number(i.quantity)||0),0) : s.total_quantity;
}
function shipPoNumbers(s){ return shipPoIds(s).map(id=>cache.orders.find(o=>o.id===id)?.po_number||'—'); }
function shipSupplierNames(s){
  return [...new Set(shipPoIds(s).map(id=>{ const o=cache.orders.find(x=>x.id===id); return o?supplierName(o.supplier_id):null; }).filter(Boolean))];
}
function shipLabel(s){ const c = shipContainerList(s); return c.length ? c.join(' / ') : 'بدون رقم حاوية'; }
// ----- رابط التتبع: رقم البوليصة (B/L) أو رابط كامل -----
// مواقع الشركات الرسمية لا تقبل الرقم داخل الرابط، فنفتح صفحة التتبع وننسخ الرقم تلقائيًا للصقه.
const TRACK_CARRIERS = [
  { name:'MSC',     line:/msc|mediterranean/i,  bl:/^MEDU/i,         url:'https://www.msc.com/en/track-a-shipment' },
  { name:'CMA CGM', line:/cma|cgm/i,            bl:/^CMDU/i,         url:'https://www.cma-cgm.com/ebusiness/tracking' },
  { name:'ESL',     line:/\besl\b|emirates/i,   bl:/^(ESL|EMI)/i,    url:'https://www.emiratesline.com/track/' },
];
function trackInfo(shippingLine, value){
  const v = String(value||'').trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return { kind:'url', href:v };
  const c = TRACK_CARRIERS.find(c=>c.line.test(shippingLine||'')) || TRACK_CARRIERS.find(c=>c.bl.test(v));
  return c ? { kind:'ref', ref:v, href:c.url, carrier:c.name } : { kind:'ref', ref:v, href:null, carrier:null };
}
function trackCell(s){
  const t = trackInfo(s.shipping_line, s.tracking_url);
  if (!t) return '—';
  if (t.kind === 'url') return `<a href="${escHtml(t.href)}" target="_blank" rel="noopener" class="btn small" style="color:var(--primary)">تتبع ↗</a>`;
  if (!t.href) return `<span title="حدّد شركة الشحن (MSC / CMA / ESL) ليتحول الرقم لرابط">${escHtml(t.ref)}</span>`;
  return `<a href="${t.href}" target="_blank" rel="noopener" class="btn small trk-copy" data-ref="${escHtml(t.ref)}" style="color:var(--primary)" title="ينسخ الرقم ويفتح موقع ${t.carrier}">${escHtml(t.ref)} ↗</a>`;
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}
document.addEventListener('click', async (e)=>{
  const a = e.target.closest('.trk-copy'); if (!a) return;
  const ok = await copyText(a.dataset.ref);
  toast(ok ? `تم نسخ رقم البوليصة ${a.dataset.ref} — الصقه (Ctrl+V) في خانة البحث` : `انسخ الرقم يدويًا: ${a.dataset.ref}`);
});
function shipmentsFor(poId){ return cache.shipments.filter(s=>shipPoIds(s).includes(poId)); }
function attachmentsFor(entityType, entityId){ return cache.attachments.filter(a=>a.entity_type===entityType && a.entity_id===entityId); }
function receiptLinesFor(receiptId){ return cache.warehouseReceiptLines.filter(l=>l.receipt_id===receiptId); }

// BULK DELETE (للمالك فقط) — حذف المحدد / حذف الكل في القوائم
// ============================================================
const bulkSel = {};
function bulkSet(key){ return bulkSel[key] || (bulkSel[key] = new Set()); }
function bulkClean(key, list){
  const live = new Set(list.map(x=>x.id)); const sel = bulkSet(key);
  [...sel].forEach(id=>{ if(!live.has(id)) sel.delete(id); });
}
function bulkBarHtml(key, list){
  if (!canFullAccess()) return '';
  bulkClean(key, list);
  const n = bulkSet(key).size;
  return `<div class="toolbar" data-bulk-bar="${key}" style="background:var(--warn-light);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:8px">
    <span style="font-size:13px">🔐 صلاحية المالك — <strong data-bulk-count>${n}</strong> محدد من ${list.length}</span>
    <div class="row" style="flex:0;gap:8px">
      <button class="btn small danger" data-bulk-del-selected ${n?'':'disabled'}>حذف المحدد</button>
      <button class="btn small danger" data-bulk-del-all ${list.length?'':'disabled'}>حذف الكل (${list.length})</button>
    </div></div>`;
}
function bulkThHtml(key, list){
  if (!canFullAccess()) return '';
  return `<th><input type="checkbox" data-bulk-all="${key}" ${list.length && bulkSet(key).size===list.length?'checked':''}></th>`;
}
function bulkTdHtml(key, id){
  if (!canFullAccess()) return '';
  return `<td><input type="checkbox" class="bulk-check" data-bulk="${key}" data-id="${id}" ${bulkSet(key).has(id)?'checked':''}></td>`;
}
// opts: { table, label (اسم المفرد), plural, attachType (اختياري: حذف مرفقات السجلات المحذوفة), note (تحذير إضافي) }
function wireBulk(root, key, list, opts){
  if (!canFullAccess()) return;
  const sel = bulkSet(key);
  const bar = root.querySelector(`[data-bulk-bar="${key}"]`);
  if (!bar) return;
  const delSel = bar.querySelector('[data-bulk-del-selected]');
  const cnt = bar.querySelector('[data-bulk-count]');
  const all = root.querySelector(`[data-bulk-all="${key}"]`);
  const sync = () => {
    cnt.textContent = sel.size; delSel.disabled = sel.size === 0;
    if (all) all.checked = list.length > 0 && sel.size === list.length;
  };
  if (all) all.onchange = (e) => {
    if (e.target.checked) list.forEach(x=>sel.add(x.id)); else sel.clear();
    renderActiveTab();
  };
  root.querySelectorAll(`.bulk-check[data-bulk="${key}"]`).forEach(cb=>{
    cb.onchange = () => { if (cb.checked) sel.add(cb.dataset.id); else sel.delete(cb.dataset.id); sync(); };
  });
  const run = async (ids) => {
    for (let i=0; i<ids.length; i+=100) {
      const { error } = await sb.from(opts.table).delete().in('id', ids.slice(i,i+100));
      if (error) { toast('خطأ: '+error.message+(i?` (تم حذف ${i} قبل التوقف)`:'')); await refreshAll(); renderActiveTab(); return false; }
    }
    if (opts.attachType) {
      try {
        const idSet = new Set(ids);
        const atts = cache.attachments.filter(a=>a.entity_type===opts.attachType && idSet.has(a.entity_id));
        const paths = atts.map(a=>a.file_path).filter(Boolean);
        if (paths.length) await sb.storage.from('erp-attachments').remove(paths);
        if (atts.length) await sb.from('erp_attachments').delete().in('id', atts.map(a=>a.id));
      } catch(e){ toast('تم الحذف، لكن تعذّر تنظيف بعض المرفقات: '+e.message); }
    }
    sel.clear();
    toast(`تم حذف ${ids.length} ${opts.label}`); await refreshAll(); renderActiveTab();
    return true;
  };
  delSel.onclick = async () => {
    const ids = [...sel]; if (!ids.length) return;
    if (!confirm(`حذف ${ids.length} ${opts.label} محدد؟ ${opts.note||''} لا يمكن التراجع.`)) return;
    await run(ids);
  };
  bar.querySelector('[data-bulk-del-all]').onclick = async () => {
    const ids = list.map(x=>x.id); if (!ids.length) return;
    if (!confirm(`حذف جميع ${opts.plural} (${ids.length})؟ ${opts.note||''} هذا إجراء نهائي لا يمكن التراجع عنه.`)) return;
    if (!confirm(`تأكيد أخير: سيتم حذف كل ${opts.plural} المعروضة الآن (${ids.length}). متابعة؟`)) return;
    await run(ids);
  };
}

function dashboardCategories(){
  return [...new Set(cache.lines.map(l=>l.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
}

function renderDashboard(root){
  // ---- Apply dashboard filters (date range / supplier / category) ----
  const fOrders = cache.orders.filter(o=>{
    if (dashFilter.from && (!o.order_date || o.order_date < dashFilter.from)) return false;
    if (dashFilter.to && (!o.order_date || o.order_date > dashFilter.to)) return false;
    if (dashFilter.supplier && o.supplier_id !== dashFilter.supplier) return false;
    return true;
  });
  const fOrderIds = new Set(fOrders.map(o=>o.id));
  const fLines = cache.lines.filter(l=> fOrderIds.has(l.po_id) && (!dashFilter.category || l.category === dashFilter.category));
  // When a category filter is active, keep only orders that actually have a matching line
  const scopedOrders = dashFilter.category ? fOrders.filter(o=> fLines.some(l=>l.po_id===o.id)) : fOrders;
  const scopedOrderIds = new Set(scopedOrders.map(o=>o.id));
  const fPayments = cache.payments.filter(p=>{
    if (dashFilter.supplier && p.supplier_id && p.supplier_id !== dashFilter.supplier) return false;
    if (p.po_id) return scopedOrderIds.has(p.po_id);
    return !dashFilter.category; // payments with no linked PO have no category to match
  });
  const fShipments = cache.shipments.filter(s=>{ const ids = shipPoIds(s); return ids.length ? ids.some(id=>scopedOrderIds.has(id)) : true; });
  const dashLinesFor = (poId) => fLines.filter(l=>l.po_id===poId);
  const hasFilter = !!(dashFilter.from || dashFilter.to || dashFilter.supplier || dashFilter.category);

  const totalOrders = scopedOrders.length;
  const openOrders = scopedOrders.filter(o=>o.status!=='مُستلم' && o.status!=='مُلغى').length;

  // Data completeness
  const reqFields = ['po_number','supplier_id','order_date','currency','status'];
  let filled = 0, total = 0;
  scopedOrders.forEach(o=>{ reqFields.forEach(f=>{ total++; if(o[f]) filled++; }); });
  const completeness = total ? Math.round(filled/total*100) : 0;

  // Spend by supplier
  const spendBySupplier = {};
  scopedOrders.forEach(o=>{
    const lines = dashLinesFor(o.id);
    const spend = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    const name = supplierName(o.supplier_id);
    spendBySupplier[name] = (spendBySupplier[name]||0) + spend;
  });
  const totalSpend = Object.values(spendBySupplier).reduce((a,b)=>a+b,0);
  const topSupplier = Object.entries(spendBySupplier).sort((a,b)=>b[1]-a[1])[0];
  const concentration = totalSpend ? Math.round((topSupplier?.[1]||0)/totalSpend*100) : 0;

  // HHI (Herfindahl-Hirschman Index)
  const hhi = totalSpend ? Object.values(spendBySupplier).reduce((sum,v)=>sum+Math.pow(v/totalSpend*100,2),0) : 0;

  // Spend by currency
  const spendByCurrency = {};
  scopedOrders.forEach(o=>{
    const lines = dashLinesFor(o.id);
    const spend = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    const cur = o.currency || 'غير محدد';
    spendByCurrency[cur] = (spendByCurrency[cur]||0) + spend;
  });

  // Payment status
  const payStatusCounts = {مستحقة:0, مطلوبة:0, مُعتمدة:0, 'مُحوَّلة':0};
  fPayments.forEach(p=>{ if(payStatusCounts[p.status]!==undefined) payStatusCounts[p.status]++; });

  // Overdue payments
  const today = new Date().toISOString().slice(0,10);
  const overdue = fPayments.filter(p=>p.due_date && p.due_date < today && p.status!=='مُحوَّلة');

  // Season adherence (not scoped by order/category filters — plan-level indicator)
  const linkedSeason = cache.season.filter(s=>s.linked_po_id);
  const seasonAdherence = cache.season.length ? Math.round(linkedSeason.length/cache.season.length*100) : 0;

  // Nama soft upload rate
  const namaUploaded = scopedOrders.filter(o=>o.nama_uploaded).length;
  const namaRate = totalOrders ? Math.round(namaUploaded/totalOrders*100) : 0;

  // Data quality issues
  const noDate = scopedOrders.filter(o=>!o.order_date).length;
  const noPrice = fLines.filter(l=>!l.unit_price && !l.line_total).length;

  // Order types
  const domestic = scopedOrders.filter(o=>o.order_type==='محلي').length;
  const international = scopedOrders.filter(o=>o.order_type==='دولي').length;

  // Active shipments
  const activeShipments = fShipments.filter(s=>s.status!=='مُستلم').length;

  // Closed orders + active suppliers + avg order value (SAR)
  const closedOrders = scopedOrders.filter(o=>o.status==='مُستلم').length;
  const activeSuppliersCount = cache.suppliers.filter(s=>s.is_active!==false).length;
  const ordersWithSar = scopedOrders.filter(o=>o.total_sar);
  const totalSarAll = ordersWithSar.reduce((s,o)=>s+Number(o.total_sar||0),0);
  const avgOrderValueSar = ordersWithSar.length ? totalSarAll/ordersWithSar.length : 0;

  // PO age (days) — open orders only
  const msDay = 1000*60*60*24;
  const nowMs = Date.now();
  const openAges = scopedOrders
    .filter(o=>o.status!=='مُستلم' && o.status!=='مُلغى' && o.order_date)
    .map(o=>Math.floor((nowMs - new Date(o.order_date).getTime())/msDay));
  const avgOpenAge = openAges.length ? Math.round(openAges.reduce((a,b)=>a+b,0)/openAges.length) : 0;
  const oldestOpenAge = openAges.length ? Math.max(...openAges) : 0;

  // Commitments & outstanding payments by currency (cannot sum across currencies without a conversion rate per payment — shown as a breakdown, not invented as one figure)
  const commitByCur = {}, outstandingByCur = {};
  fPayments.forEach(p=>{
    const cur = p.currency || 'غير محدد';
    commitByCur[cur] = (commitByCur[cur]||0) + Number(p.amount||0);
    if (p.status !== 'مُحوَّلة') outstandingByCur[cur] = (outstandingByCur[cur]||0) + Number(p.amount||0);
  });

  root.innerHTML = `
    <!-- Filters -->
    <div class="card" style="margin-bottom:14px">
      <div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:flex-end">
        <div class="row" style="flex:1;flex-wrap:wrap;gap:10px">
          <div class="field" style="margin:0;min-width:140px"><label>من تاريخ</label><input type="date" id="dash-from" value="${dashFilter.from}"></div>
          <div class="field" style="margin:0;min-width:140px"><label>إلى تاريخ</label><input type="date" id="dash-to" value="${dashFilter.to}"></div>
          <div class="field" style="margin:0;min-width:180px"><label>المورد</label>
            <select id="dash-supplier"><option value="">كل الموردين</option>${supplierOptions(dashFilter.supplier)}</select>
          </div>
          <div class="field" style="margin:0;min-width:160px"><label>الصنف</label>
            <select id="dash-category"><option value="">كل الأصناف</option>${dashboardCategories().map(c=>`<option value="${c}" ${dashFilter.category===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
        </div>
        <button class="btn small" id="dash-clear-filter" ${hasFilter?'':'disabled'}>مسح الفلاتر</button>
      </div>
      ${hasFilter ? `<p class="muted" style="margin-top:8px">📍 عرض مُفلتر — ${totalOrders} من ${cache.orders.length} أمر شراء. كل المؤشرات والرسوم أدناه محسوبة على النطاق المُفلتر.</p>` : ''}
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card blue">

// نص موحّد للمطابقة: بدون تشكيل/نجمة/علامة استفهام، مسافات مفردة، أحرف صغيرة
function impNorm(v){
  return String(v ?? '').replace(/[ً-ْـ]/g,'').replace(/[*؟?]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}
function impText(v){ const s = String(v ?? '').replace(/\s+/g,' ').trim(); return s || null; }
function impDigits(s){ return String(s).replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
// يرجع {v} أو {err}
function impNum(v){
  if (v === null || v === undefined || v === '') return { v:null };
  if (typeof v === 'number') return isFinite(v) ? { v } : { err:true };
  const s = impDigits(v).replace(/[,،\s]/g,'').replace('٫','.');
  if (s === '') return { v:null };
  return /^-?\d+(\.\d+)?$/.test(s) ? { v:parseFloat(s) } : { err:true };
}
function impDate(v){
  if (v === null || v === undefined || v === '') return { v:null };
  const pad = n => String(n).padStart(2,'0');
  const ok = (y,m,d) => {
    const dt = new Date(Date.UTC(y, m-1, d));
    return (y>=2000 && y<=2100 && dt.getUTCFullYear()===y && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d) ? { v:`${y}-${pad(m)}-${pad(d)}` } : { err:true };
  };
  if (typeof v === 'number') { // رقم تسلسلي من إكسل
    const p = XLSX.SSF.parse_date_code(v);
    return p ? ok(p.y, p.m, p.d) : { err:true };
  }
  if (v instanceof Date) return isNaN(v) ? { err:true } : ok(v.getFullYear(), v.getMonth()+1, v.getDate());
  const s = impDigits(v).trim();
  if (s === '') return { v:null };
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (m) return ok(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/); // يوم/شهر/سنة
  if (m) return ok(+m[3], +m[2], +m[1]);
  return { err:true };
}
function impEnum(v, allowed){
  const n = impNorm(v);
  if (!n) return { v:null };
  const hit = allowed.find(a => impNorm(a) === n);
  return hit ? { v:hit } : { err:true };
}

// يحوّل ملف الإكسل إلى صفوف خام لكل شيت: [{_row, field:value...}]
function impReadWorkbook(wb){
  const out = {}, problems = [];
  for (const [key, def] of Object.entries(IMP_SHEETS)) {
    const sheetName = wb.SheetNames.find(n => impNorm(n) === impNorm(def.name));
    if (!sheetName) { out[key] = []; problems.push(`الشيت "${def.name}" غير موجود في الملف`); continue; }
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:true, defval:null, blankrows:true });
    const header = (aoa[0] || []).map(impNorm);
    const colMap = {};
    for (const [label, field] of Object.entries(def.cols)) {
      const idx = header.indexOf(impNorm(label));
      if (idx === -1) problems.push(`الشيت "${def.name}": العمود "${label}" غير موجود`);
      else colMap[field] = idx;
    }
    out[key] = [];
    for (let r = 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const rec = { _row: r + 1 };
      let any = false;
      for (const [field, idx] of Object.entries(colMap)) {
        let cell = row[idx];
        if (typeof cell === 'string' && cell.trim() === '') cell = null;
        rec[field] = cell ?? null;
        if (cell !== null && cell !== undefined) any = true;
      }
      if (any) out[key].push(rec);
    }
  }
  return { rows: out, problems };
}

// يبني خطة الاستيراد (بدون أي كتابة على قاعدة البيانات)
function impBuildPlan(rows, db){
  const errors = [], warnings = [];
  const E = (sheet, row, msg) => errors.push(`${IMP_SHEETS[sheet].name} — صف ${row}: ${msg}`);
  const W = (sheet, row, msg) => warnings.push(`${IMP_SHEETS[sheet].name} — صف ${row}: ${msg}`);
  const key = impNorm;

  const supByKey = new Map();
  db.suppliers.forEach(s => { if (!supByKey.has(key(s.name))) supByKey.set(key(s.name), s); });
  const poByKey = new Map();
  db.orders.forEach(o => {
    if (!o.po_number) return;
    const k = key(o.po_number);
    if (poByKey.has(k)) warnings.push(`رقم الأمر "${o.po_number}" مكرر في النظام أكثر من مرة — سيتم الربط بأول سجل منه`);
    else poByKey.set(k, o);
  });

  const plan = { newSuppliers: new Map(), orders: [], lines: [], shipments: [], payments: [],
                 existingPoLinked: new Set(), skippedExisting: 0, skippedDuplicates: 0, skippedExamples: 0, errors, warnings };
  const needSupplier = (name) => { const k = key(name); if (!supByKey.has(k) && !plan.newSuppliers.has(k)) plan.newSuppliers.set(k, impText(name)); return k; };
  const newPoByKey = new Map();   // أوامر جديدة سليمة في الملف
  const warnedTotals = new Set();
  const badPoKeys = new Set();    // أوامر جديدة بها أخطاء
  const isExample = (r, checks) => key(r.po_number) === 'po-1070' && checks.every(([f, v]) => key(r[f]) === key(v));

  // ---- أوامر الشراء ----
  for (const r of rows.orders) {
    if (isExample(r, [['supplier','مصنع جيانغشي للتغليف']])) { plan.skippedExamples++; W('orders', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const poNum = impText(r.po_number);
    if (!poNum) { E('orders', r._row, 'رقم أمر الشراء مطلوب'); continue; }
    const k = key(poNum);
    if (poByKey.has(k)) { plan.skippedExisting++; continue; } // موجود مسبقًا — لا يُعدَّل
    if (newPoByKey.has(k) || badPoKeys.has(k)) { E('orders', r._row, `رقم الأمر "${poNum}" مكرر داخل الملف`); continue; }
    if (!impText(r.supplier)) E('orders', r._row, 'اسم المورد مطلوب');
    const ot = impEnum(r.order_type, ['محلي','دولي']); if (ot.err) E('orders', r._row, `نوع الأمر "${r.order_type}" غير صحيح (محلي/دولي)`);
    const cur = impEnum(r.currency, IMP_PO_CURRENCY); if (cur.err) E('orders', r._row, `العملة "${r.currency}" غير صحيحة (${IMP_PO_CURRENCY.join('/')})`);
    const st = impEnum(r.status, IMP_PO_STATUS); if (st.err) E('orders', r._row, `الحالة "${r.status}" غير صحيحة`);
    const od = impDate(r.order_date); if (od.err) E('orders', r._row, `تاريخ الأمر "${r.order_date}" غير صحيح (YYYY-MM-DD)`);
    const nd = impDate(r.need_by_date); if (nd.err) E('orders', r._row, `موعد الحاجة "${r.need_by_date}" غير صحيح (YYYY-MM-DD)`);
    const fx = impNum(r.exchange_rate); if (fx.err || (fx.v !== null && fx.v <= 0)) E('orders', r._row, `سعر الصرف "${r.exchange_rate}" غير صحيح`);
    const nama = impEnum(r.nama, ['نعم','لا']); if (nama.err) E('orders', r._row, `قيمة "رُفع على نما؟" يجب أن تكون نعم أو لا`);
    if (errors.length > before) { badPoKeys.add(k); continue; }
    if (!cur.v) W('orders', r._row, `العملة فارغة للأمر "${poNum}" — سيتم اعتماد SAR`);
    const o = { _key:k, po_number:poNum, _supKey:needSupplier(r.supplier), order_type:ot.v, currency:cur.v || 'SAR', status:st.v || 'مخطط',
                order_date:od.v, need_by_date:nd.v, exchange_rate_to_sar:fx.v, nama_uploaded:nama.v === 'نعم', notes:impText(r.notes), _lineTotal:0 };
    newPoByKey.set(k, o); plan.orders.push(o);
  }

  // يرجّع مرجع الأمر: {existing} أو {fresh} أو null (مع تسجيل الخطأ)
  const resolvePo = (sheet, r, required) => {
    const poNum = impText(r.po_number);
    if (!poNum) { if (required) E(sheet, r._row, 'رقم أمر الشراء مطلوب'); return null; }
    const k = key(poNum);
    if (poByKey.has(k)) return { existing: poByKey.get(k), k };
    if (newPoByKey.has(k)) return { fresh: newPoByKey.get(k), k };
    if (badPoKeys.has(k)) E(sheet, r._row, `أمر الشراء "${poNum}" به أخطاء في شيت "أوامر الشراء" — صحّحه أولاً`);
    else E(sheet, r._row, `أمر الشراء "${poNum}" غير موجود في النظام ولا في شيت "أوامر الشراء"`);
    return null;
  };

  // ---- بنود الأمر ----
  for (const r of rows.lines) {
    if (isExample(r, [['item_name','عبوة زجاج 50مل']])) { plan.skippedExamples++; W('lines', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('lines', r, true);
    const name = impText(r.item_name); if (!name) E('lines', r._row, 'اسم الصنف مطلوب');
    const q = impNum(r.quantity); if (q.err || (q.v !== null && q.v < 0)) E('lines', r._row, `الكمية "${r.quantity}" غير صحيحة`);
    const p = impNum(r.unit_price); if (p.err || (p.v !== null && p.v < 0)) E('lines', r._row, `سعر الوحدة "${r.unit_price}" غير صحيح`);
    if (errors.length > before || !ref) continue;
    const qty = q.v ?? 0, price = p.v ?? 0;
    if (q.v === null || p.v === null) W('lines', r._row, `الكمية أو السعر فارغ للصنف "${name}" — سيُحفظ بصفر`);
    if (ref.existing) {
      const dup = db.lines.some(l => l.po_id === ref.existing.id && key(l.item_name) === key(name) && Number(l.quantity||0) === qty && Number(l.unit_price||0) === price);
      if (dup) { plan.skippedDuplicates++; W('lines', r._row, `البند "${name}" موجود مسبقًا بنفس الكمية والسعر في الأمر ${ref.existing.po_number} — تم تجاهله`); continue; }
      plan.existingPoLinked.add(ref.k);
      if (ref.existing.total_sar && !warnedTotals.has(ref.k)) { warnedTotals.add(ref.k); warnings.push(`الأمر ${ref.existing.po_number} موجود مسبقًا وله إجمالي بالريال محفوظ — إضافة بنود جديدة لن تحدّث الإجمالي تلقائيًا (يحتاج فتح الأمر وحفظه من حساب المدير)`); }
    } else ref.fresh._lineTotal += qty * price;
    plan.lines.push({ _poKey:ref.k, item_name:name, category:impText(r.category), quantity:qty, unit_price:price, notes:impText(r.notes),
                      currency: ref.existing ? ref.existing.currency : ref.fresh.currency });
  }

  // ---- الشحنات ----
  for (const r of rows.shipments) {
    if (isExample(r, [['container_number','MSCU1234567']])) { plan.skippedExamples++; W('shipments', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('shipments', r, true);
    const rec = { container_number:impText(r.container_number), shipping_line:impText(r.shipping_line), container_contents:impText(r.container_contents),
                  tracking_url:impText(r.tracking_url), status:impText(r.status), notes:impText(r.notes) };
    const contList = splitContainers(rec.container_number);
    const tq = impNum(r.total_quantity); if (tq.err) E('shipments', r._row, `الكمية الإجمالية "${r.total_quantity}" غير صحيحة`); rec.total_quantity = tq.v;
    for (const f of IMP_SHIP_DATES) { const d = impDate(r[f]); if (d.err) E('shipments', r._row, `تاريخ "${r[f]}" غير صحيح (YYYY-MM-DD)`); rec[f] = d.v; }
    if (errors.length > before || !ref) continue;
    if (ref.existing) {
      if (contList.length && contList.every(c => db.shipments.some(s => shipPoIds(s).includes(ref.existing.id) && shipContainerList(s).some(x => key(x) === key(c))))) {
        plan.skippedDuplicates++; W('shipments', r._row, `الحاوية ${rec.container_number} مسجلة مسبقًا على الأمر ${ref.existing.po_number} — تم تجاهلها`); continue;
      }
      plan.existingPoLinked.add(ref.k);
    }
    plan.shipments.push({ _poKey:ref.k, _containers:contList, ...rec });
  }

  // ---- الدفعات ----
  for (const r of rows.payments) {
    if (isExample(r, [['reference','TT-2026-114']])) { plan.skippedExamples++; W('payments', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('payments', r, false);
    const supName = impText(r.supplier);
    if (!impText(r.po_number) && !supName) E('payments', r._row, 'يجب تحديد رقم أمر الشراء أو اسم المورد على الأقل');
    const amt = impNum(r.amount); if (amt.err || amt.v === null || amt.v <= 0) E('payments', r._row, `المبلغ "${r.amount ?? ''}" مطلوب ويجب أن يكون رقمًا أكبر من صفر`);
    const seq = impNum(r.payment_seq); if (seq.err || (seq.v !== null && (!Number.isInteger(seq.v) || seq.v < 1))) E('payments', r._row, `رقم الدفعة "${r.payment_seq}" غير صحيح`);
    const st = impEnum(r.status, IMP_PAY_STATUS); if (st.err) E('payments', r._row, `الحالة "${r.status}" غير صحيحة`);
    const dd = impDate(r.due_date); if (dd.err) E('payments', r._row, `تاريخ الاستحقاق "${r.due_date}" غير صحيح (YYYY-MM-DD)`);
    const td = impDate(r.transferred_date); if (td.err) E('payments', r._row, `تاريخ التحويل "${r.transferred_date}" غير صحيح (YYYY-MM-DD)`);
    const q = impNum(r.quantity); if (q.err) E('payments', r._row, `الكمية "${r.quantity}" غير صحيحة`);
    let cur = impEnum(r.currency, IMP_PAY_CURRENCY);
    if (cur.err) E('payments', r._row, `العملة "${r.currency}" غير صحيحة (${IMP_PAY_CURRENCY.join('/')})`);
    else if (!cur.v) {
      const poCur = ref ? (ref.existing ? ref.existing.currency : ref.fresh.currency) : null;
      if (IMP_PAY_CURRENCY.includes(poCur)) cur = { v: poCur };
      else E('payments', r._row, 'العملة مطلوبة');
    }
    if (errors.length > before || (impText(r.po_number) && !ref)) continue;
    const seqV = seq.v ?? 1;
    if (ref && ref.existing && db.payments.some(p => p.po_id === ref.existing.id && Number(p.payment_seq) === seqV && Number(p.amount) === amt.v)) {
      plan.skippedDuplicates++; W('payments', r._row, `الدفعة رقم ${seqV} بمبلغ ${amt.v} مسجلة مسبقًا على الأمر ${ref.existing.po_number} — تم تجاهلها`); continue;
    }
    if (!ref && supName && supByKey.has(key(supName)) && db.payments.some(p => !p.po_id && p.supplier_id === supByKey.get(key(supName)).id && Number(p.payment_seq) === seqV && Number(p.amount) === amt.v)) {
      plan.skippedDuplicates++; W('payments', r._row, `الدفعة رقم ${seqV} بمبلغ ${amt.v} مسجلة مسبقًا للمورد ${supName} — تم تجاهلها`); continue;
    }
    if (ref && ref.existing) plan.existingPoLinked.add(ref.k);
    if (st.v === 'مُحوَّلة' && !td.v) W('payments', r._row, 'الحالة "مُحوَّلة" بدون تاريخ تحويل');
    plan.payments.push({ _poKey: ref ? ref.k : null, _supKey: supName ? needSupplier(supName) : null,
      payment_seq:seqV, amount:amt.v, currency:cur.v, due_date:dd.v, status:st.v || 'مستحقة', transferred_date:td.v,
      reference:impText(r.reference), item_name:impText(r.item_name), category:impText(r.category), quantity:q.v, notes:impText(r.notes) });
  }

  plan.orders.forEach(o => { if (!plan.lines.some(l => l._poKey === o._key)) warnings.push(`الأمر الجديد ${o.po_number} بدون أي بنود في شيت "بنود الأمر"`); });
  plan.total = plan.orders.length + plan.lines.length + plan.shipments.length + plan.payments.length;
  return plan;
}

// ينفّذ الخطة على قاعدة البيانات بالترتيب: موردون ← أوامر ← بنود ← شحنات ← دفعات
async function impExecute(plan, client, userId, db){
  const done = { suppliers:0, orders:0, lines:0, shipments:0, payments:0 };
  const fail = (step, error) => { const e = new Error(`${step}: ${error.message}`); e.done = done; return e; };
  const supId = new Map(); db.suppliers.forEach(s => { const k = impNorm(s.name); if (!supId.has(k)) supId.set(k, s.id); });
  const poId = new Map(); db.orders.forEach(o => { if (o.po_number) { const k = impNorm(o.po_number); if (!poId.has(k)) poId.set(k, { id:o.id, supplier_id:o.supplier_id }); } });

  if (plan.newSuppliers.size) {
    const { data, error } = await client.from('erp_suppliers').insert([...plan.newSuppliers.values()].map(name => ({ name, created_by:userId }))).select();
    if (error) throw fail('إنشاء الموردين', error);
    data.forEach(s => supId.set(impNorm(s.name), s.id)); done.suppliers = data.length;
  }
  if (plan.orders.length) {
    const now = new Date().toISOString();
    const { data, error } = await client.from('erp_purchase_orders').insert(plan.orders.map(o => ({
      po_number:o.po_number, supplier_id:supId.get(o._supKey), order_type:o.order_type, currency:o.currency, status:o.status,
      order_date:o.order_date, need_by_date:o.need_by_date, notes:o.notes, exchange_rate_to_sar:o.exchange_rate_to_sar,
      total_sar: o.exchange_rate_to_sar && o._lineTotal ? Math.round(o._lineTotal * o.exchange_rate_to_sar * 100) / 100 : null,
      nama_uploaded:o.nama_uploaded, nama_uploaded_at:o.nama_uploaded ? now : null, created_by:userId,
    }))).select();
    if (error) throw fail('إنشاء أوامر الشراء', error);
    data.forEach(o => poId.set(impNorm(o.po_number), { id:o.id, supplier_id:o.supplier_id })); done.orders = data.length;
  }
  if (plan.lines.length) {
    const { error } = await client.from('erp_po_line_items').insert(plan.lines.map(l => ({
      po_id:poId.get(l._poKey).id, item_name:l.item_name, category:l.category, unit_price:l.unit_price, quantity:l.quantity,
      currency:l.currency, notes:l.notes, created_by:userId })));
    if (error) throw fail('إضافة البنود', error);
    done.lines = plan.lines.length;
  }
  if (plan.shipments.length) {
    const { data: shipData, error } = await client.from('erp_shipments').insert(plan.shipments.map(({ _poKey, _containers, ...s }) => ({ ...s, po_id:poId.get(_poKey).id, created_by:userId, updated_by:userId }))).select('id');
    if (error) throw fail('إضافة الشحنات', error);
    done.shipments = plan.shipments.length;
    const cRows = [], iRows = [];
    plan.shipments.forEach((s, i) => {
      const sid = shipData[i].id;
      (s._containers || []).forEach(n => cRows.push({ shipment_id:sid, container_number:n, created_by:userId }));
      iRows.push({ shipment_id:sid, po_id:poId.get(s._poKey).id, item_name:s.container_contents, quantity:s.total_quantity, created_by:userId });
    });
    if (cRows.length) { const r = await client.from('erp_shipment_containers').insert(cRows); if (r.error) throw fail('إضافة حاويات الشحنات', r.error); }
    if (iRows.length) { const r = await client.from('erp_shipment_items').insert(iRows); if (r.error) throw fail('إضافة أصناف الشحنات', r.error); }
  }
  if (plan.payments.length) {
    const { error } = await client.from('erp_payments').insert(plan.payments.map(({ _poKey, _supKey, ...p }) => {
      const po = _poKey ? poId.get(_poKey) : null;
      return { ...p, po_id: po ? po.id : null, supplier_id: _supKey ? supId.get(_supKey) : (po ? po.supplier_id : null), created_by:userId };
    }));
    if (error) throw fail('إضافة الدفعات', error);
    done.payments = plan.payments.length;
  }
  return done;
}

function impEsc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openImportModal(){
  if (!canWrite()) return;
  let plan = null;
  openModal(`
    <h3>استيراد من إكسل (أوامر + بنود + شحنات + دفعات)</h3>
    <p class="muted">املأ القالب المعتمد ثم ارفعه هنا. لن يُحفظ أي شيء قبل مراجعة الملخص والضغط على "تأكيد الاستيراد".
      <a href="import-template.xlsx" download>⬇️ تحميل القالب</a></p>
    <div class="field"><label>ملف الإكسل (.xlsx)</label><input type="file" id="imp-file" accept=".xlsx,.xls"></div>
    <div id="imp-preview"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="imp-run" disabled>تأكيد الاستيراد</button>
      <button class="btn" id="imp-cancel">إغلاق</button>
    </div>
  `, (root)=>{
    const preview = root.querySelector('#imp-preview');
    const runBtn = root.querySelector('#imp-run');
    const list = (items, color) => `<ul style="margin:6px 0;padding-inline-start:20px;max-height:180px;overflow:auto;font-size:13px;color:${color}">${items.map(i=>`<li>${impEsc(i)}</li>`).join('')}</ul>`;
    root.querySelector('#imp-cancel').onclick = closeModal;
    root.querySelector('#imp-file').onchange = async (e) => {
      plan = null; runBtn.disabled = true; preview.innerHTML = '';
      const file = e.target.files[0]; if (!file) return;
      try {
        await refreshAll(); // أحدث بيانات قبل المطابقة
        const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
        const { rows, problems } = impReadWorkbook(wb);
        if (problems.length) { preview.innerHTML = `<div class="card" style="border-color:var(--danger)"><strong>الملف لا يطابق القالب:</strong>${list(problems,'var(--danger)')}</div>`; return; }
        const p = impBuildPlan(rows, cache);
        const newPoCount = p.orders.length;
        preview.innerHTML = `
          <div class="card" style="margin-top:10px">
            <strong>ملخص ما سيتم إضافته</strong>
            <table style="margin-top:6px"><tbody>
              <tr><td>موردون جدد</td><td><strong>${p.newSuppliers.size}</strong> ${p.newSuppliers.size ? '— ' + impEsc([...p.newSuppliers.values()].join('، ')) : ''}</td></tr>
              <tr><td>أوامر شراء جديدة</td><td><strong>${newPoCount}</strong></td></tr>
              <tr><td>أوامر موجودة مسبقًا (ربط فقط، بدون تعديل)</td><td><strong>${p.skippedExisting}</strong></td></tr>
              <tr><td>بنود</td><td><strong>${p.lines.length}</strong></td></tr>
              <tr><td>شحنات</td><td><strong>${p.shipments.length}</strong></td></tr>
              <tr><td>دفعات</td><td><strong>${p.payments.length}</strong></td></tr>
              <tr><td>صفوف مكررة تم تجاهلها</td><td><strong>${p.skippedDuplicates}</strong></td></tr>
            </tbody></table>
            ${p.newSuppliers.size ? '<p class="muted" style="margin-top:6px">⚠️ راجع أسماء الموردين الجدد: لو أحدهم موجود في النظام باسم مختلف قليلاً، صحّح الاسم في الملف لتفادي التكرار.</p>' : ''}
          </div>
          ${p.errors.length ? `<div class="card" style="margin-top:10px;border-color:var(--danger)"><strong style="color:var(--danger)">أخطاء (${p.errors.length}) — لن يتم الاستيراد قبل تصحيحها وإعادة رفع الملف</strong>${list(p.errors,'var(--danger)')}</div>` : ''}
          ${p.warnings.length ? `<div class="card" style="margin-top:10px;border-color:var(--warn)"><strong>تنبيهات (${p.warnings.length})</strong>${list(p.warnings,'inherit')}</div>` : ''}
          ${!p.errors.length && !p.total ? '<p class="muted">لا توجد صفوف جديدة للاستيراد.</p>' : ''}`;
        if (!p.errors.length && p.total) { plan = p; runBtn.disabled = false; }
      } catch(err) { preview.innerHTML = `<p style="color:var(--danger)">تعذّرت قراءة الملف: ${impEsc(err.message)}</p>`; }
    };
    runBtn.onclick = async () => {
      if (!plan) return;
      if (!confirm(`سيتم إضافة ${plan.orders.length} أمر، ${plan.lines.length} بند، ${plan.shipments.length} شحنة، ${plan.payments.length} دفعة. متابعة؟`)) return;
      runBtn.disabled = true; runBtn.textContent = 'جارٍ الاستيراد...';
      const p = plan; plan = null;
      try {
        const d = await impExecute(p, sb, currentUser.id, cache);
        await refreshAll(); renderActiveTab(); closeModal();
        toast(`تم الاستيراد: ${d.orders} أمر، ${d.lines} بند، ${d.shipments} شحنة، ${d.payments} دفعة`);
      } catch(err) {
        const d = err.done || {};
        await refreshAll(); renderActiveTab();
        preview.innerHTML = `<div class="card" style="border-color:var(--danger)"><strong style="color:var(--danger)">توقف الاستيراد — ${impEsc(err.message)}</strong>
          <p style="font-size:13px">ما تم حفظه قبل التوقف: ${d.suppliers||0} مورد، ${d.orders||0} أمر، ${d.lines||0} بند، ${d.shipments||0} شحنة، ${d.payments||0} دفعة.
          بعد معالجة السبب أعد رفع نفس الملف: الأوامر والصفوف المحفوظة سيتم تجاهلها تلقائيًا ولن تتكرر.</p></div>`;
        runBtn.textContent = 'تأكيد الاستيراد';
      }
    };
  });
}
